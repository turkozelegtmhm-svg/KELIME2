<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YÖKDİL"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>html,body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>YÖKDİL Sosyal Kelime</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Yerleşim: tek sütun, ÖSYM optik formundan esinlenen balon haritası; kelime kartı sarı fosforlu kalem vurgusu taşır. */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#16201E; --ink2:#46544F; --ink3:#6E7C77;
  --line:#D5DDD9; --line2:#E5EBE8;
  --accent:#B87800; --accent-ink:#FFFFFF; --accent-soft:#FFF5DC; --bar:#D4A025;
  --hl:#FFE98A; --hl-ink:#16201E;
  --again-fg:#A8261D; --again-bg:#FBE9E7; --hard-fg:#7F4B00; --hard-bg:#FDF0D8;
  --good-fg:#17663A; --good-bg:#E2F3E8; --easy-fg:#1B55AE; --easy-bg:#E3EDFB;
  --st-learn:#E0A100; --st-young:#7DC4B8; --st-mature:#B87800; --st-sus:#B4BDB9; --st-new-line:#A9B6B1;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 8px 24px rgba(22,32,30,.05);
  --f-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1514; --surface:#162120; --ink:#E7EFEC; --ink2:#AEBBB6; --ink3:#86958F;
    --line:#2B3937; --line2:#223130;
    --accent:#FFB830; --accent-ink:#1A0D00; --accent-soft:#2D2200; --bar:#C49020;
    --hl:rgba(255,208,64,.28); --hl-ink:#F4F7F5;
    --again-fg:#FF9C93; --again-bg:#3A1B19; --hard-fg:#F2B866; --hard-bg:#38280F;
    --good-fg:#7ED8A0; --good-bg:#14301F; --easy-fg:#8DB9FF; --easy-bg:#162845;
    --st-learn:#E8B02A; --st-young:#3E9488; --st-mature:#FFB830; --st-sus:#4A5753; --st-new-line:#52625D;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1514; --surface:#162120; --ink:#E7EFEC; --ink2:#AEBBB6; --ink3:#86958F;
  --line:#2B3937; --line2:#223130;
  --accent:#FFB830; --accent-ink:#1A0D00; --accent-soft:#2D2200; --bar:#C49020;
  --hl:rgba(255,208,64,.28); --hl-ink:#F4F7F5;
  --again-fg:#FF9C93; --again-bg:#3A1B19; --hard-fg:#F2B866; --hard-bg:#38280F;
  --good-fg:#7ED8A0; --good-bg:#14301F; --easy-fg:#8DB9FF; --easy-bg:#162845;
  --st-learn:#E8B02A; --st-young:#3E9488; --st-mature:#FFB830; --st-sus:#4A5753; --st-new-line:#52625D;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(84px + env(safe-area-inset-bottom,0px))}

/* üst bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.logo{font:600 22px/1.1 var(--f-serif);letter-spacing:-.01em}
.logo b{color:var(--accent);font-weight:600}
.sub{font:400 11px var(--f-mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.09em}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 8px;color:var(--ink2);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

h2.sec{margin:30px 0 10px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kicker{margin:22px 0 10px;color:var(--ink2);font-size:15px}

/* bugünün üç sayısı */
.today{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stat{padding:14px 14px 12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.num{font:500 34px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lab{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;color:var(--ink2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* durum balonları: yeni boş, öğreniliyor sarı, genç açık yeşil, olgun koyu yeşil */
.s-new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--st-new-line)}
.s-learn{background:var(--st-learn)}
.s-young{background:var(--st-young)}
.s-mature{background:var(--st-mature)}
.s-sus{background:var(--st-sus);opacity:.65}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{color:var(--again-fg)}
.link{background:none;border:0;padding:10px 4px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.link[disabled]{opacity:.4;text-decoration:none;cursor:default}
.icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:6px;background:none;color:var(--ink3);flex:none}
.icon:hover{background:var(--line2);color:var(--ink)}
.cta{margin-top:14px}
.hint-line{margin:10px 0 0;color:var(--ink2);font-size:14px}

/* desteler */
.deck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.deck:first-of-type{border-top:1px solid var(--line2)}
.deck input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.d-name{display:block;font-weight:600}
.d-sub{display:block;font-size:13px;color:var(--ink3)}
.d-num{text-align:right;font:400 13px var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.pbar{display:block;width:84px;height:4px;background:var(--line);border-radius:2px;margin:6px 0 0 auto;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

/* kelime haritası */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:0 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mapg{margin-bottom:14px}
.mapl{display:flex;justify-content:space-between;font:400 12px var(--f-mono);color:var(--ink3);margin-bottom:6px}
.map{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:12px;height:12px;border-radius:50%;display:block;cursor:pointer}

/* çalışma ekranı */
.s-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.counts{display:flex;gap:14px;font:500 13px var(--f-mono);color:var(--ink3)}
.counts .on{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 26px;box-shadow:var(--shadow);min-height:240px}
.tagline{display:flex;justify-content:space-between;gap:12px;font:400 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.word-row{display:flex;align-items:center;gap:8px;margin-top:24px;flex-wrap:wrap}
.word{margin:0;font:600 clamp(38px,11vw,58px)/1.05 var(--f-serif);letter-spacing:-.015em;overflow-wrap:anywhere}
.word.sm{font-size:clamp(26px,7vw,34px)}
.mean{margin-top:18px;font:600 22px/1.3 var(--f-sans);color:var(--accent)}
.ex{margin:16px 0 0;font:400 19px/1.6 var(--f-serif);max-width:62ch}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .18em;border-radius:3px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cloze-label{margin:22px 0 0;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cloze{margin:10px 0 0;font:400 clamp(21px,5.6vw,26px)/1.55 var(--f-serif);max-width:62ch}
.blank{display:inline-block;width:calc(var(--n,6)*.5em);min-width:2.8em;border-bottom:2.5px dashed var(--ink3);margin:0 .12em}
.hint{margin:16px 0 0;color:var(--ink2);font-size:15px}
.sec3{margin:28px 0 2px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.syns{list-style:none;margin:0;padding:0}
.syn{padding:12px 0;border-top:1px solid var(--line2)}
.syn:first-child{border-top:0}
.syn-head{display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px}
.syn-w{font:600 20px var(--f-serif)}
.syn-tr{color:var(--ink2);font-size:15px}
.syn-ex{margin:2px 0 0;color:var(--ink2);font:400 16.5px/1.6 var(--f-serif)}
.syn-ex mark{color:var(--hl-ink)}
.note{margin:20px 0 0;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:14.5px}
.note span{display:block;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.dock{position:sticky;bottom:env(safe-area-inset-bottom,0px);padding:14px 0 6px;margin-top:8px;background:linear-gradient(to top,var(--paper) 78%,transparent)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px 10px;border-radius:10px;border:0;font-weight:600;min-width:0}
.rate .ri{font:400 12px var(--f-mono);opacity:.9}
.rate .rk{position:absolute;top:4px;right:7px;font:400 10px var(--f-mono);opacity:.6}
.r-again{background:var(--again-bg);color:var(--again-fg)}
.r-hard{background:var(--hard-bg);color:var(--hard-fg)}
.r-good{background:var(--good-bg);color:var(--good-fg)}
.r-easy{background:var(--easy-bg);color:var(--easy-fg)}
.done{padding:30px 0 10px}
.done h2{margin:0 0 8px;font:600 32px/1.15 var(--f-serif)}
.done p{margin:0 0 18px;color:var(--ink2)}
.stack{display:grid;gap:10px;max-width:420px}

/* kelimeler */
.tools{display:grid;grid-template-columns:1fr;gap:8px;margin:18px 0 10px}
@media (min-width:560px){.tools{grid-template-columns:1fr auto auto}}
input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:120px;font:400 12px/1.4 var(--f-mono);resize:vertical}
.meta{margin:6px 0;font:400 12px var(--f-mono);color:var(--ink3)}
.lib{list-style:none;margin:0;padding:0;border-top:1px solid var(--line2)}
.lrow{border-bottom:1px solid var(--line2)}
.lbtn{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center;width:100%;padding:12px 2px;background:none;border:0;text-align:left}
.lw{font:600 18px var(--f-serif);overflow-wrap:anywhere}
.lt{color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
.detail{padding:0 2px 18px 22px}
.detail .tagline{margin-top:2px}
.cmeta{margin:18px 0 0;font:400 12px/1.6 var(--f-mono);color:var(--ink3)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{min-height:40px;font-size:14px;padding:0 14px}

/* istatistik */
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.sbox .num{font-size:26px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.bar{fill:var(--bar)} .bar.today{fill:var(--accent)} .bar0{fill:var(--line)}
.ax{font:400 10px var(--f-mono);fill:var(--ink3)}
.axl{stroke:var(--line);stroke-width:1}
.grid{stroke:var(--line2);stroke-dasharray:2 3}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.fact b{display:block;font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--ink2)}

/* ayarlar */
.set{padding:16px 0;border-bottom:1px solid var(--line2)}
.set h3{margin:0 0 4px;font-size:16px}
.set p{margin:0 0 10px;color:var(--ink2);font-size:14px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.radio input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.radio b{display:block;font-weight:600}
.radio span{display:block;font-size:13.5px;color:var(--ink2)}
.msg{margin:8px 0 0;font-size:14px;color:var(--good-fg)}
.status{margin-top:30px;font:400 12px var(--f-mono);color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.num{font-size:28px}.stat{padding:12px 10px}}

/* ===== v2 eklemeleri ===== */
:root{
  --hm0:#EDE8DC; --hm1:#F5D890; --hm2:#EEA233; --hm3:#C07000; --hm4:#8A4E00;
  --flag-bg:#FFF1B8; --ok-line:#2E9B5F; --bad-line:#D0453B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --hm0:#2A2410; --hm1:#4A3600; --hm2:#8A5E00; --hm3:#C49020; --hm4:#FFB830;
    --flag-bg:rgba(255,208,64,.2); --ok-line:#5CC88A; --bad-line:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --hm0:#2A2410; --hm1:#4A3600; --hm2:#8A5E00; --hm3:#C49020; --hm4:#FFB830;
  --flag-bg:rgba(255,208,64,.2); --ok-line:#5CC88A; --bad-line:#FF8A80;
}
.grow{flex:1 1 auto}
.kbd{margin-left:10px;font:400 11px var(--f-mono);opacity:.7}
@media (hover:none){.kbd{display:none}}

/* alt gezinme */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.bnav[hidden]{display:none}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;background:none;border:0;border-radius:10px;color:var(--ink3);font:500 11px var(--f-sans)}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav button[aria-current="page"] svg{stroke-width:2.3}
.top{border-bottom:0;padding-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.top-owner{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--accent);opacity:.85;padding-right:2px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,420px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

/* paneller ve form alanları */
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel-note{margin:0 0 12px;color:var(--ink2);font-size:14px}
.panel-note code,.panel code{font:400 12.5px var(--f-mono);background:var(--line2);padding:0 4px;border-radius:4px}
.fld{display:block;margin:0 0 10px;min-width:0}
.fld>span{display:block;margin:0 0 4px;font-size:13px;color:var(--ink2)}
.fld>span i{font-style:normal;color:var(--ink3)}
.fld input[type=text],.fld select,.fld textarea,select[data-c]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fld textarea{min-height:64px;font:400 15px/1.45 var(--f-sans)}
textarea#imptext{font:400 12px/1.4 var(--f-mono);min-height:90px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:14.5px;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.chk i{font-style:normal;color:var(--ink3)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quick .btn{min-height:42px;padding:0 10px;font-size:14px}
.msg.ok{padding:10px 12px;background:var(--good-bg);color:var(--good-fg);border-radius:8px;margin:10px 0}
.msg.bad{color:var(--again-fg);margin:0 0 10px}
.filebtn{cursor:pointer}
.acts.tight{margin:2px 0 10px 22px}
.acts.tight .btn{min-height:36px;font-size:13px;padding:0 12px}
.lbtn.static{cursor:default}
.preview{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.errs{margin:8px 0;font-size:13px;color:var(--ink2)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--line2);color:var(--ink2);font:500 12px var(--f-sans)}
.chip.st-new{background:var(--good-bg);color:var(--good-fg)}
.chip.st-deck,.chip.st-dup{background:var(--hard-bg);color:var(--hard-fg)}
.chip.st-mine{background:var(--easy-bg);color:var(--easy-fg)}
.btnchip{border:1px solid var(--line);background:var(--surface);min-height:36px;padding:4px 12px;font-size:13px}
.btnchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tagrow{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.segs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tools2 select{min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.lsyn{display:block;font:400 12.5px var(--f-sans);color:var(--ink3);margin-top:1px}
.fmini{margin-left:6px;font-size:12px;letter-spacing:2px}

/* ⭐ 🔴 ✅ işaretleri */
.flags{display:inline-flex;gap:2px;flex:none}
.flag{width:38px;height:38px;border:0;border-radius:8px;background:none;font-size:18px;line-height:1;filter:grayscale(1);opacity:.45}
.flag.on{background:var(--flag-bg);filter:none;opacity:1}
.flags.sm .flag{width:32px;height:32px;font-size:15px}
.syn-head{align-items:center}
.syn-head .flags{margin-left:auto}
.syn.hl{background:var(--accent-soft);margin:0 -10px;padding:12px 10px;border-radius:8px}
.syn-tr2{margin:0;color:var(--ink3);font-size:14.5px}
.mean-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:18px}
.mean-row .mean{margin-top:4px}
.pron{margin:4px 0 0;font:400 14px var(--f-mono);color:var(--ink3)}

<script>
// Aralıklı tekrar motoru (Anki / SM-2 benzeri). Saf fonksiyonlar: tarayıcıda ve Node'da çalışır.
(function (root, factory) {

  var MIN = 60000, HOUR = 3600000, DAY = 86400000;

  var CFG = {
    learn: [1, 10],      // yeni kart adımları (dakika)
    relearn: [10],       // unutulan kart adımı (dakika)
    gradIv: 1,           // "İyi" ile mezuniyet aralığı (gün)
    easyIv: 4,           // "Kolay" ile mezuniyet aralığı (gün)
    startEase: 2.5,
    minEase: 1.3,
    hardMult: 1.2,
    easyBonus: 1.3,
    lapseMult: 0.25,     // unutulan kartın yeni aralığı = eski aralığın dörtte biri (en az 1 gün)
    maxIv: 180,
    aheadMin: 20,        // öğrenme kartları için "önden getir" penceresi (dakika)
    rollover: 4          // gün sınırı: sabah 04:00

  // Gün numarası (yerel saat, 04:00'te döner)
  function dayIndex(ms) {

    return Math.floor((ms - off - CFG.rollover * HOUR) / DAY);

  // Durum: s=0 yeni, 1 öğreniliyor, 2 tekrar, 3 yeniden öğreniliyor
  function newCard() {
    return { s: 0, st: 0, iv: 0, ef: CFG.startEase, dd: 0, due: 0, lp: 0, rp: 0, sus: 0 };

  function clampIv(x) { return Math.min(CFG.maxIv, Math.max(1, Math.round(x))); }

    n.s = 2; n.st = 0; n.iv = clampIv(iv); n.dd = today + n.iv; n.due = 0;

  // rating: 1 Tekrar, 2 Zor, 3 İyi, 4 Kolay
  function schedule(c, r, now) {

    else if (c.s === 3) {

      else graduate(n, c.iv + 1, today);

ia. maintain: ısrarla savunmak (ayrıca: sürdürmek). contend: akademik dilde savunmak.","m":[["claim","iddia etmek","The author *claims* that social media weakens face-to-face communication.","Yazar, sosyal medyanın yüz yüze iletişimi zayıflattığını iddia ediyor."],["argue","savunmak, ileri sürmek","Critics *argue* that the policy benefits only wealthy households.","Eleştirmenler, politikanın yalnızca varlıklı hanelere yarar sağladığını savunuyor."],["maintain","ısrarla savunmak","Despite the evidence, he *maintained* that the tax was fair.","Kanıtlara rağmen, verginin adil olduğunu ısrarla savundu."],["assert","kesin biçimde ileri sürmek","Researchers *assert* that early education has lasting effects.","Araştırmacılar, erken eğitimin kalıcı etkileri olduğunu kesin biçimde ileri sürüyor."],["contend","(güçlü bir argümanla) savunmak","Some historians *contend* that the empire declined for internal reasons.","Bazı tarihçiler, imparatorluğun iç nedenlerle gerilediğini savunuyor."]]},{"d":"fiil","p":"v","f":"","n":"Kesinlik sırası kabaca: demonstrate > show > indicate > suggest. suggest temkinli ifadedir.","m":[["show","göstermek","Recent surveys *show* a steady fall in voter turnout.","Son anketler, seçmen katılımında istikrarlı bir düşüş olduğunu gösteriyor."],["indicate","işaret etmek, göstermek","The data *indicate* that income inequality is widening.","Veriler, gelir eşitsizliğinin giderek arttığına işaret ediyor."],["demonstrate","kanıtlamak, açıkça göstermek","The experiment *demonstrated* that group pressure can alter individual judgement.","Deney, grup baskısının bireysel yargıyı değiştirebileceğini kanıtladı."],["reveal","ortaya çıkarmak","The census *revealed* a marked shift towards urban living.","Nüfus sayımı, kentsel yaşama doğru belirgin bir kayma olduğunu ortaya çıkardı."],["suggest","düşündürmek, ima etmek","These findings *suggest* that motivation matters more than ability.","Bu bulgular, motivasyonun yetenekten daha önemli olduğunu düşündürüyor."]]},{"d":"fiil","p":"v","f":"","n":"Hepsi bir şeyin başka bir şeye yol açmasını anlatır. trigger: ani tetikleme.","m":[["cause","neden olmak","Prolonged drought can *cause* mass migration.","Uzun süren kuraklık, kitlesel göçe neden olabilir."],["trigger","tetiklemek","The assassination *triggered* a chain of diplomatic crises.","Suikast, bir dizi diplomatik krizi tetikledi."],["provoke","kışkırtmak; tepki doğurmak","The new tax *provoked* widespread protest.","Yeni vergi, geniş çaplı bir protesto tepkisi doğurdu."],["induce","(bir sonuca) yol açmak, sevk etmek","Economic hardship may *induce* people to emigrate.","Ekonomik zorluklar, insanları göç etmeye sevk edebilir."]]},{"d":"fiil","p":"v","f":"","n":"curb: dizginlemek (enflasyon, harcama). confine: bir sınır içinde tutmak.","m":[["limit","sınırlamak","The law *limits* the number of terms a president may serve.","Yasa, bir cumhurbaşkanının görev yapabileceği dönem sayısını sınırlıyor."],["restrict","kısıtlamak","Visa rules *restrict* the movement of seasonal workers.","Vize kuralları, mevsimlik işçilerin hareket özgürlüğünü kısıtlıyor."],["constrain","(hareketi) kısıtlamak, zorlamak","Limited resources *constrain* the choices available to poor families.","Sınırlı kaynaklar, yoksul ailelerin önündeki seçenekleri kısıtlıyor."],["curb","dizginlemek, önlemek","Central banks raised interest rates to *curb* inflation.","Merkez bankaları, enflasyonu dizginlemek için faiz oranlarını yükseltti."],["confine","sınırlı tutmak, hapsetmek","The study was *confined* to urban households.","Çalışma, kentsel hanelerle sınırlı tutuldu."]]},{"d":"fiil","p":"v","f":"","n":"uphold: bir karar veya ilkeyi onamak, korumak (hukuk). bolster yerine reinforce de görülür.","m":[["support","desteklemek","The evidence *supports* the view that inequality harms social trust.","Kanıtlar, eşitsizliğin toplumsal güvene zarar verdiği görüşünü destekliyor."],["back","arka çıkmak, desteklemek","Most parties *backed* the proposal in parliament.","Çoğu parti, öneriye mecliste arka çıktı."],["reinforce","pekiştirmek, güçlendirmek","Media coverage can *reinforce* existing stereotypes.","Medya haberciliği, mevcut basmakalıp yargıları pekiştirebilir."],["sustain","sürdürmek, ayakta tutmak","Agriculture *sustains* most of the rural population.","Tarım, kırsal nüfusun çoğunu ayakta tutuyor."],["uphold","(karar, ilke) onamak, korumak","The court *upheld* the earlier verdict.","Mahkeme, daha önceki hükmü onadı."]]},{"d":"fiil","p":"v","f":"","n":"address resmi dildir. tackle: aktif biçimde mücadele etmek.","m":[["address","(sorunu) ele almak","The report *addresses* the causes of youth unemployment.","Rapor, genç işsizliğinin nedenlerini ele alıyor."],["tackle","ele almak, üstesinden gelmeye çalışmak","Authorities have introduced measures to *tackle* corruption.","Yetkililer, yolsuzlukla mücadele etmek için önlemler aldı."],["handle","idare etmek, ele almak","Local courts *handle* most minor disputes.","Yerel mahkemeler, küçük anlaşmazlıkların çoğunu ele alıyor."],["confront","yüzleşmek, karşı koymak","Societies must *confront* the legacy of discrimination.","Toplumlar, ayrımcılığın mirasıyla yüzleşmelidir."]]},{"d":"fiil","p":"v","f":"","n":"diverge: ortak bir noktadan sonra birbirinden uzaklaşmak. vary: duruma göre değişmek.","m":[["differ","farklı olmak","Attitudes to marriage *differ* across generations.","Evliliğe yönelik tutumlar, kuşaklar arasında farklılık gösteriyor."],["vary","değişmek, farklılık göstermek","Wages *vary* considerably between regions.","Ücretler, bölgeler arasında hayli değişiklik gösteriyor."],["diverge","ayrılmak, birbirinden uzaklaşmak","The two countries’ economic paths *diverged* after the reform.","Reformun ardından iki ülkenin ekonomik yolları birbirinden ayrıldı."],["contrast","tezat oluşturmak","Her results sharply *contrast* with earlier findings.","Onun sonuçları, önceki bulgularla keskin bir tezat oluşturuyor."]]},{"d":"fiil","p":"v","f":"","n":"dispel yalnızca düşünce ve duygular için kullanılır (şüphe, korku). diffuse: yavaş yavaş yaymak.","m":[["disperse","dağılmak, dağıtmak","Police used tear gas to *disperse* the crowd.","Polis, kalabalığı dağıtmak için göz yaşartıcı gaz kullandı."],["scatter","saçmak, dağıtmak","The refugees were *scattered* across several camps.","Mülteciler, birkaç kampa dağılmış durumdaydı."],["dispel","(kuşku, korku, efsane) gidermek","The official statement failed to *dispel* public concerns.","Resmî açıklama, kamuoyundaki kaygıları gidermeyi başaramadı."],["diffuse","yaymak, yayılmak","New technologies *diffuse* gradually through society.","Yeni teknolojiler, toplumda yavaş yavaş yayılır."]]},{"d":"fiil","p":"v","f":"","n":"segregate: grupların zorla ayrılması (ırk, din). isolate: tek başına ayırmak veya tecrit etmek.","m":[["isolate","yalıtmak, ayrı tutmak","Researchers tried to *isolate* the effect of parental income.","Araştırmacılar, ebeveyn gelirinin etkisini yalıtmaya çalıştı."],["segregate","(grupları) ayırmak","Schools were *segregated* by race for decades.","Okullar, onlarca yıl boyunca ırka göre ayrılmıştı."],["separate","ayırmak","The law *separates* church and state.","Yasa, din ile devleti birbirinden ayırır."],["detach","ayırmak, koparmak","Some adolescents *detach* themselves emotionally from their families.","Bazı ergenler, kendilerini ailelerinden duygusal olarak koparır."]]},{"d":"fiil","p":"v","f":"","n":"precipitate: çoğu zaman kötü bir şeyi aniden tetiklemek. expedite: idari işlemi hızlandırmak.","m":[["accelerate","hızlandırmak","Globalisation has *accelerated* cultural exchange.","Küreselleşme, kültürel alışverişi hızlandırdı."],["hasten","çabuklaştırmak","Corruption scandals *hastened* the government’s fall.","Yolsuzluk skandalları, hükümetin düşüşünü çabuklaştırdı."],["precipitate","(kötü bir şeyi) aniden tetiklemek","The bank’s collapse *precipitated* a wider financial crisis.","Bankanın çöküşü, daha geniş çaplı bir mali krizi aniden tetikledi."],["expedite","(işlemi) hızlandırmak","A new office was created to *expedite* asylum applications.","Sığınma başvurularını hızlandırmak için yeni bir ofis kuruldu."]]},{"d":"fiil","p":"v","f":"","n":"adjourn: toplantı veya duruşmaya ara vermek. defer to başka anlama gelir: saygıyla uymak.","m":[["postpone","ertelemek","The elections were *postponed* because of the unrest.","Seçimler, huzursuzluk nedeniyle ertelendi."],["delay","geciktirmek","Bureaucratic procedures *delay* the delivery of aid.","Bürokratik işlemler, yardımların ulaştırılmasını geciktiriyor."],["defer","ertelemek","Many young adults *defer* marriage until they are financially stable.","Birçok genç yetişkin, mali açıdan istikrar kazanana kadar evliliği erteliyor."],["adjourn","(oturum, duruşma) ertelemek, ara vermek","The judge *adjourned* the hearing until Monday.","Hâkim, duruşmaya pazartesiye kadar ara verdi."]]},{"d":"fiil","p":"v","f":"","n":"enhance: kalite veya değeri artırmak. augment resmi dildir.","m":[["enhance","artırmak, geliştirmek","Bilingual education can *enhance* cognitive flexibility.","İki dilli eğitim, bilişsel esnekliği artırabilir."],["improve","iyileştirmek","Access to clean water *improves* public health.","Temiz suya erişim, halk sağlığını iyileştirir."],["boost","güçlendirmek, canlandırmak","Tax cuts were meant to *boost* consumer spending.","Vergi indirimlerinin, tüketici harcamalarını canlandırması amaçlanıyordu."],["strengthen","güçlendirmek","Trade agreements *strengthen* ties between neighbouring states.","Ticaret anlaşmaları, komşu devletler arasındaki bağları güçlendirir."],["augment","artırmak, genişletmek","Families *augment* their income through seasonal labour.","Aileler, gelirlerini mevsimlik işlerle artırır."]]},{"d":"fiil","p":"v","f":"","n":"conceal resmi dildir. cover up: kötü bir şeyi örtbas etmek.","m":[["conceal","gizlemek","Officials tried to *conceal* the true scale of unemployment.","Yetkililer, işsizliğin gerçek boyutunu gizlemeye çalıştı."],["hide","saklamak","Aggregate figures can *hide* large regional differences.","Toplam rakamlar, büyük bölgesel farklılıkları saklayabilir."],["disguise","gizlemek, kılık değiştirmek","Propaganda often *disguises* political aims as public interest.","Propaganda, siyasi amaçları çoğu zaman kamu yararı kılığına sokar."],["mask","(duyguyu, gerçeği) örtmek","Rapid growth *masked* deep structural weaknesses.","Hızlı büyüme, derin yapısal zayıflıkları örttü."]]},{"d":"fiil","p":"v","f":"","n":"disregard bilerek yapılır. overlook kazara olabilir (gözden kaçırmak).","m":[["neglect","ihmal etmek","Rural schools have long been *neglected* by policymakers.","Kırsal okullar, uzun süredir politika yapıcılar tarafından ihmal edilmektedir."],["ignore","görmezden gelmek","The model *ignores* cultural factors entirely.","Model, kültürel etkenleri tamamen görmezden geliyor."],["overlook","gözden kaçırmak","Earlier studies *overlooked* the role of informal work.","Önceki çalışmalar, kayıt dışı çalışmanın rolünü gözden kaçırdı."],["disregard","hiçe saymak","The company *disregarded* safety regulations.","Şirket, güvenlik yönetmeliklerini hiçe saydı."]]},{"d":"fiil","p":"v","f":"","n":"enable: mümkün kılmak. facilitate: kolaylaştırmak.","m":[["facilitate","kolaylaştırmak","Digital platforms *facilitate* communication between teachers and parents.","Dijital platformlar, öğretmenler ile veliler arasındaki iletişimi kolaylaştırır."],["enable","mümkün kılmak","Education *enables* individuals to take part in public life.","Eğitim, bireylerin kamusal yaşama katılmasını mümkün kılar."],["assist","yardım etmek","Volunteers *assist* newly arrived refugees with housing.","Gönüllüler, yeni gelen mültecilere barınma konusunda yardım ediyor."],["simplify","basitleştirmek","The reform *simplified* the process of registering a business.","Reform, bir işletmeyi tescil ettirme sürecini basitleştirdi."]]},{"d":"fiil","p":"v","f":"","n":"comprehend resmi dildir. fathom çoğunlukla olumsuz cümlede geçer (cannot fathom).","m":[["comprehend","kavramak","Young children cannot fully *comprehend* abstract concepts.","Küçük çocuklar, soyut kavramları tam olarak kavrayamaz."],["grasp","kavramak, anlamak","Policymakers failed to *grasp* the seriousness of the crisis.","Politika yapıcılar, krizin ciddiyetini kavrayamadı."],["fathom","(zor bir şeyi) derinlemesine anlamak","Historians struggle to *fathom* the scale of the famine.","Tarihçiler, kıtlığın boyutunu derinlemesine kavramakta zorlanıyor."],["perceive","algılamak","People *perceive* risk differently depending on their experience.","İnsanlar, riski deneyimlerine bağlı olarak farklı algılar."]]},{"d":"fiil","p":"v","f":"","n":"decline kibar biçimde reddetmek anlamına da gelir (azalmak ayrı kullanımdır). dismiss: bir davayı reddetmek.","m":[["reject","reddetmek","Voters *rejected* the proposed constitutional amendment.","Seçmenler, önerilen anayasa değişikliğini reddetti."],["refuse","geri çevirmek, reddetmek","The council *refused* to publish the report.","Belediye meclisi, raporu yayımlamayı reddetti."],["rebuff","(öneriyi, yakınlaşmayı) reddetmek, püskürtmek","The government *rebuffed* the opposition’s offer of talks.","Hükümet, muhalefetin görüşme önerisini sertçe reddetti."],["dismiss","(fikri) geçersiz saymak; (davayı) reddetmek","The court *dismissed* the case for lack of evidence.","Mahkeme, delil yetersizliği nedeniyle davayı reddetti."]]},{"d":"fiil","p":"v","f":"","n":"fluctuate: düzensiz iniş çıkış (fiyat, ruh hali). waver: karar konusunda tereddüt.","m":[["fluctuate","dalgalanmak","Oil prices *fluctuate* in response to political events.","Petrol fiyatları, siyasi olaylara bağlı olarak dalgalanıyor."],["oscillate","salınmak, gidip gelmek","Public opinion *oscillated* between optimism and despair.","Kamuoyu, iyimserlik ile umutsuzluk arasında gidip geldi."],["waver","tereddüt etmek","Several delegates *wavered* before the final vote.","Birkaç delege, son oylamadan önce tereddüt etti."],["swing","(görüş, oy) kaymak","Support for the party *swung* sharply after the scandal.","Skandalın ardından partiye verilen destek keskin biçimde kaydı."]]},{"d":"fiil","p":"v","f":"","n":"eliminate: tamamen yok etmek (reduce’tan güçlü). abolish: yasa ve kurumlar için. eradicate: hastalık ve kötülükler için.","m":[["eliminate","ortadan kaldırmak","The programme aims to *eliminate* extreme poverty by 2030.","Program, aşırı yoksulluğu 2030 yılına kadar ortadan kaldırmayı hedefliyor."],["abolish","(yasa, kurum) kaldırmak","Many countries *abolished* the death penalty in the twentieth century.","Birçok ülke, idam cezasını yirminci yüzyılda kaldırdı."],["eradicate","kökünü kurutmak","Public health campaigns helped *eradicate* smallpox.","Halk sağlığı kampanyaları, çiçek hastalığının kökünün kurutulmasına yardımcı oldu."],["scrap","iptal etmek, rafa kaldırmak","The government *scrapped* the plan after public criticism.","Hükümet, kamuoyundaki eleştirilerin ardından planı rafa kaldırdı."]]},{"d":"fiil","p":"v","f":"","n":"aggravate gündelik dilde kızdırmak anlamına da gelir. compound: var olan sorunu daha da karmaşıklaştırmak.","m":[["exacerbate","ağırlaştırmak","Austerity measures *exacerbated* social tensions.","Kemer sıkma önlemleri, toplumsal gerilimleri ağırlaştırdı."],["aggravate","ağırlaştırmak, kötüleştirmek","Overcrowding *aggravates* the spread of disease.","Aşırı kalabalık, hastalığın yayılmasını daha da kötüleştiriyor."],["worsen","kötüleşmek, kötüleştirmek","Living conditions *worsened* during the war.","Savaş sırasında yaşam koşulları kötüleşti."],["compound","(sorunu) daha da karmaşıklaştırmak","Language barriers *compound* the difficulties faced by newcomers.","Dil engelleri, yeni gelenlerin yaşadığı güçlükleri daha da karmaşık hale getiriyor."],["intensify","yoğunlaştırmak, şiddetlenmek","Competition for scarce resources *intensified* in the region.","Bölgede kıt kaynaklar için rekabet yoğunlaştı."]]},{"d":"fiil","p":"v","f":"","n":"foster aynı zamanda koruyucu aile olmak demektir. nurture psikolojide (nature vs nurture) geçer.","m":[["foster","geliştirmek, teşvik etmek","Schools should *foster* critical thinking.","Okullar eleştirel düşünmeyi geliştirmelidir."],["nurture","yetiştirmek, beslemek","Parents *nurture* the child’s emotional development.","Ebeveynler, çocuğun duygusal gelişimini besler."],["cultivate","geliştirmek, yetiştirmek","Leaders *cultivate* a sense of shared identity.","Liderler, ortak kimlik duygusunu geliştirir."],["promote","desteklemek, teşvik etmek","The campaign *promotes* healthy eating among children.","Kampanya, çocuklar arasında sağlıklı beslenmeyi teşvik ediyor."],["encourage","teşvik etmek","Tax incentives *encourage* firms to invest in research.","Vergi avantajları, firmaları araştırmaya yatırım yapmaya teşvik ediyor."]]},{"d":"fiil","p":"v","f":"","n":"conform: toplumsal norma uymak (sosyoloji). comply with: kural veya talebe uymak.","m":[["conform","(norma, kurala) uymak","Individuals often *conform* to the expectations of their peer group.","Bireyler çoğu zaman akran gruplarının beklentilerine uyar."],["comply","(kural, talebe) uymak","Firms must *comply* with environmental regulations.","Firmalar, çevre mevzuatına uymak zorundadır."],["obey","itaat etmek","In Milgram’s study, many participants *obeyed* the experimenter.","Milgram'ın çalışmasında katılımcıların çoğu deneycinin sözüne itaat etti."],["adhere","(kurala) bağlı kalmak","Employees must *adhere* to the code of conduct.","Çalışanlar, davranış kurallarına bağlı kalmak zorundadır."]]},{"d":"fiil","p":"v","f":"","n":"prohibit hukuk dilidir. outlaw: yasa dışı ilan etmek. bar: birini bir yerden men etmek.","m":[["prohibit","yasaklamak","The law *prohibits* discrimination in employment.","Yasa, istihdamda ayrımcılığı yasaklar."],["forbid","yasaklamak","Religious teachings *forbid* the practice.","Dinî öğretiler bu uygulamayı yasaklar."],["ban","yasaklamak","Several cities have *banned* single-use plastics.","Birçok şehir, tek kullanımlık plastikleri yasakladı."],["outlaw","yasa dışı ilan etmek","The government *outlawed* child labour in factories.","Hükümet, fabrikalarda çocuk işçiliğini yasa dışı ilan etti."],["bar","engellemek, men etmek","Women were long *barred* from higher education.","Kadınlar, uzun süre yükseköğretimden men edildi."]]},{"d":"fiil","p":"v","f":"","n":"persuade sb to do; convince sb of/that (inandırmak). coax: tatlılıkla ikna.","m":[["persuade","ikna etmek","The campaign tried to *persuade* citizens to vote.","Kampanya, vatandaşları oy kullanmaya ikna etmeye çalıştı."],["convince","ikna etmek, inandırmak","The evidence *convinced* the jury of his guilt.","Deliller, jüriyi sanığın suçlu olduğuna ikna etti."],["urge","ısrarla teşvik etmek","Experts *urge* governments to invest in early education.","Uzmanlar, hükümetleri erken eğitime yatırım yapmaya ısrarla çağırıyor."],["coax","tatlılıkla ikna etmek","Teachers *coaxed* the shy pupils into joining the discussion.","Öğretmenler, utangaç öğrencileri tatlılıkla tartışmaya katılmaya ikna etti."]]},{"d":"fiil","p":"v","f":"","n":"corroborate/substantiate: iddiaya başka kanıtla destek vermek (araştırma dili).","m":[["confirm","doğrulamak","The results *confirmed* the researchers’ initial hypothesis.","Sonuçlar, araştırmacıların ilk hipotezini doğruladı."],["verify","doğrulamak, teyit etmek","Journalists must *verify* their sources.","Gazeteciler, kaynaklarını doğrulamak zorundadır."],["validate","geçerli kılmak","Further studies are needed to *validate* the scale.","Ölçeğin geçerliliğini onaylamak için daha fazla çalışma gerekmektedir."],["corroborate","(başka kanıtla) desteklemek","Interviews *corroborate* the survey findings.","Görüşmeler de anket bulgularını destekliyor."],["substantiate","kanıtlarla desteklemek","The author fails to *substantiate* her claims.","Yazar, iddialarını kanıtlarla destekleyemiyor."]]},{"d":"fiil","p":"v","f":"","n":"underscore resmi dildir. highlight: dikkat çekmek.","m":[["emphasise","vurgulamak","The report *emphasises* the importance of early intervention.","Rapor, erken müdahalenin önemini vurguluyor."],["stress","üzerinde durmak","Teachers *stress* the value of cooperation.","Öğretmenler, iş birliğinin değeri üzerinde duruyor."],["highlight","ön plana çıkarmak","The crisis *highlighted* weaknesses in the welfare system.","Kriz, refah sistemindeki zayıflıkları ön plana çıkardı."],["underline","altını çizmek","These events *underline* the need for reform.","Bu olaylar, reform ihtiyacının altını çiziyor."],["underscore","vurgulamak","The figures *underscore* the scale of the problem.","Rakamlar, sorunun boyutunu vurguluyor."]]},{"d":"fiil","p":"v","f":"","n":"Hepsi kaynak veya köken belirtir: derive from, originate in/from, stem from.","m":[["derive","(from) -den türemek, kaynaklanmak","The concept *derives* from nineteenth-century sociology.","Kavram, on dokuzuncu yüzyıl sosyolojisinden türemiştir."],["originate","ortaya çıkmak, köken almak","The practice *originated* in medieval trade guilds.","Bu uygulama, ortaçağ ticaret loncalarında ortaya çıktı."],["stem","(from) -den kaynaklanmak","Many conflicts *stem* from competition over land.","Birçok çatışma, toprak üzerindeki rekabetten kaynaklanıyor."],["arise","ortaya çıkmak","Disputes *arise* when rights are not clearly defined.","Haklar açıkça tanımlanmadığında anlaşmazlıklar ortaya çıkar."]]},{"d":"fiil","p":"v","f":"","n":"entail: bir şeyi kaçınılmaz sonucu olarak beraberinde getirmek.","m":[["require","gerektirmek","Reform will *require* broad political support.","Reform, geniş bir siyasi destek gerektirecektir."],["demand","talep etmek, gerektirmek","Public sector jobs *demand* a high level of integrity.","Kamu sektöründeki işler, yüksek düzeyde dürüstlük talep eder."],["necessitate","zorunlu kılmak","Rapid ageing may *necessitate* changes to the pension system.","Hızlı yaşlanma, emeklilik sisteminde değişiklikleri zorunlu kılabilir."],["entail","gerektirmek, beraberinde getirmek","Reform *entails* considerable political risk.","Reform, hatırı sayılır bir siyasi riski beraberinde getiriyor."]]},{"d":"fiil","p":"v","f":"","n":"acquire: zamanla edinmek (dil, beceri). attain: bir hedefe ulaşmak. secure: güvence altına almak.","m":[["obtain","elde etmek","Applicants must *obtain* permission from local authorities.","Başvuru sahipleri, yerel makamlardan izin almak zorundadır."],["acquire","edinmek","Children *acquire* language through social interaction.","Çocuklar, dili toplumsal etkileşim yoluyla edinir."],["gain","kazanmak, elde etmek","Many colonies *gained* independence after the Second World War.","Birçok koloni, İkinci Dünya Savaşı'ndan sonra bağımsızlığını kazandı."],["attain","ulaşmak, erişmek","Few students *attain* the highest level of literacy.","Az sayıda öğrenci, en yüksek okuryazarlık düzeyine ulaşıyor."],["secure","güvence altına almak, elde etmek","The party *secured* a narrow majority in parliament.","Parti, mecliste dar bir çoğunluğu güvence altına aldı."]]},{"d":"fiil","p":"v","f":"","n":"conserve: kaynakları tasarruflu kullanıp korumak. safeguard: hak ve çıkarları güvenceye almak.","m":[["preserve","korumak, muhafaza etmek","Museums *preserve* cultural heritage for future generations.","Müzeler, kültürel mirası gelecek nesiller için korur."],["retain","elinde tutmak, korumak","Minority languages are *retained* through family use.","Azınlık dilleri, aile içindeki kullanım sayesinde korunur."],["conserve","(kaynağı) korumak, tasarruf etmek","Households were urged to *conserve* water.","Hanelerden su tasarrufu yapmaları istendi."],["safeguard","güvence altına almak","Constitutions *safeguard* fundamental freedoms.","Anayasalar, temel özgürlükleri güvence altına alır."]]},{"d":"fiil","p":"v","f":"","n":"gauge: tutum veya durumu ölçüp tahmin etmek. examine: ayrıntılı incelemek.","m":[["assess","değerlendirmek","Teachers *assess* pupils’ progress through regular tests.","Öğretmenler, öğrencilerin ilerlemesini düzenli sınavlarla değerlendirir."],["evaluate","değerlendirmek","The study *evaluates* the effectiveness of job-training schemes.","Çalışma, meslek eğitimi programlarının etkililiğini değerlendiriyor."],["gauge","(tutumu, durumu) ölçmek, tahmin etmek","Pollsters *gauge* public opinion before elections.","Anketörler, seçimlerden önce kamuoyunun eğilimini ölçer."],["examine","incelemek","The article *examines* the causes of the 1929 crisis.","Makale, 1929 krizinin nedenlerini inceliyor."]]},{"d":"fiil","p":"v","f":"","n":"undermine: temeli aşındırarak sarsmak. sabotage: kasıtlı baltalamak.","m":[["undermine","(temelini) sarsmak, zayıflatmak","Corruption *undermines* public trust in institutions.","Yolsuzluk, kurumlara duyulan kamu güvenini temelinden sarsıyor."],["weaken","zayıflatmak","Inflation *weakens* the purchasing power of households.","Enflasyon, hanelerin satın alma gücünü zayıflatıyor."],["erode","aşındırmak","Austerity has *eroded* the quality of public services.","Kemer sıkma politikası, kamu hizmetlerinin kalitesini aşındırdı."],["sabotage","baltalamak","Opponents tried to *sabotage* the peace talks.","Muhalifler, barış görüşmelerini baltalamaya çalıştı."]]},{"d":"fiil","p":"v","f":"","n":"challenge: bir şeyin doğruluğunu veya meşruiyetini sorgulamak.","m":[["oppose","karşı çıkmak","Trade unions *oppose* the proposed labour law.","Sendikalar, önerilen iş yasasına karşı çıkıyor."],["resist","direnmek","Local communities *resisted* the construction of the dam.","Yerel topluluklar, barajın inşasına direndi."],["defy","meydan okumak, başkaldırmak","Protesters *defied* the curfew.","Protestocular, sokağa çıkma yasağına meydan okudu."],["challenge","itiraz etmek, sorgulamak","The ruling was *challenged* in a higher court.","Karara, daha üst bir mahkemede itiraz edildi."]]},{"d":"fiil","p":"v","f":"","n":"depict/portray: betimlemek, resmetmek. illustrate: örnekle açıklamak.","m":[["depict","tasvir etmek","Television often *depicts* teenagers as rebellious.","Televizyon, gençleri çoğu zaman asi olarak tasvir ediyor."],["portray","betimlemek, resmetmek","The press *portrayed* the strikers as a threat to order.","Basın, grevcileri kamu düzeni için bir tehdit olarak betimledi."],["represent","temsil etmek","Women *represent* just over half of the electorate.","Kadınlar, seçmenlerin yarısından biraz fazlasını temsil ediyor."],["illustrate","örneklemek, açıklamak","The case *illustrates* how institutions shape behaviour.","Bu vaka, kurumların davranışı nasıl şekillendirdiğini örnekliyor."]],"s":false},{"d":"fiil","p":"v","f":"","n":"allocate: resmi olarak tahsis etmek. allot: pay veya zaman ayırmak.","m":[["allocate","tahsis etmek","The state *allocates* funds to regional governments.","Devlet, bölgesel yönetimlere fon tahsis eder."],["distribute","dağıtmak","Charities *distribute* food to families in need.","Hayır kuruluşları, ihtiyaç sahibi ailelere gıda dağıtır."],["allot","(pay, zaman) ayırmak","Each speaker was *allotted* ten minutes.","Her konuşmacıya on dakika süre ayrıldı."],["assign","görevlendirmek, atamak","Students are *assigned* to schools by place of residence.","Öğrenciler, ikamet yerlerine göre okullara atanır."]],"s":false},{"d":"fiil","p":"v","f":"","n":"rehabilitate: bir kişiyi topluma kazandırmak veya bir yeri onarmak.","m":[["restore","eski haline getirmek","The new government promised to *restore* public order.","Yeni hükümet, kamu düzenini yeniden sağlayacağına söz verdi."],["revive","yeniden canlandırmak","Tourism could *revive* the local economy.","Turizm, yerel ekonomiyi yeniden canlandırabilir."],["renew","yenilemek","Residence permits must be *renewed* annually.","Oturma izinleri her yıl yenilenmelidir."],["rehabilitate","(suçluyu) topluma kazandırmak","Prisons should *rehabilitate* offenders, not only punish them.","Cezaevleri, suçluları yalnızca cezalandırmakla kalmayıp topluma kazandırmalıdır."]]},{"d":"fiil","p":"v","f":"","n":"espouse resmi dildir (inanç, ilke benimsemek). endorse: açıkça desteklemek.","m":[["adopt","benimsemek, kabul etmek","Many countries *adopted* universal suffrage after 1945.","Birçok ülke, 1945'ten sonra genel oy hakkını benimsedi."],["embrace","(fikri) benimsemek, kucaklamak","Young voters *embraced* the reform agenda.","Genç seçmenler, reform gündemini kucakladı."],["espouse","(fikir, ilke) benimsemek","The party *espouses* free-market principles.","Parti, serbest piyasa ilkelerini benimsiyor."],["endorse","onaylamak, desteklemek","Several unions *endorsed* the candidate.","Birkaç sendika, adayı açıkça destekledi."]]},{"d":"fiil","p":"v","f":"","n":"spur: harekete geçirip hızlandırmak. prompt: bir tepkiyi veya eylemi başlatmak.","m":[["stimulate","canlandırmak, teşvik etmek","Public investment can *stimulate* economic activity.","Kamu yatırımları, ekonomik faaliyeti canlandırabilir."],["spur","hızlandırmak, harekete geçirmek","The crisis *spurred* a wave of institutional reform.","Kriz, bir dizi kurumsal reformu hızlandırdı."],["motivate","motive etmek","Rewards *motivate* children to practise regularly.","Ödüller, çocukları düzenli çalışmaya motive eder."],["prompt","yol açmak, harekete geçirmek","The strike *prompted* a review of working conditions.","Grev, çalışma koşullarının gözden geçirilmesine yol açtı."]]},{"d":"fiil","p":"v","f":"","n":"deplete/exhaust: kaynakları tüketmek. drain: yavaş yavaş boşaltmak.","m":[["consume","tüketmek","Wealthy countries *consume* a disproportionate share of resources.","Zengin ülkeler, kaynakların orantısız büyük bir bölümünü tüketiyor."],["deplete","tüketmek, azaltmak","Overfishing has *depleted* fish stocks.","Aşırı avlanma, balık stoklarını tüketti."],["exhaust","tüketmek, bitirmek","Heavy borrowing eventually *exhausted* the state’s reserves.","Yoğun borçlanma, sonunda devletin rezervlerini tüketti."],["drain","(kaynakları) boşaltmak, tüketmek","Emigration *drains* poorer countries of skilled workers.","Göç, yoksul ülkelerin nitelikli işgücünü yavaş yavaş tüketiyor."]]},{"d":"fiil","p":"v","f":"","n":"elucidate resmi dildir. interpret yakın ama aynı değildir: yorumlamak.","m":[["clarify","açıklığa kavuşturmak","The ministry *clarified* the rules for applicants.","Bakanlık, başvuru sahipleri için kuralları açıklığa kavuşturdu."],["elucidate","(konuyu) aydınlatmak","The author *elucidates* the mechanisms behind social mobility.","Yazar, toplumsal hareketliliğin ardındaki mekanizmaları aydınlatıyor."],["explain","açıklamak","Theories of class *explain* patterns of voting behaviour.","Sınıf kuramları, oy verme davranışının örüntülerini açıklıyor."],["interpret","yorumlamak","Historians *interpret* the same sources differently.","Tarihçiler, aynı kaynakları farklı yorumlar."]]},{"d":"sifat","p":"adj","f":"","n":"significant istatistikte de kullanılır (anlamlı). extensive: geniş kapsamlı.","m":[["significant","önemli, anlamlı","There was a *significant* rise in youth unemployment.","Gençler arasındaki işsizlikte önemli bir artış yaşandı."],["considerable","hatırı sayılır","The reform met with *considerable* resistance.","Reform, hatırı sayılır bir direnişle karşılaştı."],["substantial","kayda değer, büyük","Households received *substantial* financial support.","Hanelere kayda değer miktarda mali destek sağlandı."],["notable","dikkate değer","A *notable* exception is Sweden.","Dikkate değer bir istisna İsveç’tir."],["extensive","geniş kapsamlı","The survey covered an *extensive* range of occupations.","Anket, geniş bir meslek yelpazesini kapsıyordu."]]},{"d":"sifat","p":"adj","f":"","n":"reluctant/unwilling: istemeyen. hesitant: kararsız. loath resmi veya edebi dildir (loath to do).","m":[["reluctant","isteksiz","Many employers are *reluctant* to hire older workers.","Birçok işveren, yaşlı çalışanları işe almaya isteksiz davranıyor."],["unwilling","gönülsüz, istemeyen","The government was *unwilling* to compromise.","Hükümet, uzlaşma sağlamaya gönülsüzdü."],["hesitant","tereddütlü, kararsız","Patients were *hesitant* about the new treatment.","Hastalar, yeni tedavi konusunda tereddütlüydü."],["loath","(to) hiç istemeyen","Politicians are *loath* to raise taxes before elections.","Politikacılar, seçimlerden önce vergileri artırmayı hiç istemez."]]},{"d":"sifat","p":"adj","f":"","n":"apparent iki anlama gelir: belirgin ve görünürdeki (apparent contradiction).","m":[["apparent","belirgin; görünürdeki","The *apparent* contradiction disappears once context is considered.","Görünürdeki çelişki, bağlam dikkate alındığında ortadan kalkıyor."],["obvious","apaçık","The advantages of literacy are *obvious*.","Okuryazarlığın avantajları apaçıktır."],["evident","aşikâr, belli","The effects of the policy are already *evident*.","Politikanın etkileri şimdiden aşikârdır."],["manifest","bariz, açık","Her discomfort was *manifest* to everyone in the room.","Onun rahatsızlığı odadaki herkes için barizdi."],["clear","açık, net","There is *clear* evidence of a link between income and health.","Gelir ile sağlık arasında bir bağlantı olduğuna dair net kanıtlar vardır."]]},{"d":"sifat","p":"adj","f":"","n":"ample: ihtiyaçtan fazla yeterli. copious: çok miktarda.","m":[["abundant","bol","The region has *abundant* natural resources.","Bölge, bol miktarda doğal kaynağa sahiptir."],["plentiful","bol","Cheap labour was *plentiful* in the industrial cities.","Sanayi kentlerinde ucuz işgücü boldu."],["ample","fazlasıyla yeterli","The students had *ample* time to prepare.","Öğrencilerin hazırlanmak için fazlasıyla zamanı vardı."],["copious","bol, çok miktarda","She took *copious* notes during the lecture.","Ders sırasında çok miktarda not aldı."]]},{"d":"sifat","p":"adj","f":"","n":"negligible: o kadar küçük ki göz ardı edilebilir. marginal: sınırda, çok az.","m":[["trivial","önemsiz","The dispute began over a *trivial* matter.","Anlaşmazlık, önemsiz bir meseleyle başladı."],["insignificant","önemsiz","The difference between the two groups was statistically *insignificant*.","İki grup arasındaki fark istatistiksel olarak önemsizdi."],["negligible","ihmal edilebilir","The effect on prices was *negligible*.","Fiyatlar üzerindeki etki ihmal edilebilir düzeydeydi."],["minor","küçük, ikincil","Only *minor* changes were made to the law.","Yasada yalnızca küçük değişiklikler yapıldı."],["marginal","marjinal, çok az düzeyde","The policy produced only *marginal* improvements.","Politika yalnızca marjinal düzeyde iyileşmeler sağladı."]]},{"d":"sifat","p":"adj","f":"","n":"precise: ince ayrıntıya kadar kesin. accurate: gerçeğe uygun, doğru.","m":[["exact","tam, kesin","The *exact* number of victims remains unknown.","Mağdurların tam sayısı hâlâ bilinmiyor."],["accurate","doğru, isabetli","Census data must be *accurate* to guide policy.","Nüfus sayımı verilerinin politikalara yön verebilmesi için doğru olması gerekir."],["precise","kesin, hassas","Researchers need *precise* definitions of key terms.","Araştırmacıların temel terimlerin kesin tanımlarına ihtiyacı vardır."],["definite","kesin, belirli","There is no *definite* proof of a causal link.","Nedensel bir bağlantıya dair kesin bir kanıt yoktur."]]},{"d":"sifat","p":"adj","f":"","n":"formidable/daunting: gözünü korkutan. demanding insanlar için de kullanılır (titiz).","m":[["formidable","göz korkutucu, çetin","The party faced a *formidable* opponent in the election.","Parti, seçimde göz korkutucu bir rakiple karşılaştı."],["daunting","yıldırıcı","Reforming the pension system is a *daunting* task.","Emeklilik sistemini yeniden düzenlemek yıldırıcı bir görevdir."],["arduous","zahmetli, yorucu","Migrants made the *arduous* journey on foot.","Göçmenler zahmetli yolculuğu yürüyerek yaptı."],["demanding","yoğun emek isteyen, zorlu","Teaching is an emotionally *demanding* profession.","Öğretmenlik, duygusal açıdan zorlu bir meslektir."]]},{"d":"sifat","p":"adj","f":"","n":"legitimate: meşru; haklı da demektir. lawful: yasaya uygun.","m":[["legal","yasal","Gambling is *legal* in several states.","Kumar, birçok eyalette yasaldır."],["lawful","yasaya uygun","Police need *lawful* grounds to arrest a suspect.","Polisin bir şüpheliyi tutuklayabilmesi için yasaya uygun gerekçelere ihtiyacı vardır."],["legitimate","meşru, haklı","Citizens must regard the government as *legitimate*.","Vatandaşların hükümeti meşru görmesi gerekir."],["valid","geçerli","A *valid* passport is required for entry.","Giriş için geçerli bir pasaport gerekir."]]},{"d":"sifat","p":"adj","f":"","n":"uninterested ile disinterested (tarafsız) karıştırılmamalı.","m":[["indifferent","ilgisiz, kayıtsız","Voters grew *indifferent* to political promises.","Seçmenler, siyasi vaatlere karşı kayıtsızlaştı."],["apathetic","duyarsız, ilgisiz","Many young people feel *apathetic* about politics.","Birçok genç, siyasete karşı duyarsız hissediyor."],["unconcerned","umursamaz","He seemed *unconcerned* about the criticism.","Eleştirileri umursamıyor gibiydi."],["uninterested","ilgisiz","Students who are *uninterested* in a topic rarely retain information.","Bir konuyla ilgilenmeyen öğrenciler, bilgiyi nadiren akılda tutar."]]},{"d":"sifat","p":"adj","f":"","n":"Anlamları neredeyse aynıdır: compulsory education, mandatory rules.","m":[["compulsory","zorunlu","Primary education is *compulsory* in most countries.","İlköğretim çoğu ülkede zorunludur."],["mandatory","zorunlu, mecburi","Vaccination is *mandatory* for school entry in several countries.","Birçok ülkede okula giriş için aşı yaptırmak zorunludur."],["obligatory","(görev olarak) zorunlu","Attendance at the ceremony was *obligatory*.","Törene katılmak zorunluydu."],["required","gerekli, istenen","A minimum score is *required* for admission.","Kabul için asgari bir puan gerekmektedir."]]},{"d":"sifat","p":"adj","f":"","n":"ubiquitous: her yerde bulunan. rife: genellikle kötü şeyler için yaygın.","m":[["widespread","yaygın","There is *widespread* dissatisfaction with public services.","Kamu hizmetlerinden yaygın bir memnuniyetsizlik vardır."],["prevalent","yaygın, hâkim","Smoking was once highly *prevalent* among men.","Sigara içmek bir zamanlar erkekler arasında çok yaygındı."],["pervasive","her yere nüfuz eden","Corruption had become *pervasive* in the administration.","Yolsuzluk, idarenin her yanına nüfuz etmişti."],["ubiquitous","her yerde bulunan","Smartphones are now *ubiquitous* in everyday life.","Akıllı telefonlar artık gündelik hayatın her yerinde bulunuyor."],["rife","(kötü şeyler için) yaygın","Rumours were *rife* during the election campaign.","Seçim kampanyası sırasında söylentiler yaygındı."]]},{"d":"sifat","p":"adj","f":"","n":"innate/inborn: doğuştan (psikoloji). intrinsic zıt anlamlısı extrinsic’tir.","m":[["inherent","doğasında var olan","Conflict is *inherent* in competitive systems.","Çatışma, rekabetçi sistemlerin doğasında vardır."],["intrinsic","içsel","*Intrinsic* motivation comes from enjoyment of the task itself.","İçsel motivasyon, işin kendisinden alınan hazdan kaynaklanır."],["innate","doğuştan","Chomsky argued that humans have an *innate* capacity for language.","Chomsky, insanların doğuştan gelen bir dil yetisine sahip olduğunu savundu."],["inborn","doğuştan, kalıtsal","Some psychologists consider temperament largely *inborn*.","Bazı psikologlar, mizacın büyük ölçüde doğuştan geldiğini düşünür."]]},{"d":"sifat","p":"adj","f":"","n":"consistent with: ile uyumlu. coherence/cohesion dilbilimde metin bütünlüğüdür.","m":[["coherent","tutarlı, bütünlüklü","The government lacks a *coherent* migration policy.","Hükümetin tutarlı bir göç politikası yoktur."],["consistent","tutarlı, uyumlu","Her findings are *consistent* with earlier research.","Onun bulguları, daha önceki araştırmalarla tutarlıdır."],["cohesive","bütünleşik, uyumlu","A *cohesive* society shares basic values.","Bütünleşik bir toplum, temel değerleri paylaşır."],["logical","mantıklı","It is *logical* to assume that costs will rise.","Maliyetlerin artacağını varsaymak mantıklıdır."]]},{"d":"sifat","p":"adj","f":"","n":"ambiguous: iki farklı okunuş. vague: ayrıntıdan yoksun. equivocal: kasıtlı belirsiz.","m":[["ambiguous","belirsiz, çift anlamlı","The wording of the clause is *ambiguous*.","Maddenin ifadesi belirsizdir."],["vague","muğlak","Policy goals were too *vague* to be measured.","Politika hedefleri, ölçülemeyecek kadar muğlaktı."],["equivocal","(kasıtlı) belirsiz","The minister gave an *equivocal* answer.","Bakan, belirsiz ve kaçamak bir yanıt verdi."],["obscure","anlaşılması güç; bilinmeyen","The origins of the custom are *obscure*.","Bu geleneğin kökenleri karanlıkta kalmıştır."]]},{"d":"sifat","p":"adj","f":"","n":"archaic: eskimiş dil için. obsolete: artık kullanılmayan.","m":[["obsolete","miadını doldurmuş","Typewriters became *obsolete* with the arrival of computers.","Daktilolar, bilgisayarların gelişiyle miadını doldurdu."],["outdated","modası geçmiş","Critics call the curriculum *outdated*.","Eleştirmenler müfredatı modası geçmiş buluyor."],["archaic","eskimiş, arkaik","The law uses *archaic* language.","Yasa, eskimiş bir dil kullanıyor."],["outmoded","demode, modası geçmiş","*Outmoded* attitudes to gender persist in some workplaces.","Bazı iş yerlerinde cinsiyete ilişkin demode tutumlar sürüyor."]]},{"d":"sifat","p":"adj","f":"","n":"arbitrary arrest: keyfî tutuklama. Sebep yok veya yetki kötüye kullanılıyor demektir.","m":[["arbitrary","keyfî","He was held in *arbitrary* detention for months.","Aylarca keyfî bir gözaltında tutuldu."],["random","rastgele","Participants were selected by *random* sampling.","Katılımcılar, rastgele örnekleme yoluyla seçildi."],["capricious","kaprisli, değişken","Critics called the ruler *capricious* and unpredictable.","Eleştirmenler hükümdarı kaprisli ve öngörülemez olarak nitelendirdi."],["haphazard","plansız","Growth in the city was *haphazard*, with no overall plan.","Kentteki büyüme plansızdı; genel bir plan yoktu."]]},{"d":"sifat","p":"adj","f":"","n":"credible: inandırıcı. reliability ve validity araştırma yöntemlerinde ayrı kavramlardır.","m":[["reliable","güvenilir","Survey data must be *reliable* to support firm conclusions.","Kesin sonuçları desteklemek için anket verilerinin güvenilir olması gerekir."],["dependable","güvenilir, sağlam","Public transport should be *dependable*.","Toplu taşıma güvenilir olmalıdır."],["trustworthy","güvenilir","People trust sources they consider *trustworthy*.","İnsanlar, güvenilir buldukları kaynaklara güvenir."],["credible","inandırıcı","A *credible* threat can deter aggression.","İnandırıcı bir tehdit, saldırganlığı caydırabilir."]]},{"d":"sifat","p":"adj","f":"","n":"liable: hukukta sorumlu demektir. prone/susceptible/liable + to ile kullanılır.","m":[["vulnerable","savunmasız, hassas","Children are especially *vulnerable* to poverty.","Çocuklar yoksulluğa karşı özellikle savunmasızdır."],["susceptible","(-e) yatkın, duyarlı","Adolescents are *susceptible* to peer influence.","Ergenler, akran etkisine yatkındır."],["prone","eğilimli","Coastal regions are *prone* to flooding.","Kıyı bölgelerinde sel görülme eğilimi yüksektir."],["liable","yatkın; sorumlu","Employers are *liable* for injuries at work.","İşverenler, iş yerindeki yaralanmalardan sorumludur."]]},{"d":"sifat","p":"adj","f":"","n":"affluent society: bolluk toplumu (sosyoloji).","m":[["wealthy","zengin","*Wealthy* families can afford private schooling.","Zengin aileler, özel okul masraflarını karşılayabilir."],["affluent","varlıklı","*Affluent* neighbourhoods have better access to services.","Varlıklı mahalleler, hizmetlere daha iyi erişime sahiptir."],["prosperous","müreffeh","The port became a *prosperous* trading centre.","Liman, müreffeh bir ticaret merkezine dönüştü."],["well-off","durumu iyi","*Well-off* households spend less of their income on food.","Durumu iyi haneler, gelirlerinin daha küçük bir bölümünü gıdaya harcar."]]},{"d":"sifat","p":"adj","f":"","n":"scarce: ihtiyaca göre az (kıt). sparse: seyrek dağılmış (nüfus).","m":[["scarce","kıt","Water is *scarce* in arid regions.","Kurak bölgelerde su kıttır."],["limited","sınırlı","Households have *limited* access to credit.","Hanelerin krediye erişimi sınırlıdır."],["meagre","cılız, yetersiz","Workers survived on *meagre* wages.","İşçiler, cılız ücretlerle geçindi."],["sparse","seyrek","Population is *sparse* in mountain areas.","Dağlık bölgelerde nüfus seyrektir."],["insufficient","yetersiz","Funding was *insufficient* to cover the costs.","Finansman, maliyetleri karşılamaya yetersizdi."]]},{"d":"sifat","p":"adj","f":"","n":"debatable: tartışmaya açık. contested: itiraz edilen.","m":[["controversial","tartışmalı","The *controversial* law divided public opinion.","Tartışmalı yasa, kamuoyunu ikiye böldü."],["debatable","tartışmaya açık","Whether growth reduces inequality is *debatable*.","Büyümenin eşitsizliği azaltıp azaltmadığı tartışmaya açıktır."],["contentious","çekişme yaratan","Immigration remains a *contentious* issue.","Göç, hâlâ çekişme yaratan bir konudur."],["disputed","anlaşmazlık konusu olan","The *disputed* territory is claimed by both states.","Anlaşmazlık konusu olan toprak parçası üzerinde her iki devlet de hak iddia ediyor."],["contested","itiraz edilen","The election results were *contested*.","Seçim sonuçlarına itiraz edildi."]]},{"d":"sifat","p":"adj","f":"","n":"cursory: kısa ve üstünkörü. perfunctory: görev icabı, özensiz.","m":[["superficial","yüzeysel","The report offers only a *superficial* analysis.","Rapor, yalnızca yüzeysel bir analiz sunuyor."],["shallow","sığ, yüzeysel","Critics found the argument *shallow*.","Eleştirmenler argümanı sığ buldu."],["cursory","üstünkörü, şöyle bir","A *cursory* glance at the data suggests no pattern.","Verilere şöyle bir göz atmak, herhangi bir örüntü olmadığını gösteriyor."],["perfunctory","baştan savma","The inspection was *perfunctory*.","Denetim baştan savma yapıldı."]]},{"d":"sifat","p":"adj","f":"","n":"exhaustive: hiçbir ihtimali dışarıda bırakmayan.","m":[["comprehensive","kapsamlı","The commission produced a *comprehensive* report on child poverty.","Komisyon, çocuk yoksulluğuna ilişkin kapsamlı bir rapor hazırladı."],["thorough","ayrıntılı, titiz","A *thorough* investigation was launched.","Ayrıntılı bir soruşturma başlatıldı."],["exhaustive","eksiksiz, tüketici","The author provides an *exhaustive* survey of the literature.","Yazar, literatürün eksiksiz bir taramasını sunuyor."]]},{"d":"sifat","p":"adj","f":"","n":"partial: hem taraflı hem kısmi anlamına gelir (tuzak). partisan: bir partiyi veya tarafı tutan.","m":[["biased","yanlı","The survey was *biased* towards urban respondents.","Anket, kentli katılımcılar lehine yanlıydı."],["partial","taraflı; kısmi","Judges must not be *partial*.","Hâkimler taraflı olmamalıdır."],["prejudiced","önyargılı","Employers who are *prejudiced* may overlook qualified applicants.","Önyargılı işverenler, nitelikli adayları gözden kaçırabilir."],["partisan","yandaş, taraf tutan","The *partisan* press attacked the opposition.","Yandaş basın, muhalefete saldırdı."]]},{"d":"sifat","p":"adj","f":"","n":"adequate: gerekeni karşılayan. sufficient: miktarca yeterli.","m":[["sufficient","yeterli","Evidence was not *sufficient* to convict.","Kanıtlar, mahkûm etmek için yeterli değildi."],["adequate","yeterli, uygun","Many households lack *adequate* housing.","Birçok hanenin yeterli konutu yoktur."],["satisfactory","tatmin edici","The committee found the results *satisfactory*.","Komite, sonuçları tatmin edici buldu."]]},{"d":"sifat","p":"adj","f":"","n":"stringent: kurallar için çok sıkı. rigorous: yöntem için titiz.","m":[["rigid","katı","A *rigid* class system limited social mobility.","Katı bir sınıf sistemi, toplumsal hareketliliği sınırladı."],["inflexible","esnek olmayan","An *inflexible* labour market discourages hiring.","Esnek olmayan bir işgücü piyasası, işe alımı caydırır."],["strict","sıkı, katı","The country has *strict* immigration laws.","Ülkede sıkı göç yasaları vardır."],["stringent","(kural) çok sıkı, sert","*Stringent* rules govern the use of personal data.","Kişisel verilerin kullanımı, çok sıkı kurallara tabidir."],["rigorous","titiz, sıkı","The study followed *rigorous* methods.","Çalışma, titiz yöntemler izledi."]]},{"d":"sifat","p":"adj","f":"","n":"crucial/vital/pivotal: çok önemli. pivotal: belirleyici, kilit.","m":[["fundamental","temel","Education is a *fundamental* human right.","Eğitim, temel bir insan hakkıdır."],["essential","temel, şart","Trust is *essential* for cooperation.","İş birliği için güven şarttır."],["crucial","hayati, kritik","Early childhood is a *crucial* period for development.","Erken çocukluk, gelişim açısından kritik bir dönemdir."],["vital","hayati","Remittances are *vital* to many families.","Yurtdışından gönderilen paralar, birçok aile için hayati önem taşır."],["pivotal","belirleyici, kilit","She played a *pivotal* role in the reform.","Reformda belirleyici bir rol oynadı."]]},{"d":"sifat","p":"adj","f":"","n":"provisional: sonradan değişebilecek geçici düzenleme. interim: iki dönem arası geçici.","m":[["temporary","geçici","Many migrants take *temporary* jobs.","Birçok göçmen, geçici işlerde çalışıyor."],["transient","geçici, kısa süreli","Student populations are *transient*.","Öğrenci nüfusu geçicidir."],["provisional","(sonradan değişebilir) geçici","A *provisional* government took power.","Geçici bir hükümet iktidara geldi."],["interim","ara, geçici","An *interim* report was published in March.","Mart ayında bir ara rapor yayımlandı."],["short-lived","kısa ömürlü","The reform was *short-lived*.","Reform kısa ömürlü oldu."]]},{"d":"sifat","p":"adj","f":"","n":"lasting/enduring: uzun süre devam eden. persistent: ısrarla süren (olumsuz bağlamda da).","m":[["permanent","kalıcı","Some injuries cause *permanent* disability.","Bazı yaralanmalar kalıcı sakatlığa yol açar."],["lasting","kalıcı, uzun süreli","Early education has *lasting* effects.","Erken eğitimin kalıcı etkileri vardır."],["enduring","kalıcı, süregelen","The empire left an *enduring* legacy.","İmparatorluk, kalıcı bir miras bıraktı."],["persistent","ısrarlı, süregelen","*Persistent* inequality undermines trust.","Süregelen eşitsizlik, güveni zedeler."]]},{"d":"sifat","p":"adj","f":"","n":"detrimental: bir şeye zarar veren (detrimental to). adverse effects: olumsuz etkiler.","m":[["harmful","zararlı","Prolonged stress is *harmful* to health.","Uzun süreli stres, sağlığa zararlıdır."],["detrimental","zararlı, aleyhte","High debt can be *detrimental* to growth.","Yüksek borç, büyüme açısından zararlı olabilir."],["adverse","olumsuz, ters","The drug has few *adverse* effects.","İlacın olumsuz etkileri azdır."],["damaging","zarar verici","The scandal was *damaging* to the party.","Skandal, parti açısından zarar vericiydi."],["hazardous","tehlikeli","Workers handle *hazardous* chemicals.","İşçiler tehlikeli kimyasallarla çalışıyor."]]},{"d":"sifat","p":"adj","f":"","n":"favourable: olumlu ve elverişli (British yazım).","m":[["beneficial","yararlı","Exercise has *beneficial* effects on mental health.","Egzersizin ruh sağlığı üzerinde yararlı etkileri vardır."],["advantageous","avantajlı","Location was *advantageous* for trade.","Konum, ticaret açısından avantajlıydı."],["favourable","olumlu, elverişli","Conditions were *favourable* for growth.","Koşullar, büyüme için elverişliydi."],["constructive","yapıcı","Teachers gave *constructive* feedback.","Öğretmenler yapıcı geri bildirim verdi."]]},{"d":"sifat","p":"adv","f":"","n":"hardly/scarcely/barely: neredeyse hiç. Bunlar olumsuz anlamlı olduğundan çift olumsuzla kullanılmaz.","m":[["hardly","neredeyse hiç","*Hardly* any students passed the exam.","Öğrencilerin neredeyse hiçbiri sınavı geçemedi."],["scarcely","güçlükle, neredeyse hiç","The region could *scarcely* feed its growing population.","Bölge, artan nüfusunu güçlükle besleyebiliyordu."],["barely","zar zor, ancak","Many families *barely* manage to pay their rent.","Birçok aile, kirasını zar zor ödeyebiliyor."],["rarely","nadiren","Policy changes *rarely* produce immediate results.","Politika değişiklikleri nadiren hemen sonuç verir."],["seldom","nadiren","Reforms are *seldom* popular at first.","Reformlar, başlangıçta nadiren popülerdir."]]},{"d":"sifat","p":"adv","f":"","n":"notably: dikkate değer biçimde. chiefly/mainly: büyük ölçüde.","m":[["notably","özellikle, dikkate değer biçimde","Several states, *notably* Germany, opposed the plan.","Başta Almanya olmak üzere birkaç devlet plana karşı çıktı."],["particularly","özellikle","Unemployment is high, *particularly* among young people.","İşsizlik, özellikle gençler arasında yüksektir."],["especially","özellikle","Housing costs are rising, *especially* in large cities.","Konut maliyetleri, özellikle büyük kentlerde artıyor."],["chiefly","esas olarak","The decline was *chiefly* due to falling exports.","Düşüş, esas olarak ihracattaki gerilemeden kaynaklanıyordu."],["mainly","büyük ölçüde, esas olarak","The survey *mainly* targeted urban households.","Anket, büyük ölçüde kentli haneleri hedef aldı."]]},{"d":"sifat","p":"adv","f":"","n":"markedly: gözle görülür biçimde.","m":[["considerably","hatırı sayılır ölçüde","Wages differ *considerably* between regions.","Ücretler, bölgeler arasında hatırı sayılır ölçüde farklılık gösterir."],["substantially","büyük ölçüde","Crime has fallen *substantially* since 2010.","Suç oranı, 2010’dan bu yana büyük ölçüde düştü."],["significantly","önemli ölçüde","Education *significantly* improves job prospects.","Eğitim, iş olanaklarını önemli ölçüde artırır."],["markedly","belirgin biçimde","Attitudes have changed *markedly* in recent decades.","Tutumlar, son on yıllarda belirgin biçimde değişti."]]},{"d":"sifat","p":"adv","f":"","n":"eventually: zaman alan bir sürecin sonunda. ultimately: işin özünde, nihai olarak.","m":[["eventually","sonunda, er geç","Rising prices *eventually* forced the government to act.","Artan fiyatlar, sonunda hükümeti harekete geçmeye zorladı."],["ultimately","nihai olarak, sonuçta","Voters *ultimately* decide who governs.","Seçmenler, sonuçta kimin yöneteceğine karar verir."],["finally","sonunda","The treaty was *finally* signed in 1648.","Antlaşma, sonunda 1648’de imzalandı."],["subsequently","sonradan, ardından","The law was *subsequently* amended twice.","Yasa, sonradan iki kez değiştirildi."]]},{"d":"sifat","p":"adv","f":"","n":"virtually: neredeyse, fiilen. roughly/approximately: yaklaşık olarak.","m":[["approximately","yaklaşık olarak","*Approximately* half of the population lives in cities.","Nüfusun yaklaşık yarısı kentlerde yaşıyor."],["roughly","kabaca","In the sample, *roughly* one in five adults was unemployed.","Örneklemde yetişkinlerin kabaca beşte biri işsizdi."],["virtually","neredeyse, hemen hemen","Child labour has *virtually* disappeared in the region.","Çocuk işçiliği, bölgede neredeyse tamamen ortadan kalktı."],["nearly","neredeyse","*Nearly* all respondents supported the measure.","Katılımcıların neredeyse tamamı önlemi destekledi."]]},{"d":"sifat","p":"adv","f":"","n":"necessarily olumsuz cümlede sık geçer: does not necessarily mean.","m":[["inevitably","kaçınılmaz olarak","Rapid growth *inevitably* creates new inequalities.","Hızlı büyüme, kaçınılmaz olarak yeni eşitsizlikler yaratır."],["unavoidably","kaçınılmaz biçimde","Costs will *unavoidably* rise.","Maliyetler, kaçınılmaz biçimde artacaktır."],["necessarily","zorunlu olarak","Higher spending does not *necessarily* mean better schools.","Daha yüksek harcama, mutlaka daha iyi okullar anlamına gelmez."]]},{"d":"sifat","p":"adv","f":"","n":"Hepsi kastı anlatır. knowingly: bile bile.","m":[["deliberately","kasıtlı olarak","The documents were *deliberately* destroyed.","Belgeler kasıtlı olarak imha edildi."],["intentionally","bilerek","The change was not made *intentionally*.","Değişiklik bilerek yapılmadı."],["purposely","amaçlı olarak, kasten","He *purposely* avoided the question.","Soruyu yanıtlamaktan kasten kaçındı."],["knowingly","bile bile","He *knowingly* broke the law.","Yasayı bile bile çiğnedi."]]},{"d":"sifat","p":"adv","f":"","n":"seemingly: görünüşte. ostensibly: sözde, güya. allegedly: iddiaya göre.","m":[["apparently","görünüşe göre","*Apparently*, the policy had little effect on prices.","Görünüşe göre politikanın fiyatlar üzerinde çok az etkisi oldu."],["seemingly","görünüşte","A *seemingly* minor decision had major consequences.","Görünüşte küçük bir karar, büyük sonuçlar doğurdu."],["ostensibly","sözde, güya","The loan was *ostensibly* meant for schools.","Kredi, sözde okullar için verilmişti."],["allegedly","iddiaya göre","The company *allegedly* bribed local officials.","İddiaya göre şirket, yerel yetkililere rüşvet verdi."]]},{"d":"sifat","p":"adv","f":"","n":"Hepsi değişimin hızını anlatır: yavaş, adım adım.","m":[["gradually","giderek, yavaş yavaş","Attitudes towards divorce changed *gradually*.","Boşanmaya yönelik tutumlar giderek değişti."],["progressively","giderek, kademeli olarak","Conditions became *progressively* worse.","Koşullar giderek kötüleşti."],["steadily","istikrarlı biçimde","Life expectancy has risen *steadily*.","Yaşam beklentisi istikrarlı biçimde arttı."],["incrementally","adım adım, kademeli olarak","Reforms were introduced *incrementally*.","Reformlar adım adım uygulamaya konuldu."]]},{"d":"isim","p":"n","f":"","n":"consequence çoğu zaman olumsuz sonuçtur. implication: bir şeyin ima ettiği veya doğurduğu sonuç.","m":[["consequence","sonuç (çoğunlukla olumsuz)","Famine was a direct *consequence* of the war.","Kıtlık, savaşın doğrudan bir sonucuydu."],["outcome","sonuç, çıktı","The *outcome* of the vote surprised analysts.","Oylamanın sonucu analistleri şaşırttı."],["implication","çıkarım, sonuç","The findings have important *implications* for education policy.","Bulguların eğitim politikası açısından önemli çıkarımları vardır."],["repercussion","(olumsuz) yankı, sonuç","The ban had serious *repercussions* for local farmers.","Yasağın yerel çiftçiler üzerinde ciddi olumsuz yansımaları oldu."]]},{"d":"isim","p":"n","f":"","n":"fraud hukuk terimidir. deceit eylemi veya alışkanlığı vurgular.","m":[["deception","aldatma","Voters felt a sense of *deception* after the election.","Seçmenler, seçimden sonra aldatıldıklarını hissetti."],["deceit","h
