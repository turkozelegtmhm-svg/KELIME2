ile, aldatma","The treaty was obtained by *deceit*.","Antlaşma hileyle elde edildi."],["fraud","dolandırıcılık, sahtekârlık","The manager was convicted of *fraud*.","Yönetici dolandırıcılıktan mahkûm edildi."],["trickery","hile, oyun","Political *trickery* damaged trust in the process.","Siyasi hileler, sürece duyulan güveni zedeledi."]]},{"d":"isim","p":"n","f":"","n":"breach of contract. infringement of rights/copyright. Hukuk bağlamında sık çıkar.","m":[["violation","ihlal","The raid was a *violation* of international law.","Baskın, uluslararası hukukun ihlaliydi."],["breach","(sözleşme, kural) ihlali","Failure to deliver was a *breach* of contract.","Teslimatın yapılmaması bir sözleşme ihlaliydi."],["infringement","(hak, telif) ihlali","Copying the design was an *infringement* of patent rights.","Tasarımın kopyalanması, patent haklarının ihlali anlamına geliyordu."],["transgression","(kural, ahlak) ihlali","Social norms punish *transgression* with disapproval.","Toplumsal normlar, kural ihlalini hoş görmeyerek cezalandırır."]]},{"d":"isim","p":"n","f":"","n":"propensity resmi ve çoğunlukla olumsuzdur. trend: zaman içindeki gidişat.","m":[["tendency","eğilim, yatkınlık","There is a *tendency* to underestimate informal work.","Kayıt dışı çalışmayı olduğundan az görme eğilimi vardır."],["inclination","meyil, eğilim","Voters showed little *inclination* to support change.","Seçmenler değişimi destekleme konusunda pek bir eğilim göstermedi."],["propensity","yatkınlık","Some groups have a higher *propensity* to save.","Bazı grupların tasarruf etme yatkınlığı daha yüksektir."],["trend","gidişat, eğilim","The *trend* towards smaller families continues.","Daha küçük ailelere doğru gidişat sürüyor."]]},{"d":"isim","p":"n","f":"","n":"deliberation hukukta jürinin müzakeresi de demektir.","m":[["deliberation","müzakere, uzun uzun düşünme","After lengthy *deliberation*, the jury reached a verdict.","Uzun süren müzakerenin ardından jüri bir karara vardı."],["consideration","göz önüne alma, düşünce","The proposal deserves careful *consideration*.","Öneri, dikkatle göz önünde bulundurulmayı hak ediyor."],["contemplation","derin düşünce","Monks spend hours in silent *contemplation*.","Keşişler saatlerini sessiz bir derin düşünce içinde geçirir."],["reflection","yansıma; düşünüp taşınma","The law is a *reflection* of changing social values.","Yasa, değişen toplumsal değerlerin bir yansımasıdır."]]},{"d":"isim","p":"n","f":"","n":"attrition: baskı altında yavaş yıpranma (war of attrition).","m":[["attrition","yıpranma, aşınma","The war became one of *attrition*.","Savaş, bir yıpratma savaşına dönüştü."],["erosion","aşınma, erime","The *erosion* of trust in institutions worries analysts.","Kurumlara duyulan güvenin aşınması analistleri endişelendiriyor."],["depletion","tükenme","Soil *depletion* threatens future harvests.","Toprağın tükenmesi gelecekteki hasadı tehdit ediyor."],["decline","gerileme, düşüş","The *decline* of manufacturing hit small towns hard.","İmalat sanayisinin gerilemesi küçük kasabaları ağır biçimde vurdu."]]},{"d":"isim","p":"n","f":"","n":"destitution aşırı yoksulluktur. relative deprivation: göreli yoksunluk (sosyoloji).","m":[["poverty","yoksulluk","Child *poverty* remains a serious problem.","Çocuk yoksulluğu ciddi bir sorun olmaya devam ediyor."],["deprivation","yoksunluk","Relative *deprivation* can fuel social unrest.","Göreli yoksunluk toplumsal huzursuzluğu körükleyebilir."],["destitution","sefalet","Famine left thousands in *destitution*.","Kıtlık, binlerce kişiyi sefalet içinde bıraktı."],["hardship","sıkıntı, zorluk","Economic *hardship* pushed families to migrate.","Ekonomik sıkıntı, aileleri göç etmeye itti."]]},{"d":"isim","p":"n","f":"","n":"disparity: iki grup arasındaki büyük fark. discrepancy: iki kayıt arasındaki tutarsızlık.","m":[["inequality","eşitsizlik","Income *inequality* has widened in many countries.","Gelir eşitsizliği birçok ülkede artmıştır."],["disparity","(büyük) fark, eşitsizlik","There is a wide *disparity* between urban and rural schools.","Kentsel ve kırsal okullar arasında büyük bir fark var."],["imbalance","dengesizlik","The gender *imbalance* in parliament persists.","Parlamentodaki cinsiyet dengesizliği sürüyor."],["discrepancy","tutarsızlık, uyuşmazlık","The audit found a *discrepancy* in the accounts.","Denetim, hesaplarda bir tutarsızlık tespit etti."]]},{"d":"isim","p":"n","f":"","n":"hurdle: aşılması gereken bir aşama. impediment resmi dildir.","m":[["obstacle","engel","Lack of funding is the main *obstacle* to reform.","Fon yetersizliği, reformun önündeki başlıca engeldir."],["barrier","bariyer, engel","Language is a *barrier* to integration.","Dil, bütünleşmenin önünde bir engeldir."],["hurdle","engel, aşılması gereken zorluk","Passing the entrance exam is the first *hurdle*.","Giriş sınavını geçmek, aşılması gereken ilk engeldir."],["impediment","engel","Corruption is a serious *impediment* to growth.","Yolsuzluk, büyümenin önündeki ciddi bir engeldir."]]},{"d":"isim","p":"n","f":"","n":"merit: bir kişinin veya fikrin gerçek değeri (merit-based: liyakate dayalı).","m":[["benefit","yarar, fayda","The *benefits* of vaccination outweigh the risks.","Aşılamanın yararları, risklerinden daha ağır basar."],["advantage","avantaj, üstünlük","Early starters have a clear *advantage*.","Erken başlayanların belirgin bir üstünlüğü vardır."],["asset","değerli varlık, kazanç","A skilled workforce is a country’s greatest *asset*.","Nitelikli bir iş gücü, bir ülkenin en büyük varlığıdır."],["merit","değer, erdem, liyakat","Appointments should be based on *merit*.","Atamalar liyakate dayanmalıdır."]]},{"d":"isim","p":"n","f":"","n":"drawback/downside: bir planın olumsuz yanı. shortcoming/flaw: eksiklik, kusur.","m":[["drawback","sakınca, dezavantaj","A major *drawback* of the scheme is its cost.","Planın başlıca sakıncası maliyetidir."],["disadvantage","dezavantaj","Children from poor homes start at a *disadvantage*.","Yoksul ailelerden gelen çocuklar dezavantajlı bir konumda başlar."],["downside","olumsuz yön","The *downside* of rapid growth is pollution.","Hızlı büyümenin olumsuz yönü kirliliktir."],["shortcoming","eksiklik, kusur","The report lists several *shortcomings* in the system.","Rapor, sistemdeki birçok eksikliği sıralıyor."],["flaw","kusur, hata","The study has a serious methodological *flaw*.","Çalışmada ciddi bir yöntemsel kusur var."]]},{"d":"isim","p":"n","f":"","n":"dearth: aşırı azlık, resmi dildir (a dearth of). lack of + isim.","m":[["shortage","kıtlık, açık","A *shortage* of teachers affects rural schools.","Öğretmen açığı kırsal okulları etkiliyor."],["lack","eksiklik, yokluk","*Lack* of sanitation spreads disease.","Sanitasyon eksikliği hastalıkları yayar."],["scarcity","kıtlık","Economics studies choice under conditions of *scarcity*.","İktisat, kıtlık koşullarında yapılan tercihleri inceler."],["deficiency","yetersizlik, eksiklik","Iodine *deficiency* affects child development.","İyot eksikliği çocukların gelişimini etkiler."],["dearth","(aşırı) azlık","There is a *dearth* of reliable data on informal work.","Kayıt dışı çalışmaya ilişkin güvenilir veri aşırı derecede azdır."]]},{"d":"isim","p":"n","f":"","n":"approach: bakış açısı ve genel yaklaşım. method: somut yöntem. strategy: uzun vadeli plan.","m":[["approach","yaklaşım","Researchers adopted a qualitative *approach*.","Araştırmacılar nitel bir yaklaşım benimsedi."],["method","yöntem","Interviews are the main *method* of data collection.","Görüşmeler, veri toplamanın başlıca yöntemidir."],["strategy","strateji","The government’s *strategy* focuses on exports.","Hükümetin stratejisi ihracata odaklanıyor."],["technique","teknik","Survey *techniques* have become more sophisticated.","Anket teknikleri giderek daha gelişmiş hâle geldi."],["methodology","metodoloji, yöntembilim","The *methodology* of the study was criticised.","Çalışmanın metodolojisi eleştirildi."]]},{"d":"isim","p":"n","f":"","n":"presumption of innocence: masumiyet karinesi. premise: bir argümanın dayandığı öncül.","m":[["assumption","varsayım","The model rests on the *assumption* that people act rationally.","Model, insanların rasyonel davrandığı varsayımına dayanır."],["hypothesis","hipotez","The data supported the original *hypothesis*.","Veriler, başlangıçtaki hipotezi destekledi."],["premise","öncül, temel varsayım","The argument’s *premise* is flawed.","Argümanın öncülü kusurludur."],["presumption","(kanıtsız) varsayım; karine","The law operates on a *presumption* of innocence.","Hukuk, masumiyet karinesi esasına göre işler."],["theory","kuram","Marx’s *theory* of class conflict shaped later sociology.","Marx’ın sınıf çatışması kuramı, sonraki dönem sosyolojisini şekillendirdi."]]},{"d":"isim","p":"n","f":"","n":"evidence sayılamaz isimdir (an evidence denmez). indication: bir şeye işaret eden belirti.","m":[["evidence","kanıt, delil","There is little *evidence* that the programme works.","Programın işe yaradığına dair çok az kanıt var."],["proof","kanıt, ispat","Statistics alone are not *proof* of causation.","İstatistikler tek başına nedenselliğin kanıtı değildir."],["testimony","tanıklık, ifade","Her *testimony* convinced the court.","Tanıklığı mahkemeyi ikna etti."],["indication","belirti, işaret","There is no *indication* that prices will fall.","Fiyatların düşeceğine dair hiçbir belirti yok."]]},{"d":"isim","p":"n","f":"","n":"upheaval: toplumu altüst eden büyük değişim. unrest: halk arasında huzursuzluk.","m":[["crisis","kriz","A banking *crisis* can spread quickly across borders.","Bir bankacılık krizi sınırların ötesine hızla yayılabilir."],["turmoil","karışıklık, kargaşa","The country was in political *turmoil*.","Ülke siyasi bir karmaşa içindeydi."],["upheaval","altüst oluş, büyük çalkantı","Industrialisation caused social *upheaval*.","Sanayileşme, toplumsal bir altüst oluşa yol açtı."],["unrest","huzursuzluk, ayaklanma","Rising prices led to civil *unrest*.","Artan fiyatlar toplumsal huzursuzluğa yol açtı."]]},{"d":"isim","p":"n","f":"","n":"immigration ülkeye girişi, emigration ülkeden çıkışı anlatır.","m":[["migration","göç","Rural-to-urban *migration* accelerated after 1950.","Kırdan kente göç, 1950’den sonra hız kazandı."],["immigration","(ülkeye) göç, iç göç","*Immigration* policy dominated the campaign.","Ülkeye yönelik göç politikası, kampanyaya damgasını vurdu."],["emigration","(ülkeden) göç","*Emigration* of skilled workers weakens developing economies.","Nitelikli işçilerin yurt dışına göçü, gelişmekte olan ekonomileri zayıflatır."],["displacement","yerinden edilme","War caused mass *displacement*.","Savaş, kitlesel yerinden edilmelere yol açtı."]],"s":false},{"d":"isim","p":"n","f":"","n":"jurisdiction: bir mahkemenin veya kurumun yetki alanı.","m":[["authority","otorite, yetki","Local *authorities* are responsible for waste collection.","Atık toplamadan yerel yönetimler sorumludur."],["jurisdiction","yargı yetkisi, yetki alanı","The case falls outside the court’s *jurisdiction*.","Dava, mahkemenin yargı yetkisinin dışında kalıyor."],["sovereignty","egemenlik","National *sovereignty* limits foreign interference.","Ulusal egemenlik, yabancı müdahalesini sınırlar."],["autonomy","özerklik","Teachers value *autonomy* in the classroom.","Öğretmenler, sınıf içinde özerkliğe değer verir."]],"s":false},{"d":"isim","p":"n","f":"","n":"dispute: görüş ayrılığı veya hukuki anlaşmazlık. controversy: kamuoyunda tartışma.","m":[["conflict","çatışma","Land disputes often lead to violent *conflict*.","Toprak anlaşmazlıkları çoğu zaman şiddetli çatışmaya yol açar."],["dispute","anlaşmazlık","The *dispute* over wages lasted months.","Ücretlere ilişkin anlaşmazlık aylarca sürdü."],["controversy","tartışma, polemik","The film caused *controversy*.","Film tartışmalara yol açtı."],["tension","gerginlik","Ethnic *tension* increased after the election.","Seçimden sonra etnik gerginlik arttı."],["rivalry","rekabet, çekişme","The *rivalry* between the two empires shaped the region.","İki imparatorluk arasındaki rekabet bölgeyi şekillendirdi."]]},{"d":"isim","p":"n","f":"","n":"wage saatlik veya günlük ücrettir. salary aylık maaştır. revenue: devlet veya şirket geliri.","m":[["wage","ücret","The minimum *wage* was raised by ten percent.","Asgari ücret yüzde on artırıldı."],["salary","maaş","Public sector *salaries* have fallen in real terms.","Kamu sektörü maaşları reel olarak geriledi."],["income","gelir","Household *income* is a key predictor of educational outcomes.","Hane geliri, eğitim sonuçlarının önemli bir belirleyicisidir."],["earnings","kazanç","Graduates’ *earnings* are higher on average.","Mezunların kazançları ortalama olarak daha yüksektir."],["revenue","(devlet, şirket) gelir","Tax *revenue* fell sharply during the recession.","Vergi gelirleri, durgunluk döneminde keskin biçimde düştü."]]},{"d":"isim","p":"n","f":"","n":"stereotype: kalıplaşmış genelleme. prejudice: olumsuz ön yargı. discrimination: davranışa dönüşmüş ayrımcılık.","m":[["stereotype","basmakalıp yargı, stereotip","Advertising often reinforces gender *stereotypes*.","Reklamcılık, çoğu zaman toplumsal cinsiyet stereotiplerini pekiştirir."],["prejudice","önyargı","*Prejudice* against minorities remains common.","Azınlıklara yönelik önyargı hâlâ yaygındır."],["bias","yanlılık, önyargı","Researchers must guard against *bias*.","Araştırmacılar yanlılığa karşı tedbirli olmalıdır."],["discrimination","ayrımcılık","The law forbids *discrimination* on grounds of religion.","Yasa, din temelinde ayrımcılığı yasaklar."]]},{"d":"isim","p":"n","f":"","n":"norm: neyin kabul edilebilir olduğunu belirleyen toplumsal kural.","m":[["norm","norm, toplumsal kural","Social *norms* shape what people regard as acceptable.","Toplumsal normlar, insanların neyi kabul edilebilir saydığını biçimlendirir."],["custom","gelenek, âdet","Local *customs* vary from village to village.","Yerel gelenekler köyden köye değişir."],["convention","gelenek, uzlaşı","Wearing black to funerals is a *convention*.","Cenazelerde siyah giymek, toplumca benimsenmiş bir gelenektir."],["tradition","gelenek","The *tradition* of oral storytelling survives.","Sözlü hikâye anlatıcılığı geleneği varlığını sürdürüyor."],["ritual","ritüel, tören","Daily *rituals* give structure to community life.","Günlük ritüeller, topluluk yaşamına düzen kazandırır."]]},{"d":"isim","p":"n","f":"","n":"accord: resmi anlaşma veya uyum. unanimity: oybirliği.","m":[["consensus","uzlaşı, fikir birliği","There is a broad *consensus* among economists.","İktisatçılar arasında geniş bir uzlaşı var."],["agreement","anlaşma","The two states signed a trade *agreement*.","İki devlet bir ticaret anlaşması imzaladı."],["accord","(resmi) anlaşma, uyum","A peace *accord* ended the conflict.","Bir barış anlaşması çatışmaya son verdi."],["unanimity","oybirliği","The decision requires *unanimity* among members.","Karar, üyeler arasında oybirliği gerektirir."]]},{"d":"isim","p":"n","f":"","n":"proportion: bir bütünün payı. ratio: iki sayı arasındaki oran. fraction: küçük bir bölüm.","m":[["proportion","oran, pay","A large *proportion* of graduates remain unemployed.","Mezunların büyük bir kısmı işsiz kalmaya devam ediyor."],["ratio","oran","The student–teacher *ratio* has improved.","Öğrenci-öğretmen oranı iyileşti."],["fraction","kesir, küçük bir bölüm","Only a *fraction* of the aid reached the villages.","Yardımın yalnızca küçük bir bölümü köylere ulaştı."],["share","pay","Women’s *share* of seats in parliament has grown.","Kadınların parlamentodaki sandalye payı arttı."]]},{"d":"isim","p":"n","f":"","n":"phenomenon çoğulu phenomena’dır. episode: bir sürecin belirgin bir dönemi.","m":[["phenomenon","olgu, fenomen","Globalisation is a complex *phenomenon*.","Küreselleşme karmaşık bir olgudur."],["occurrence","olay, görülme","The *occurrence* of such crises is rare.","Bu tür krizlerin görülmesi nadirdir."],["incident","olay","The border *incident* worsened relations.","Sınırdaki olay ilişkileri daha da kötüleştirdi."],["episode","dönem, olay","The famine was a tragic *episode* in the nation’s history.","Kıtlık, ulusun tarihinde trajik bir dönemdi."]]},{"d":"terim","p":"n","f":"Sosyoloji","n":"Dört kavram da bir kişinin veya grubun yeni bir topluma uyumunu anlatır, ama derecesi farklıdır.","m":[["socialisation","toplumsallaşma","Family and school are the main agents of *socialisation*.","Aile ve okul, toplumsallaşmanın başlıca etkenleridir."],["acculturation","kültürleşme","*Acculturation* occurs when migrants adopt elements of the host culture.","Kültürleşme, göçmenlerin ev sahibi kültürün bazı unsurlarını benimsemesiyle ortaya çıkar."],["assimilation","asimilasyon, özümseme","Policies of forced *assimilation* suppressed minority languages.","Zorla asimilasyon politikaları azınlık dillerini bastırdı."],["integration","bütünleşme, entegrasyon","Language courses support the *integration* of newcomers.","Dil kursları, yeni gelenlerin topluma bütünleşmesini destekliyor."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"stratification: toplumun gelir, güç ve prestije göre katmanlara ayrılması.","m":[["stratification","tabakalaşma","Social *stratification* ranks people by wealth, power and prestige.","Toplumsal tabakalaşma, insanları servet, güç ve prestije göre sıralar."],["hierarchy","hiyerarşi, sıradüzen","A rigid *hierarchy* governed life in the court.","Sarayda yaşamı katı bir hiyerarşi belirlerdi."],["caste","kast","The *caste* system restricted marriage and occupation.","Kast sistemi evliliği ve meslek seçimini kısıtlıyordu."],["status","statü, toplumsal konum","Occupation is a key indicator of social *status*.","Meslek, toplumsal statünün önemli bir göstergesidir."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"cohort: aynı dönemde doğmuş veya aynı olayı yaşamış grup (araştırmalarda sık geçer).","m":[["cohort","kuşak, aynı dönemin grubu","Each age *cohort* experienced the recession differently.","Her yaş kuşağı durgunluğu farklı biçimde deneyimledi."],["generation","kuşak, nesil","Each *generation* faces different economic challenges.","Her kuşak farklı ekonomik zorluklarla karşılaşır."]]},{"d":"terim","p":"n","f":"Sosyoloji","n":"stigma: bir gruba yapıştırılan olumsuz toplumsal etiket.","m":[["stigma","damga, toplumsal damgalanma","Mental illness still carries a *stigma* in many societies.","Ruhsal hastalık, birçok toplumda hâlâ bir damga taşıyor."],["taboo","tabu","Death is a *taboo* subject in some cultures.","Ölüm, bazı kültürlerde tabu bir konudur."],["marginalisation","dışlanma, kenara itilme","The *marginalisation* of minorities fuels resentment.","Azınlıkların kenara itilmesi öfkeyi körüklüyor."],["exclusion","dışlama","Social *exclusion* limits access to jobs and services.","Toplumsal dışlama, işlere ve hizmetlere erişimi sınırlar."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"deviance: normdan sapma. Sosyolojide mutlaka suç anlamına gelmez.","m":[["deviance","(normdan) sapma","Sociologists view *deviance* as behaviour that breaks social norms.","Sosyologlar sapmayı, toplumsal normları çiğneyen davranış olarak görür."],["delinquency","(genç) suçluluk","Juvenile *delinquency* is linked to poverty.","Genç suçluluğu yoksullukla bağlantılıdır."],["misconduct","kötü davranış, görevi kötüye kullanma","The officer was dismissed for *misconduct*.","Görevli, görevi kötüye kullanma nedeniyle işten çıkarıldı."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"Demografik göstergeler: mortality ölüm, fertility doğum oranıdır.","m":[["mortality","ölüm oranı","Infant *mortality* has fallen sharply.","Bebek ölüm oranı keskin biçimde düştü."],["fertility","doğurganlık","Falling *fertility* is shrinking the workforce.","Düşen doğurganlık, iş gücünü küçültüyor."],["longevity","uzun ömürlülük","Better diets have increased *longevity*.","Daha iyi beslenme, uzun ömürlülüğü artırdı."],["census","nüfus sayımı","In many countries, a *census* is held every ten years.","Birçok ülkede nüfus sayımı on yılda bir yapılır."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"Toplumsal dönüşüm süreçleri. -isation sonekli isimler YÖKDİL metinlerinde çok geçer.","m":[["urbanisation","kentleşme","Rapid *urbanisation* strains housing and transport.","Hızlı kentleşme, konut ve ulaşım sistemlerini zorluyor."],["industrialisation","sanayileşme","*Industrialisation* drew workers from the countryside.","Sanayileşme, işçileri kırsal bölgelerden çekti."],["globalisation","küreselleşme","*Globalisation* has linked local markets to the world economy.","Küreselleşme, yerel pazarları dünya ekonomisine bağladı."],["modernisation","modernleşme","Reformers promoted *modernisation* of the legal system.","Reformcular, hukuk sisteminin modernleşmesini destekledi."]],"s":false},{"d":"terim","p":"n","f":"Sosyoloji","n":"Grupları adlandıran terimler (eş anlamlı değil, birbirine yakın alan).","m":[["ethnicity","etnik köken","Language and *ethnicity* are central to national identity debates.","Dil ve etnik köken, ulusal kimlik tartışmalarının merkezindedir."],["minority","azınlık","Linguistic *minorities* demand education in their mother tongue.","Dilsel azınlıklar, anadillerinde eğitim talep ediyor."],["diaspora","diaspora (yurt dışındaki topluluk)","The Turkish *diaspora* in Europe maintains strong ties with home.","Avrupa’daki Türk diasporası, anavatanla güçlü bağlarını sürdürüyor."],["refugee","mülteci","Millions of *refugees* have fled the conflict.","Milyonlarca mülteci çatışmadan kaçtı."]],"s":false},{"d":"terim","p":"n","f":"Psikoloji","n":"anxiety: genel ve süregelen kaygı. dread: kötü bir şeyin beklentisiyle duyulan korku.","m":[["anxiety","kaygı, anksiyete","Exam *anxiety* can lower performance.","Sınav kaygısı performansı düşürebilir."],["dread","(beklenen kötü şeyden) korku","Many patients feel *dread* before surgery.","Birçok hasta ameliyat öncesinde büyük bir korku duyar."],["apprehension","endişe, kaygı","Voters expressed *apprehension* about the reforms.","Seçmenler, reformlara ilişkin endişelerini dile getirdi."],["unease","huzursuzluk","A sense of *unease* spread through the community.","Toplulukta bir huzursuzluk havası yayıldı."]]},{"d":"terim","p":"n","f":"Psikoloji","n":"cognition: düşünme, hatırlama ve öğrenme gibi zihinsel süreçler (cognitive: bilişsel).","m":[["perception","algı","Media shape public *perception* of crime.","Medya, suça ilişkin kamuoyu algısını şekillendirir."],["cognition","biliş, bilişsel süreç","Sleep loss impairs *cognition*.","Uyku yoksunluğu bilişsel süreçleri bozar."],["awareness","farkındalık","Campaigns raise *awareness* of mental health.","Kampanyalar ruh sağlığına ilişkin farkındalığı artırır."],["consciousness","bilinç","Philosophers debate the nature of *consciousness*.","Filozoflar bilincin doğasını tartışır."]],"s":false},{"d":"terim","p":"n","f":"Psikoloji","n":"Davranışçı psikolojinin temel kavramları.","m":[["stimulus","uyaran","A loud noise is a typical *stimulus* for a startle response.","Yüksek bir ses, irkilme tepkisi için tipik bir uyarandır."],["reinforcement","pekiştirme","Positive *reinforcement* encourages desired behaviour.","Olumlu pekiştirme, istenen davranışı teşvik eder."],["conditioning","koşullanma","Classical *conditioning* links a neutral signal to a reflex.","Klasik koşullanma, nötr bir işareti bir refleksle ilişkilendirir."],["reward","ödül","Children respond to immediate *rewards*.","Çocuklar anlık ödüllere karşılık verir."]],"s":false},{"d":"terim","p":"n","f":"Psikoloji","n":"aggression davranıştır. hostility ve animosity tutumdur (düşmanlık).","m":[["aggression","saldırganlık","Frustration can lead to *aggression*.","Hayal kırıklığı saldırganlığa yol açabilir."],["hostility","düşmanlık","Open *hostility* between the groups made dialogue impossible.","Gruplar arasındaki açık düşmanlık, diyaloğu imkânsız kıldı."],["animosity","düşmanlık, kin","Decades of *animosity* shaped relations between the neighbours.","Onlarca yıllık kin, komşular arasındaki ilişkileri şekillendirdi."],["violence","şiddet","Domestic *violence* is under-reported.","Aile içi şiddet olduğundan az bildirilmektedir."]]},{"d":"terim","p":"n","f":"Psikoloji","n":"empathy: karşıdakinin duygusunu paylaşmak. sympathy: acıdığını göstermek. solidarity: dayanışma.","m":[["empathy","empati, duygudaşlık","*Empathy* allows people to understand others’ feelings.","Empati, insanların başkalarının duygularını anlamasını sağlar."],["sympathy","sempati, anlayış","The crisis aroused international *sympathy*.","Kriz, uluslararası alanda sempati uyandırdı."],["compassion","şefkat","Volunteers acted out of *compassion* for the victims.","Gönüllüler, mağdurlara duydukları şefkatle hareket etti."],["solidarity","dayanışma","Workers showed *solidarity* by joining the strike.","İşçiler greve katılarak dayanışma gösterdi."]]},{"d":"terim","p":"n","f":"Psikoloji","n":"resilience: zorluklardan sonra toparlanabilme gücü.","m":[["resilience","dayanıklılık, psikolojik esneklik","Supportive relationships build *resilience* in children.","Destekleyici ilişkiler, çocuklarda dayanıklılık oluşturur."],["adaptation","uyum, uyarlanma","Migrants face a long process of *adaptation*.","Göçmenler uzun bir uyum sürecinden geçer."],["adjustment","uyum, ayarlama","Starting school requires emotional *adjustment*.","Okula başlamak, duygusal bir uyum gerektirir."]]},{"d":"terim","p":"n","f":"Psikoloji","n":"Olumsuz duygusal deneyimler.","m":[["trauma","travma, ruhsal yara","War leaves lasting *trauma* in survivors.","Savaş, hayatta kalanlarda kalıcı bir travma bırakır."],["distress","sıkıntı, üzüntü","Psychological *distress* is common among the unemployed.","Psikolojik sıkıntı, işsizler arasında yaygındır."],["grief","yas, derin üzüntü","*Grief* follows the loss of a loved one.","Yas, sevilen birinin kaybının ardından gelir."]],"s":false},{"d":"terim","p":"n","f":"Psikoloji","n":"intrinsic motivation içten gelir, incentive dışarıdan verilen teşviktir.","m":[["motivation","motivasyon","Intrinsic *motivation* sustains learning.","İçsel motivasyon öğrenmeyi sürdürür."],["incentive","teşvik","Tax *incentives* encourage private investment.","Vergi teşvikleri özel yatırımı özendirir."],["impetus","itici güç, ivme","The scandal gave *impetus* to the reform movement.","Skandal, reform hareketine ivme kazandırdı."],["drive","(içsel) dürtü, güdü","Hunger is a basic biological *drive*.","Açlık, temel bir biyolojik güdüdür."]]},{"d":"terim","p":"n","f":"Ekonomi","n":"stagnation: büyümenin durması. recession: ekonominin üst üste küçülmesi.","m":[["inflation","enflasyon","High *inflation* erodes savings.","Yüksek enflasyon tasarrufları eritir."],["deflation","deflasyon","*Deflation* discourages spending because prices keep falling.","Deflasyon, fiyatlar düşmeye devam ettiği için harcamayı caydırır."],["recession","durgunluk, resesyon","Unemployment usually rises during a *recession*.","İşsizlik genellikle durgunluk döneminde artar."],["stagnation","durgunluk, tıkanma","Decades of *stagnation* left wages unchanged.","On yıllarca süren durgunluk, ücretleri aynı düzeyde bıraktı."]],"s":false},{"d":"terim","p":"n","f":"Ekonomi","n":"duty ve tariff ithalat vergisini anlatır. levy: belirli bir amaç için alınan vergi.","m":[["tax","vergi","A *tax* on sugary drinks was introduced.","Şekerli içeceklere bir vergi getirildi."],["levy","(özel) vergi, harç","A special *levy* funds the scheme.","Özel bir harç, programı finanse ediyor."],["duty","gümrük vergisi; görev","Import *duties* protect domestic industry.","İthalat gümrük vergileri yerli sanayiyi korur."],["tariff","gümrük tarifesi","High *tariffs* reduce trade.","Yüksek tarifeler ticareti azaltır."]]},{"d":"terim","p":"n","f":"Ekonomi","n":"subsidy: devletin üretici veya tüketiciye verdiği destek.","m":[["subsidy","sübvansiyon, devlet desteği","Farmers receive *subsidies* to keep food prices low.","Çiftçiler, gıda fiyatlarını düşük tutmak için sübvansiyon alır."],["grant","hibe","Research *grants* fund university projects.","Araştırma hibeleri üniversite projelerini finanse eder."],["allowance","ödenek, harçlık","Families receive a monthly child *allowance*.","Aileler her ay çocuk ödeneği alır."],["stipend","burs, düzenli ödenek","Doctoral students receive a small monthly *stipend*.","Doktora öğrencileri her ay küçük bir burs alır."]]},{"d":"terim","p":"n","f":"Ekonomi","n":"surplus fazlalık, deficit açıktır (bütçe, ticaret). glut: arzın aşırı olması.","m":[["surplus","fazla, artı","The country ran a trade *surplus*.","Ülke ticaret fazlası verdi."],["deficit","açık","Budget *deficits* increase public debt.","Bütçe açıkları kamu borcunu artırır."],["shortfall","açık, yetersizlik","A *shortfall* in revenue forced spending cuts.","Gelirlerdeki yetersizlik, harcamaların kısılmasını zorunlu kıldı."],["glut","(arzın) aşırı fazlalığı","A *glut* of graduates depressed wages.","Aşırı sayıda mezun, ücretleri aşağı çekti."]],"s":false},{"d":"terim","p":"n","f":"Ekonomi","n":"monopoly: tek satıcı. oligopoly: birkaç büyük satıcı.","m":[["monopoly","tekel","A *monopoly* can set prices without competition.","Tekel, rekabet olmadan fiyatları belirleyebilir."],["oligopoly","azınlık tekeli (birkaç firma)","The airline market is an *oligopoly* of a few large firms.","Havayolu piyasası, birkaç büyük firmadan oluşan bir oligopoldür."],["cartel","kartel","The *cartel* fixed prices for years.","Kartel, yıllarca fiyatları sabitledi."],["competition","rekabet","*Competition* lowers prices and improves quality.","Rekabet, fiyatları düşürür ve kaliteyi artırır."]],"s":false},{"d":"terim","p":"adj","f":"Ekonomi","n":"fiscal: vergi ve kamu harcaması. monetary: para arzı ve faiz.","m":[["fiscal","mali, maliyeyle ilgili","*Fiscal* policy concerns taxation and public spending.","Maliye politikası, vergilendirme ve kamu harcamalarıyla ilgilidir."],["monetary","parasal","Central banks set *monetary* policy.","Merkez bankaları para politikasını belirler."],["budgetary","bütçeyle ilgili","*Budgetary* constraints limited the programme.","Bütçe kısıtları programı sınırladı."],["financial","mali, finansal","Many students face *financial* difficulties.","Birçok öğrenci mali güçlüklerle karşılaşıyor."]],"s":false},{"d":"terim","p":"n","f":"Ekonomi","n":"austerity: devletin harcamaları kısarak sıkı mali politika izlemesi.","m":[["austerity","kemer sıkma, mali sıkılık","*Austerity* measures reduced public services.","Kemer sıkma önlemleri kamu hizmetlerini azalttı."],["thrift","tutumluluk","Calvinism is often linked to *thrift* and hard work.","Kalvinizm sıklıkla tutumlulukla ve çok çalışmayla ilişkilendirilir."],["frugality","tutumluluk, idare","Wartime posters encouraged *frugality*.","Savaş dönemi afişleri tutumluluğu teşvik ediyordu."]]},{"d":"terim","p":"n","f":"Ekonomi","n":"commodity: ham madde veya standart ticari mal (petrol, buğday).","m":[["commodity","emtia, ticari mal","Oil is one of the most traded *commodities* in the world.","Petrol, dünyada en çok alınıp satılan emtialardan biridir."],["merchandise","ticari mal","Customs officers inspect imported *merchandise*.","Gümrük memurları ithal edilen ticari malları denetler."],["goods","mal","Trade in *goods* exceeds trade in services.","Mal ticareti, hizmet ticaretini aşıyor."]]},{"d":"terim","p":"n","f":"Ekonomi","n":"productivity: birim girdi başına üretim. efficiency: kaynakları boşa harcamama.","m":[["productivity","verimlilik, üretkenlik","Education raises worker *productivity*.","Eğitim, işçi verimliliğini artırır."],["efficiency","etkinlik, verim","Reforms aimed to improve administrative *efficiency*.","Reformlar, idari etkinliği artırmayı amaçlıyordu."],["output","üretim, çıktı","Industrial *output* grew by four percent.","Sanayi üretimi yüzde dört arttı."],["yield","verim, ürün","New seeds increased crop *yields*.","Yeni tohumlar ürün verimini artırdı."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"legislation sayılamaz isimdir (yasaların bütünü). statute: tek bir yazılı yasa.","m":[["legislation","yasama; yasalar","New *legislation* protects whistle-blowers.","Yeni yasalar, ihbarcıları koruma altına alıyor."],["statute","kanun, yasa","The *statute* defines the powers of local government.","Bu kanun, yerel yönetimlerin yetkilerini tanımlar."],["regulation","düzenleme, yönetmelik","Stricter *regulation* of banks followed the crisis.","Krizin ardından bankalara yönelik daha sıkı bir düzenleme geldi."],["decree","kararname, buyruk","The president ruled by *decree*.","Devlet başkanı kararnameyle yönetti."]]},{"d":"terim","p":"n","f":"Siyaset","n":"coalition: hükümet kurmak için birleşen partiler. bloc: ortak çıkarlı devletler grubu.","m":[["alliance","ittifak","NATO is a military *alliance*.","NATO askerî bir ittifaktır."],["coalition","koalisyon","A *coalition* of three parties formed the government.","Üç partinin oluşturduğu bir koalisyon hükümeti kurdu."],["bloc","blok","The Eastern *bloc* collapsed in 1989–91.","Doğu Bloku, 1989–91 arasında çöktü."],["federation","federasyon","The country is a *federation* of provinces.","Ülke, eyaletlerden oluşan bir federasyondur."]]},{"d":"terim","p":"n","f":"Siyaset","n":"sanction YÖKDİL’de hem yaptırım hem (hukuk) onay anlamına gelir. Bağlama bakın.","m":[["sanction","yaptırım","Economic *sanctions* were imposed on the regime.","Rejime ekonomik yaptırımlar uygulandı."],["embargo","ambargo","An arms *embargo* was declared.","Silah ambargosu ilan edildi."],["boycott","boykot","Consumers organised a *boycott* of the company.","Tüketiciler, şirkete yönelik bir boykot örgütledi."],["blockade","abluka","The naval *blockade* cut off food supplies.","Deniz ablukası, gıda ikmalini kesti."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"mediation: tarafsız bir üçüncü kişinin devreye girmesi.","m":[["diplomacy","diplomasi","Quiet *diplomacy* helped avert war.","Sessiz diplomasi, bir savaşın önlenmesine yardımcı oldu."],["negotiation","müzakere, pazarlık","The treaty followed months of *negotiation*.","Antlaşma, aylarca süren müzakerelerin ardından geldi."],["mediation","arabuluculuk","*Mediation* by a third party ended the dispute.","Üçüncü bir tarafın arabuluculuğu anlaşmazlığa son verdi."],["dialogue","diyalog","Open *dialogue* between communities reduces tension.","Toplumlar arasındaki açık diyalog gerilimi azaltır."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"deterrence: karşı tarafı misilleme korkusuyla caydırma.","m":[["deterrence","caydırıcılık","Nuclear *deterrence* rests on the threat of retaliation.","Nükleer caydırıcılık, misilleme tehdidine dayanır."],["prevention","önleme","Crime *prevention* programmes target at-risk youth.","Suçu önleme programları, risk altındaki gençleri hedef alır."],["containment","(yayılmayı) önleme, çevreleme","The policy of *containment* aimed to stop the spread of communism.","Çevreleme politikası, komünizmin yayılmasını durdurmayı amaçlıyordu."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"electorate: seçme hakkı olan tüm kişiler. turnout: oy kullananların oranı.","m":[["electorate","seçmenler","The *electorate* rejected the proposal.","Seçmenler öneriyi reddetti."],["constituency","seçim bölgesi; seçmen kitlesi","Each member represents a *constituency*.","Her milletvekili bir seçim bölgesini temsil eder."],["turnout","(seçime) katılım","Voter *turnout* was low.","Seçime katılım düşük oldu."],["ballot","oy pusulası; gizli oylama","The result was decided by secret *ballot*.","Sonuç, gizli oylamayla belirlendi."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"regime genellikle otoriter yönetimi çağrıştırır. administration: görevdeki hükümet ekibi.","m":[["regime","rejim","The authoritarian *regime* censored the press.","Otoriter rejim basını sansürledi."],["administration","yönetim, idare","The new *administration* promised reform.","Yeni yönetim reform sözü verdi."],["cabinet","kabine","The *cabinet* approved the budget.","Kabine bütçeyi onayladı."],["bureaucracy","bürokrasi","Excessive *bureaucracy* slows economic activity.","Aşırı bürokrasi ekonomik faaliyeti yavaşlatır."]],"s":false},{"d":"terim","p":"n","f":"Siyaset","n":"doctrine: bir kurumun veya devletin resmi öğretisi.","m":[["ideology","ideoloji","Nationalism is a powerful political *ideology*.","Milliyetçilik, güçlü bir siyasi ideolojidir."],["doctrine","doktrin, öğreti","Military *doctrine* shaped the strategy.","Askerî doktrin stratejiyi şekillendirdi."],["creed","inanç, öğreti","The movement welcomed people of every *creed*.","Hareket, her inançtan insanı memnuniyetle karşıladı."],["principle","ilke","Equality before the law is a basic *principle*.","Yasa önünde eşitlik, temel bir ilkedir."]]},{"d":"terim","p":"n","f":"Tarih","n":"insurrection: silahlı ve örgütlü isyan.","m":[["rebellion","isyan","The *rebellion* was crushed within months.","İsyan, birkaç ay içinde bastırıldı."],["revolt","ayaklanma","Peasants staged a *revolt* against heavy taxes.","Köylüler, ağır vergilere karşı ayaklandı."],["uprising","ayaklanma","The *uprising* spread across the region.","Ayaklanma bölge geneline yayıldı."],["insurrection","(silahlı) isyan","Troops suppressed the *insurrection*.","Askerî birlikler silahlı isyanı bastırdı."]]},{"d":"terim","p":"n","f":"Tarih","n":"annexation: bir bölgenin tek taraflı olarak ilhakı.","m":[["conquest","fetih","The *conquest* of the city changed trade routes.","Kentin fethi, ticaret yollarını değiştirdi."],["invasion","istila, işgal","The *invasion* began at dawn.","İstila şafak vakti başladı."],["occupation","işgal","Foreign *occupation* lasted five years.","Yabancı işgali beş yıl sürdü."],["annexation","ilhak","The *annexation* of the province was widely condemned.","Eyaletin ilhakı geniş çapta kınandı."]]},{"d":"terim","p":"n","f":"Tarih","n":"dynasty: aynı aileden gelen hükümdarlar zinciri.","m":[["dynasty","hanedan","The *dynasty* ruled for several centuries.","Hanedan, birkaç yüzyıl boyunca hüküm sürdü."],["empire","imparatorluk","The *empire* stretched across three continents.","İmparatorluk üç kıtaya yayılıyordu."],["monarchy","monarşi, krallık","The constitutional *monarchy* limits royal power.","Anayasal monarşi, kraliyet iktidarını sınırlar."],["realm","krallık, egemenlik alanı","Subjects of the *realm* paid taxes to the crown.","Krallığın tebaası, taca vergi öderdi."]],"s":false},{"d":"terim","p":"n","f":"Tarih","n":"settlement hem yerleşim yeri hem uzlaşma anlamına gelir.","m":[["colony","koloni, sömürge","The island was a *colony* until 1960.","Ada, 1960’a kadar bir sömürgeydi."],["settlement","yerleşim; uzlaşma","Early *settlements* grew along rivers.","İlk yerleşimler nehirler boyunca büyüdü."],["outpost","ileri karakol","Trading *outposts* linked the empire to distant markets.","Ticari ileri karakollar, imparatorluğu uzak pazarlara bağlıyordu."],["territory","toprak, bölge","The treaty ceded *territory* to the neighbouring state.","Antlaşma uyarınca komşu devlete toprak bırakıldı."]],"s":false},{"d":"terim","p":"n","f":"Tarih","n":"epidemic bir bölgede, pandemic dünya çapında yayılan salgındır.","m":[["famine","kıtlık, açlık felaketi","A great *famine* killed millions.","Büyük bir kıtlık milyonlarca insanın ölümüne yol açtı."],["epidemic","salgın","The *epidemic* spread along trade routes.","Salgın, ticaret yolları boyunca yayıldı."],["plague","veba; salgın","The *plague* reduced Europe’s population in the fourteenth century.","Veba, on dördüncü yüzyılda Avrupa’nın nüfusunu azalttı."],["pandemic","pandemi","The *pandemic* changed patterns of work.","Pandemi, çalışma biçimlerini değiştirdi."]],"s":false},{"d":"terim","p":"n","f":"Tarih","n":"Soy ve ardıllık: predecessor önceki, successor sonraki kişidir.","m":[["ancestor","ata","Historians trace their *ancestors* through church records.","Tarihçiler, atalarının izini kilise kayıtları üzerinden sürer."],["descendant","torun, soyundan gelen","The king’s *descendants* ruled for generations.","Kralın torunları nesiller boyunca hüküm sürdü."],["predecessor","selef","The new ruler reversed his *predecessor’s* policies.","Yeni hükümdar, selefinin politikalarını tersine çevirdi."],["successor","halef","The king named his son as *successor*.","Kral, oğlunu halef olarak belirledi."]],"s":false},{"d":"terim","p":"n","f":"Tarih","n":"era/epoch: uzun, belirgin bir tarihsel dönem.","m":[["era","çağ, dönem","The industrial *era* transformed daily life.","Sanayi çağı gündelik yaşamı dönüştürdü."],["epoch","çağ, devir","The discovery marked a new *epoch* in science.","Bu keşif, bilimde yeni bir çağın başlangıcı oldu."],["period","dönem","The post-war *period* saw rapid growth.","Savaş sonrası dönemde hızlı bir büyüme yaşandı."],["age","çağ","The Enlightenment is called the *age* of reason.","Aydınlanma, akıl çağı olarak adlandırılır."]]},{"d":"terim","p":"n","f":"Eğitim","n":"curriculum: bir okulun tüm eğitim planı. syllabus: tek bir dersin konu listesi.","m":[["curriculum","müfredat","The national *curriculum* now includes digital skills.","Ulusal müfredat artık dijital becerileri de kapsıyor."],["syllabus","ders programı, konu listesi","The *syllabus* lists the readings for each week.","Ders programında, her hafta için okunacak metinler listelenmiştir."],["programme","program","A mentoring *programme* supports first-year students.","Bir mentorluk programı, birinci sınıf öğrencilerini destekler."],["course","ders, kurs","Students must take a *course* in research methods.","Öğrencilerin araştırma yöntemleri dersi alması gerekir."]]},{"d":"terim","p":"n","f":"Eğitim","n":"proficiency: bir dildeki yeterlilik düzeyi. competence: bir işi yapabilme yetkinliği.","m":[["literacy","okuryazarlık","Adult *literacy* has risen steadily.","Yetişkin okuryazarlığı istikrarlı biçimde arttı."],["numeracy","sayısal beceri","*Numeracy* is as important as literacy for employment.","Sayısal beceri, istihdam açısından okuryazarlık kadar önemlidir."],["proficiency","yeterlilik","Applicants must show *proficiency* in English.","Başvuru sahiplerinin İngilizce yeterliliklerini göstermesi gerekir."],["competence","yetkinlik","Teachers need subject *competence* and communication skills.","Öğretmenlerin alan yetkinliğine ve iletişim becerilerine ihtiyacı vardır."],["fluency","akıcılık","Reading *fluency* develops with practice.","Okuma akıcılığı pratikle gelişir."]],"s":false},{"d":"terim","p":"n","f":"Eğitim","n":"enrolment: okula kayıt. dropout hem kavram hem kişi (okulu bırakan) için kullanılır.","m":[["enrolment","(okula) kayıt","Primary *enrolment* is now almost universal.","İlkokula kayıt artık neredeyse herkesi kapsıyor."],["admission","kabul","University *admission* depends on exam scores.","Üniversiteye kabul, sınav puanlarına bağlıdır."],["attendance","devam, katılım","School *attendance* is closely monitored.","Okula devam yakından izlenir."],["dropout","okulu bırakma; okulu bırakan","High *dropout* rates reflect economic pressure.","Yüksek okul terk oranları ekonomik baskıyı yansıtır."]],"s":false},{"d":"terim","p":"n","f":"Eğitim","n":"scholarship: başarıya dayalı burs. bursary: maddi ihtiyaca dayalı destek.","m":[["scholarship","burs","She won a *scholarship* to study abroad.","Yurt dışında okumak için burs kazandı."],["tuition","öğrenim ücreti; öğretim","Rising *tuition* fees put higher education out of reach for many.","Artan öğrenim ücretleri, yükseköğretimi birçok kişi için ulaşılmaz kılıyor."],["bursary","(maddi destek) burs","A *bursary* covers living costs for low-income students.","Maddi destek, düşük gelirli öğrencilerin geçim masraflarını karşılar."],["fee","ücret, harç","School *fees* keep poor children at home.","Okul harçları, yoksul çocukları evde tutuyor."]],"s":false},{"d":"terim","p":"adj","f":"Eğitim","n":"tertiary: üniversite ve yüksekokul düzeyi. secondary: lise düzeyi.","m":[["vocational","mesleki","*Vocational* training prepares students for specific trades.","Mesleki eğitim, öğrencileri belirli mesleklere hazırlar."],["academic","akademik","*Academic* achievement varies by family background.","Akademik başarı, aile geçmişine göre değişir."],["tertiary","yükseköğretim düzeyindeki","*Tertiary* education includes universities and colleges.","Yükseköğretim; üniversiteleri ve yüksekokulları kapsar."],["secondary","orta öğretime ait; ikincil","*Secondary* schools prepare pupils for exams.","Ortaöğretim okulları, öğrencileri sınavlara hazırlar."]],"s":false},{"d":"terim","p":"n","f":"Eğitim","n":"pedagogy: öğretme bilimi ve yöntemi. didactic: öğretici, bazen ders verir gibi.","m":[["pedagogy","eğitbilim, pedagoji","Modern *pedagogy* emphasises active learning.","Modern pedagoji, etkin öğrenmeyi vurgular."],["instruction","öğretim; talimat","Language *instruction* begins in the first grade.","Dil öğretimi birinci sınıfta başlar."],["didactic","didaktik, öğretici","A *didactic* style leaves little room for discussion.","Didaktik bir üslup, tartışmaya pek yer bırakmaz."],["mentor","akıl hocası, mentor","An experienced *mentor* guides new teachers.","Deneyimli bir akıl hocası, yeni öğretmenlere yol gösterir."]],"s":false},{"d":"terim","p":"n","f":"Hukuk","n":"verdict: jürinin kararı. ruling: hâkimin kararı. judgement: gerekçeli hüküm.","m":[["verdict","karar, jüri kararı","The jury returned a guilty *verdict*.","Jüri, suçlu kararı verdi."],["ruling","(mahkeme) karar","The court’s *ruling* surprised many lawyers.","Mahkemenin kararı, birçok avukatı şaşırttı."],["judgement","hüküm, yargı","The appeal court reversed the lower court’s *judgement*.","Temyiz mahkemesi, alt mahkemenin hükmünü bozdu."]]},{"d":"terim","p":"n","f":"Hukuk","n":"plaintiff dava açan taraftır. defendant: davalı veya sanık.","m":[["plaintiff","davacı","The *plaintiff* demanded compensation for damages.","Davacı, uğradığı zararlar için tazminat talep etti."],["defendant","davalı, sanık","The *defendant* pleaded not guilty.","Sanık, suçlu olmadığını beyan etti."],["suspect","şüpheli","The *suspect* was released without charge.","Şüpheli, hakkında suçlama yöneltilmeden serbest bırakıldı."],["witness","tanık","A key *witness* refused to testify.","Kilit bir tanık, ifade vermeyi reddetti."]],"s":false},{"d":"terim","p":"v","f":"Hukuk","n":"convict zıt anlamlıdır: acquit beraat ettirir, convict mahkûm eder.","m":[["acquit","beraat ettirmek","The jury *acquitted* him of all charges.","Jüri, onu tüm suçlamalardan beraat ettirdi."],["exonerate","aklamak","New DNA evidence *exonerated* the prisoner.","Yeni DNA kanıtı, hükümlüyü aklamıştır."],["absolve","(suçtan, sorumluluktan) arındırmak","The report *absolved* officials of responsibility.","Rapor, yetkilileri sorumluluktan arındırdı."],["convict","mahkûm etmek","He was *convicted* of fraud.","Dolandırıcılıktan mahkûm edildi."]],"s":false},{"d":"terim","p":"v","f":"Hukuk","n":"sanction hem yaptırım uygulamak hem resmen onaylamak demektir.","m":[["punish","cezalandırmak","Courts *punish* offenders with fines or imprisonment.","Mahkemeler, suçluları para cezası veya hapisle cezalandırır."],["penalise","cezalandırmak, ceza uygulamak","The system *penalises* late payment.","Sistem, geciken ödemelere ceza uygular."],["discipline","disiplin cezası vermek","Teachers may *discipline* pupils for misconduct.","Öğretmenler, uygunsuz davranışları nedeniyle öğrencilere disiplin cezası verebilir."],["reprimand","azarlamak, resmen uyarmak","The judge *reprimanded* the lawyer for contempt.","Hâkim, avukatı mahkemeye saygısızlık nedeniyle azarladı."]]},{"d":"terim","p":"n","f":"Hukuk","n":"liability: yasal sorumluluk. accountability: görevini açıklayabilme ve hesap verebilme.","m":[["liability","(yasal) sorumluluk","The firm accepted *liability* for the accident.","Şirket, kazanın yasal sorumluluğunu kabul etti."],["responsibility","sorumluluk","Parents share *responsibility* for children’s education.","Ebeveynler, çocukların eğitiminde sorumluluğu paylaşır."],["accountability","hesap verebilirlik","Transparent budgets promote *accountability*.","Şeffaf bütçeler, hesap verebilirliği teşvik eder."],["obligation","yükümlülük","States have a legal *obligation* to protect refugees.","Devletlerin mültecileri korumak gibi yasal bir yükümlülüğü vardır."]]},{"d":"terim","p":"n","f":"Hukuk","n":"appeal: üst mahkemeye başvuru (temyiz). plea: sanığın suçlama karşısındaki savunması.","m":[["appeal","temyiz; başvuru","He lodged an *appeal* against the sentence.","Cezaya karşı temyiz başvurusunda bulundu."],["petition","dilekçe","Citizens signed a *petition* demanding reform.","Vatandaşlar, reform talep eden bir dilekçeyi imzaladı."],["plea","savunma, yalvarış","The defendant entered a *plea* of not guilty.","Sanık, suçlu olmadığı yönünde savunma yaptı."],["lawsuit","dava","Residents filed a *lawsuit* against the company.","Bölge sakinleri şirkete karşı dava açtı."]],"s":false},{"d":"terim","p":"n","f":"Hukuk","n":"custody hem gözaltı hem velayet demektir.","m":[["custody","gözaltı; velayet","The suspect was held in police *custody*.","Şüpheli, polis gözaltında tutuldu."],["detention","gözaltı, tutukluluk","Arbitrary *detention* violates human rights.","Keyfî gözaltı, insan haklarını ihlal eder."],["imprisonment","hapis","The crime carries a term of *imprisonment*.","Bu suçun cezası hapis müddetidir."],["arrest","tutuklama","Police made several *arrests* during the protest.","Polis, protesto sırasında çok sayıda tutuklama gerçekleştirdi."]],"s":false},{"d":"terim","p":"n","f":"Hukuk","n":"perpetrator: suçu işleyen kişi. accomplice: suç ortağı.","m":[["perpetrator","fail","The *perpetrator* of the attack was never identified.","Saldırının faili hiçbir zaman belirlenemedi."],["offender","suçlu, suç işleyen","First-time *offenders* often receive suspended sentences.","İlk kez suç işleyenler çoğunlukla ertelenmiş ceza alır."],["culprit","suçlu, sorumlu","Police are still searching for the *culprit*.","Polis, sorumluyu hâlâ arıyor."],["accomplice","suç ortağı","The *accomplice* was sentenced to two years.","Suç ortağı iki yıl hapse mahkûm edildi."]]},{"d":"terim","p":"n","f":"Hukuk","n":"Üç ayrı hukuk terimi (eş anlamlı değil): emsal, kefalet, arama emri.","m":[["precedent","emsal","The ruling set a *precedent* for future cases.","Bu karar, gelecekteki davalar için bir emsal oluşturdu."],["bail","kefalet","The judge granted *bail* pending trial.","Hâkim, yargılama sürerken kefalet hakkı tanıdı."],["warrant","arama/tutuklama emri","Police obtained a *warrant* to search the premises.","Polis, binada arama yapmak için arama emri aldı."]],"s":false},{"d":"terim","p":"n","f":"Dilbilim","n":"Dilbilimin ana alt dalları.","m":[["syntax","sözdizimi","*Syntax* studies how words combine into sentences.","Sözdizimi, sözcüklerin nasıl birleşerek cümle oluşturduğunu inceler."],["semantics","anlambilim","*Semantics* examines the meaning of words and sentences.","Anlambilim, sözcüklerin ve cümlelerin anlamını inceler."],["phonetics","sesbilgisi, sesbilim","*Phonetics* describes the sounds of human speech.","Sesbilgisi, insan konuşmasındaki sesleri betimler."],["morphology","biçimbilim","*Morphology* analyses how words are formed.","Biçimbilim, sözcüklerin nasıl oluştuğunu çözümler."]],"s":false},{"d":"terim","p":"n","f":"Dilbilim","n":"dialect: bölgesel veya toplumsal dil çeşidi. jargon: bir mesleğin özel dili. slang: argo.","m":[["dialect","lehçe, ağız","Regional *dialects* differ in vocabulary and pronunciation.","Bölgesel ağızlar, sözvarlığı ve telaffuz bakımından farklılık gösterir."],["vernacular","halk dili, yerel dil","Early novels were written in the *vernacular*.","İlk romanlar halk diliyle yazıldı."],["slang","argo","Teenagers use *slang* to signal group identity.","Gençler, grup kimliğini belli etmek için argo kullanır."],["jargon","jargon, mesleki dil","Legal *jargon* confuses ordinary readers.","Hukuki jargon, sıradan okurların kafasını karıştırır."]]},{"d":"terim","p":"adj","f":"Dilbilim","n":"bilingual: iki dilli. multilingual: ikiden fazla dil.","m":[["bilingual","iki dilli","*Bilingual* children switch easily between languages.","İki dilli çocuklar, diller arasında kolayca geçiş yapar."],["multilingual","çok dilli","India is a *multilingual* society.","Hindistan, çok dilli bir toplumdur."],["monolingual","tek dilli","*Monolingual* classrooms ignore pupils’ home languages.","Tek dilli sınıflar, öğrencilerin ev dillerini göz ardı eder."],["fluent","akıcı","She is *fluent* in four languages.","Dört dili akıcı biçimde konuşuyor."]],"s":false},{"d":"terim","p":"n","f":"Dilbilim","n":"discourse: bağlam içindeki dil kullanımı ve toplumsal anlatım biçimi.","m":[["discourse","söylem","Political *discourse* shapes how issues are framed.","Siyasi söylem, konuların nasıl çerçevelendiğini belirler."],["utterance","söz, ifade","Linguists analyse each *utterance* in context.","Dilbilimciler, her sözü bağlamı içinde çözümler."],["rhetoric","söz sanatı, retorik","Campaign *rhetoric* often exaggerates.","Kampanya retoriği çoğu zaman abartılıdır."],["narrative","anlatı","The nationalist *narrative* emphasises a common past.","Milliyetçi anlatı, ortak bir geçmişi vurgular."]],"s":false},{"d":"terim","p":"n","f":"Dilbilim","n":"lexicon: bir dilin veya bir kişinin zihnindeki sözcük dağarcığı.","m":[["lexicon","sözvarlığı, sözlük bilgisi","The mental *lexicon* stores thousands of words.","Zihinsel sözlük, binlerce sözcüğü depolar."],["vocabulary","kelime hazinesi","Reading expands a child’s *vocabulary*.","Okumak, çocuğun kelime hazinesini genişletir."],["terminology","terminoloji","Medical *terminology* derives from Latin and Greek.","Tıbbi terminoloji, Latince ve Yunancadan türemiştir."],["idiom","deyim","The *idiom* “break the ice” is not literal.","“Buzları eritmek” deyimi gerçek anlamıyla kullanılmaz."]],"s":false},{"d":"terim","p":"adj","f":"Antropoloji","n":"indigenous: bir bölgenin ilk halkına ait. endemic: bir bölgeye özgü olarak sürekli görülen (hastalık).","m":[["indigenous","yerli, otokton","*Indigenous* peoples defend their land rights.","Yerli halklar, toprak haklarını savunuyor."],["native","yerli; anadili olan","*Native* speakers acquire the language in childhood.","Ana dili konuşurları, dili çocuklukta edinir."],["aboriginal","(ilk) yerli halka ait","*Aboriginal* communities have lived there for millennia.","İlk yerli toplulukları orada binlerce yıldır yaşıyor."],["endemic","(bölgeye özgü) yaygın","Malaria is *endemic* in parts of the region.","Sıtma, bölgenin bazı kesimlerinde süreğen biçimde yaygındır."]]},{"d":"terim","p":"adj","f":"Antropoloji","n":"nomadic göçebe, sedentary yerleşik yaşamdır. itinerant: iş için dolaşan.","m":[["nomadic","göçebe","*Nomadic* herders move with the seasons.","Göçebe çobanlar, mevsimlere göre yer değiştirir."],["sedentary","yerleşik","The shift to *sedentary* farming created villages.","Yerleşik tarıma geçiş, köylerin ortaya çıkmasına yol açtı."],["itinerant","gezgin, mevsimlik","*Itinerant* workers follow the harvest.","Gezici işçiler, hasadı takip eder."],["seasonal","mevsimlik","*Seasonal* labour depends on the harvest.","Mevsimlik işgücü, hasada bağlıdır."]],"s":false},{"d":"terim","p":"n","f":"Antropoloji","n":"heritage: kültürel miras. legacy: geçmişten kalan etki. inheritance: maddi miras veya kalıtım.","m":[["heritage","(kültürel) miras","UNESCO protects world *heritage* sites.","UNESCO, dünya mirası alanlarını korur."],["legacy","miras, geride kalan etki","Colonialism left a lasting *legacy*.","Sömürgecilik, kalıcı bir miras bıraktı."],["inheritance","(maddi) miras; kalıtım","Property *inheritance* shapes wealth inequality.","Mülk mirası, servet eşitsizliğini biçimlendirir."],["artefact","eser, kalıntı","Archaeologists found ancient *artefacts* in the tomb.","Arkeologlar, mezarda eski çağlara ait eserler buldu."]],"s":false},{"d":"terim","p":"n","f":"Antropoloji","n":"kinship: kan veya evlilik bağıyla akrabalık sistemi.","m":[["kinship","akrabalık","*Kinship* ties organise rural economies.","Akrabalık bağları, kırsal ekonomileri düzenler."],["lineage","soy, nesep","Inheritance follows the male *lineage*.","Miras, erkek soyunu izler."],["clan","klan, aşiret","Each *clan* has its own elders.","Her klanın kendi ileri gelenleri vardır."],["tribe","kabile","The *tribe* settled along the river.","Kabile, nehir boyunca yerleşti."]],"s":false},{"d":"baglac","p":"conj","f":"Karşıtlık","n":"however/nevertheless/nonetheless: önceki cümleyle zıtlık. Noktalı virgülden sonra virgülle kullanılır.","m":[["however","ancak, ama","The plan was popular; *however*, it proved too expensive to implement.","Plan popülerdi; ancak uygulanması çok pahalı çıktı."],["nevertheless","yine de, buna rağmen","The evidence is limited; *nevertheless*, the trend is clear.","Kanıtlar sınırlıdır; yine de eğilim açıktır."],["nonetheless","yine de","The task was difficult but *nonetheless* worthwhile.","Görev zordu, ama yine de uğraşmaya değerdi."],["notwithstanding","-e rağmen (resmi)","*Notwithstanding* these objections, the bill was passed.","Bu itirazlara rağmen yasa tasarısı kabul edildi."],["yet","yine de, buna rağmen","The theory is simple, *yet* it explains a great deal.","Kuram basit, yine de çok şeyi açıklıyor."]]},{"d":"baglac","p":"conj","f":"Karşıtlık","n":"albeit: her ne kadar. Arkasından cümle değil kelime veya öbek gelir.","m":[["although","-e rağmen, -se de","*Although* wages have risen, living standards have not improved.","Ücretler artmış olsa da yaşam standartları iyileşmedi."],["though","-e rağmen","The results, *though* promising, require further testing.","Sonuçlar umut verici olsa da daha fazla sınama gerektirir."],["even though","her ne kadar ... olsa da","*Even though* the law exists, it is rarely enforced.","Her ne kadar yasa mevcut olsa da nadiren uygulanır."],["albeit","her ne kadar ... ise de","The reform brought progress, *albeit* slowly.","Reform, yavaş da olsa ilerleme getirdi."]]},{"d":"baglac","p":"conj","f":"Karşıtlık","n":"whereas/while: iki şeyi birbirine karşılaştırır. conversely: tam tersi durum.","m":[["whereas","oysa, -iken","Urban birth rates fell, *whereas* rural rates remained high.","Kentsel doğum oranları düştü; oysa kırsal oranlar yüksek kaldı."],["while","-iken; oysa","*While* some regions prospered, others declined.","Bazı bölgeler gelişirken diğerleri geriledi."],["in contrast","bunun aksine","*In contrast*, the second group showed no improvement.","Bunun aksine, ikinci grupta hiçbir iyileşme görülmedi."],["on the other hand","öte yandan","Education raises incomes; *on the other hand*, it is costly to provide.","Eğitim gelirleri artırır; öte yandan sunulması maliyetlidir."],["conversely","tersine","*Conversely*, lower taxes may reduce public services.","Tersine, daha düşük vergiler kamu hizmetlerini azaltabilir."]]},{"d":"baglac","p":"prep","f":"Neden","n":"due to/owing to/because of: isim öbeği alır. because bir cümle alır. thanks to: olumlu neden.","m":[["due to","-den dolayı","The delay was *due to* administrative problems.","Gecikme, idari sorunlardan kaynaklandı."],["owing to","-den ötürü","Schools closed *owing to* the heavy snowfall.","Yoğun kar yağışından ötürü okullar kapandı."],["because of","-den dolayı","Many farmers migrated *because of* drought.","Birçok çiftçi kuraklıktan dolayı göç etti."],["on account of","yüzünden (resmi)","She was dismissed *on account of* repeated absences.","Tekrarlanan devamsızlıkları yüzünden işten çıkarıldı."],["thanks to","sayesinde","*Thanks to* vaccination, child mortality has fallen.","Aşılama sayesinde çocuk ölümleri azaldı."]]},{"d":"baglac","p":"adv","f":"Sonuç","n":"therefore/thus/hence/consequently: bir önceki cümlenin sonucunu bildirir.","m":[["therefore","bu nedenle","Resources are limited; *therefore*, choices must be made.","Kaynaklar sınırlıdır; bu nedenle tercihler yapılmalıdır."],["thus","böylece","Prices rose, *thus* reducing demand.","Fiyatlar yükseldi ve böylece talep azaldı."],["hence","bu yüzden, dolayısıyla","The population is ageing; *hence* the pressure on pensions.","Nüfus yaşlanıyor; bu yüzden emeklilik sistemi üzerindeki baskı artıyor."],["consequently","sonuç olarak","Funding was cut; *consequently*, several schools closed.","Finansman kesildi; sonuç olarak birkaç okul kapandı."],["accordingly","buna uygun olarak","Needs differ, and policy should be designed *accordingly*.","İhtiyaçlar farklıdır ve politika buna uygun biçimde tasarlanmalıdır."]]},{"d":"baglac","p":"adv","f":"Ekleme","n":"moreover/furthermore: argümana güçlü bir ek getirir.","m":[["moreover","dahası","The scheme is costly; *moreover*, it has failed to reach the poor.","Program maliyetlidir; dahası yoksullara ulaşamamıştır."],["furthermore","ayrıca, üstelik","The law is vague; *furthermore*, it is rarely enforced.","Yasa belirsizdir; üstelik nadiren uygulanır."],["in addition","buna ek olarak","*In addition*, students must submit a portfolio.","Buna ek olarak öğrencilerin bir portfolyo sunması gerekir."],["besides","bunun yanı sıra, ayrıca","*Besides*, the policy ignores regional differences.","Bunun yanı sıra politika, bölgesel farklılıkları göz ardı etmektedir."],["additionally","ek olarak","*Additionally*, the committee proposed new safeguards.","Ek olarak komite, yeni güvenceler önerdi."]]},{"d":"baglac","p":"conj","f":"Amaç","n":"in order to / so as to: fiil alır. so that: cümle alır.","m":[["in order to","-mek için","Governments tax tobacco *in order to* reduce smoking.","Hükümetler, sigara kullanımını azaltmak için tütüne vergi koyar."],["so as to","-mek amacıyla","Schools were merged *so as to* cut costs.","Maliyetleri düşürmek amacıyla okullar birleştirildi."],["so that","-sin diye, -mesi için","Rules are published *so that* citizens can read them.","Kurallar, vatandaşlar okuyabilsin diye yayımlanır."],["with a view to","-mek amacıyla","Talks began *with a view to* ending the strike.","Grevi sona erdirmek amacıyla görüşmeler başladı."],["with the aim of","-mek amacıyla","The fund was set up *with the aim of* supporting young farmers.","Fon, genç çiftçileri desteklemek amacıyla kuruldu."]]},{"d":"baglac","p":"conj","f":"Koşul","n":"unless = if not. Kendi içinde olumsuz olduğundan arkasına olumsuz fiil gelmez.","m":[["provided that","...şartıyla","Loans are available *provided that* applicants can show a stable income.","Krediler, başvuru sahiplerinin istikrarlı bir gelir gösterebilmesi şartıyla verilmektedir."],["as long as","...sürece","Growth continues *as long as* demand remains strong.","Talep güçlü kaldığı sürece büyüme devam eder."],["unless","-mediği sürece","*Unless* wages rise, spending will remain low.","Ücretler artmadığı sürece harcamalar düşük kalacaktır."],["on condition that","...koşuluyla","Aid was granted *on condition that* reforms were carried out.","Yardım, reformların yapılması koşuluyla verildi."],["in case","...ihtimaline karşı","Reserves are kept *in case* of emergencies.","Yedek stoklar, acil durum ihtimaline karşı tutulur."]],"s":false},{"d":"baglac","p":"adv","f":"Zaman","n":"meanwhile/in the meantime: iki şey aynı sırada oluyor. subsequently ayrı bir kartta.","m":[["meanwhile","bu arada","Prices rose; *meanwhile*, wages stagnated.","Fiyatlar yükseldi; bu arada ücretler durgun kaldı."],["in the meantime","bu arada","The report is due in May; *in the meantime*, interim figures are available.","Rapor mayısta bekleniyor; bu arada ara dönem rakamlarına ulaşılabiliyor."],["previously","daha önce","*Previously*, such cases were handled locally.","Daha önce bu tür davalar yerel düzeyde ele alınırdı."],["as soon as","-r -mez","Troops withdrew *as soon as* the treaty was signed.","Antlaşma imzalanır imzalanmaz birlikler geri çekildi."],["by the time","-diği zamana kadar (çoktan)","*By the time* reforms arrived, many farms had closed.","Reformlar geldiğinde çok sayıda çiftlik çoktan kapanmıştı."]],"s":false},{"d":"baglac","p":"adv","f":"Benzerlik","n":"similarly/likewise: aynı şey ikinci bir durum için de geçerli.","m":[["similarly","benzer şekilde","*Similarly*, rural women face barriers to education.","Benzer şekilde, kırsal kesimdeki kadınlar eğitimde engellerle karşılaşıyor."],["likewise","aynı şekilde","Teachers need training; *likewise*, parents need support.","Öğretmenlerin eğitime ihtiyacı var; aynı şekilde ebeveynlerin de desteğe ihtiyacı var."],["equally","aynı derecede, eşit olarak","*Equally*, the burden of reform must be shared fairly.","Aynı ölçüde, reformun yükü de adil biçimde paylaşılmalıdır."],["by the same token","aynı mantıkla","Lower taxes boost spending; *by the same token*, they cut public revenue.","Düşük vergiler harcamayı artırır; aynı mantıkla kamu gelirlerini de azaltır."]]},{"d":"baglac","p":"prep","f":"Karşıtlık","n":"despite/in spite of: isim öbeği alır, cümle almaz. regardless of: ...-e bakmaksızın.","m":[["despite","-e rağmen","*Despite* repeated warnings, the system was not changed.","Defalarca yapılan uyarılara rağmen sistem değiştirilmedi."],["in spite of","-e rağmen","*In spite of* the ban, child labour persists.","Yasağa rağmen çocuk işçiliği sürüyor."],["regardless of","-e bakmaksızın","Education should be free *regardless of* income.","Eğitim, gelir düzeyine bakılmaksızın ücretsiz olmalıdır."],["apart from","-in dışında","*Apart from* a few exceptions, results were consistent.","Birkaç istisna dışında sonuçlar tutarlıydı."],["except for","-in dışında","All delegates attended *except for* two.","İki kişi dışında tüm delegeler katıldı."]],"s":false},{"d":"baglac","p":"adv","f":"Alternatif","n":"on the contrary: önceki ifadeyi tamamen çürütür. instead: bunun yerine.","m":[["instead","bunun yerine","Officials did not cut spending; *instead*, they raised taxes.","Yetkililer harcamaları kısmadı; bunun yerine vergileri artırdı."],["rather than","...yerine","Reform should be gradual *rather than* sudden.","Reform, ani olmak yerine kademeli olmalıdır."],["alternatively","alternatif olarak","Applicants may submit a paper form; *alternatively*, they can apply online.","Başvuru sahipleri kâğıt form sunabilir; alternatif olarak çevrim içi de başvurabilir."],["otherwise","aksi halde","Funding must increase; *otherwise*, the programme will collapse.","Finansman artırılmalıdır; aksi halde program çökecektir."],["on the contrary","aksine, tam tersine","The policy did not reduce inequality; *on the contrary*, it widened it.","Politika eşitsizliği azaltmadı; aksine, onu daha da derinleştirdi."]],"s":false},{"d":"baglac","p":"adv","f":"Sonuç bildirme","n":"Metnin son paragrafını başlatan ifadeler.","m":[["in conclusion","sonuç olarak","*In conclusion*, early intervention is both effective and economical.","Sonuç olarak erken müdahale hem etkili hem de ekonomiktir."],["in short","kısacası","*In short*, the reform failed to deliver.","Kısacası reform, beklentileri karşılayamadı."],["to sum up","özetle","*To sum up*, three factors explain the decline.","Özetle, üç etken düşüşü açıklamaktadır."],["overall","genel olarak","*Overall*, the programme was a success.","Genel olarak program başarılı oldu."]]},{"d":"baglac","p":"prep","f":"Gönderme","n":"regarding/concerning/with regard to: bir konuya gönderme yapar. in terms of: ... açısından.","m":[["regarding","...ile ilgili","Questions *regarding* funding were postponed.","Finansmanla ilgili sorular ertelendi."],["concerning","...hakkında","The committee received complaints *concerning* working hours.","Komite, çalışma saatleri hakkında şikâyetler aldı."],["with regard to","...konusunda","*With regard to* housing, the situation is improving.","Konut konusunda durum iyileşmektedir."],["in terms of","...açısından","*In terms of* income, the two groups are similar.","Gelir açısından iki grup benzerdir."],["as for","...gelince","*As for* the second proposal, it was rejected.","İkinci öneriye gelince, o reddedildi."]],"s":false},{"d":"baglac","p":"prep","f":"Ekleme","n":"as well as/along with/together with: özne tekil ise fiil tekil kalır.","m":[["as well as","-in yanı sıra","The policy affects workers *as well as* employers.","Politika, işverenlerin yanı sıra işçileri de etkiliyor."],["along with","ile birlikte","*Along with* income, education shapes health.","Gelirle birlikte eğitim de sağlığı biçimlendirir."],["together with","ile birlikte","The report, *together with* its appendix, was published.","Rapor, eki ile birlikte yayımlandı."],["in addition to","-e ek olarak","*In addition to* cash payments, families receive housing support.","Nakit ödemelere ek olarak aileler konut desteği de alıyor."]]},{"d":"phrasal","p":"v","f":"","n":"lead to/result in/bring about/give rise to: neden → sonuç yönü. result from tam tersidir (kaynaklanmak).","m":[["lead to","-e yol açmak","Poor diet can *lead to* serious health problems.","Kötü beslenme, ciddi sağlık sorunlarına yol açabilir."],["result in","ile sonuçlanmak","The negotiations *resulted in* a ceasefire.","Müzakereler, ateşkesle sonuçlandı."],["bring about","meydana getirmek","Industrialisation *brought about* profound social change.","Sanayileşme, köklü toplumsal değişimler meydana getirdi."],["give rise to","doğurmak, yol açmak","Inequality can *give rise to* resentment.","Eşitsizlik, kırgınlık doğurabilir."],["contribute to","-e katkıda bulunmak; -e yol açmak","Stress *contributes to* many chronic illnesses.","Stres, birçok kronik hastalığın ortaya çıkmasına katkıda bulunur."]]},{"d":"phrasal","p":"v","f":"","n":"Bunlarda yön sonuçtan nedene doğrudur: A results from B demek B, A’nın nedenidir.","m":[["result from","-den kaynaklanmak","Many accidents *result from* human error.","Pek çok kaza, insan hatasından kaynaklanır."],["arise from","-den doğmak","Conflicts often *arise from* unequal access to land.","Çatışmalar çoğunlukla toprağa eşitsiz erişimden doğar."],["spring from","-den kaynaklanmak","The movement *sprang from* widespread discontent.","Hareket, yaygın hoşnutsuzluktan doğdu."],["be rooted in","-e dayanmak, köklenmek","Her theory *is rooted in* behaviourist psychology.","Onun kuramı, davranışçı psikolojiye dayanır."]]},{"d":"phrasal","p":"v","f":"","n":"conduct/undertake: resmi dilde bir çalışmayı yürütmek.","m":[["carry out","gerçekleştirmek, yürütmek","Researchers *carried out* interviews in twelve villages.","Araştırmacılar, on iki köyde görüşmeler gerçekleştirdi."],["conduct","yürütmek, yapmak","The ministry *conducted* a nationwide survey.","Bakanlık, ülke çapında bir anket yürüttü."],["undertake","üstlenmek, girişmek","The commission will *undertake* a review of the system.","Komisyon, sistemin gözden geçirilmesini üstlenecek."],["perform","yerine getirmek, icra etmek","Schools *perform* a social as well as an educational role.","Okullar, eğitimsel olduğu kadar toplumsal bir rol de yerine getirir."]]},{"d":"phrasal","p":"v","f":"","n":"deal with/cope with: bir sorunla uğraşmak. cope with: zorlukla başa çıkmak.","m":[["deal with","ele almak, ilgilenmek","The court *deals with* civil disputes.","Mahkeme, medeni uyuşmazlıkları ele alır."],["cope with","(zorlukla) başa çıkmak","Families struggle to *cope with* rising prices.","Aileler, artan fiyatlarla başa çıkmakta zorlanıyor."],["grapple with","(zor sorunla) boğuşmak","Governments *grapple with* ageing populations.","Hükümetler, yaşlanan nüfuslarla boğuşuyor."],["contend with","-le uğraşmak","Small firms must *contend with* high taxes.","Küçük firmalar, yüksek vergilerle uğraşmak zorundadır."]]},{"d":"phrasal","p":"v","f":"","n":"put up with: hoşnutsuz olduğun bir durumu sineye çekmek.","m":[["put up with","katlanmak, tahammül etmek","Residents had to *put up with* noise and pollution.","Sakinler, gürültüye ve kirliliğe katlanmak zorunda kaldı."],["tolerate","hoşgörmek, tolere etmek","A democracy must *tolerate* dissenting views.","Demokrasi, karşıt görüşleri hoşgörmelidir."],["endure","dayanmak, katlanmak","Workers *endured* harsh conditions for decades.","İşçiler, on yıllarca ağır koşullara dayandı."],["bear","tahammül etmek, taşımak","Local councils *bear* much of the cost.","Yerel yönetimler, maliyetin büyük bölümünü taşıyor."]]},{"d":"phrasal","p":"v","f":"","n":"point out: bir hususu belirtmek. bring up: bir konuyu gündeme taşımak.","m":[["point out","belirtmek, dikkat çekmek","Critics *point out* that the scheme excludes the poorest.","Eleştirmenler, programın en yoksulları dışarıda bıraktığını belirtiyor."],["draw attention to","dikkat çekmek","The report *draws attention to* regional gaps.","Rapor, bölgesel farklılıklara dikkat çekiyor."],["bring up","(konuyu) gündeme getirmek","Delegates *brought up* the issue of funding.","Delegeler, finansman konusunu gündeme getirdi."],["refer to","değinmek, atıfta bulunmak","The author *refers to* several earlier studies.","Yazar, daha önceki birçok çalışmaya atıfta bulunuyor."]],"s":false},{"d":"phrasal","p":"v","f":"","n":"renounce/relinquish: hak veya makamdan resmen vazgeçmek.","m":[["give up","vazgeçmek","Many students *give up* their studies for financial reasons.","Birçok öğrenci, mali nedenlerle eğitimden vazgeçiyor."],["abandon","terk etmek, vazgeçmek","The government *abandoned* the plan.","Hükümet, plandan vazgeçti."],["renounce","(resmen) vazgeçmek, reddetmek","He *renounced* his claim to the throne.","Taht üzerindeki hakkından resmen vazgeçti."],["relinquish","(hak, güç) bırakmak","The king was forced to *relinquish* power.","Kral, iktidarı bırakmak zorunda kaldı."]]},{"d":"phrasal","p":"v","f":"","n":"set up/found/establish: kurmak. institute: bir sistemi başlatmak.","m":[["set up","kurmak","The charity *set up* schools in remote areas.","Hayır kurumu, uzak bölgelerde okullar kurdu."],["establish","kurmak","The government *established* a commission to study migration.","Hükümet, göçü incelemek üzere bir komisyon kurdu."],["found","(kurum, şirket) kurmak","The party was *founded* in the 1920s.","Parti, 1920’lerde kuruldu."],["launch","başlatmak","The ministry *launched* a literacy campaign.","Bakanlık, bir okuryazarlık kampanyası başlattı."],["institute","(sistem, kural) getirmek","The state *instituted* a system of compulsory schooling.","Devlet, zorunlu okul eğitimi sistemini getirdi."]]},{"d":"phrasal","p":"v","f":"","n":"take into account/consideration: bir etkeni hesaba katmak.","m":[["take into account","dikkate almak","Policy makers must *take into account* regional differences.","Politika yapıcılar, bölgesel farklılıkları dikkate almalıdır."],["take into consideration","göz önünde bulundurmak","The court *took into consideration* his age.","Mahkeme, onun yaşını göz önünde bulundurdu."],["allow for","hesaba katmak","The budget *allows for* unexpected costs.","Bütçe, beklenmedik maliyetleri hesaba katıyor."],["bear in mind","aklında tutmak","We should *bear in mind* that the sample was small.","Örneklemin küçük olduğunu aklımızda tutmalıyız."]]},{"d":"phrasal","p":"v","f":"","n":"hinge on: bir şeyin sonucu tamamen buna bağlıdır.","m":[["rely on","-e güvenmek, bağlı olmak","Many families *rely on* remittances.","Birçok aile, yurtdışından gönderilen paralara güveniyor."],["depend on","-e bağlı olmak","Success *depends on* public support.","Başarı, kamuoyu desteğine bağlıdır."],["count on","-e güvenmek, bel bağlamak","Parties cannot *count on* loyal voters.","Partiler, sadık seçmenlere bel bağlayamaz."],["hinge on","-e bağlı olmak (belirleyici)","The outcome *hinges on* turnout.","Sonuç, tümüyle seçime katılım oranına bağlıdır."]]},{"d":"phrasal","p":"v","f":"","n":"turn out + to be: beklenenin aksine ortaya çıkmak. end up: sonunda bir durumda kalmak.","m":[["turn out","(sonunda) ortaya çıkmak","The forecast *turned out* to be wrong.","Tahminin yanlış olduğu ortaya çıktı."],["end up","sonunda -mek durumunda kalmak","Many graduates *end up* in unrelated jobs.","Birçok mezun, alanıyla ilgisiz işlerde çalışmak durumunda kalıyor."],["prove","(sonuçta) çıkmak, kanıtlamak","The reform *proved* more costly than expected.","Reform, beklenenden daha maliyetli çıktı."],["transpire","(sonradan) ortaya çıkmak","It later *transpired* that the figures were false.","Rakamların sahte olduğu sonradan ortaya çıktı."]],"s":false},{"d":"phrasal","p":"v","f":"","n":"come up with: yeni bir fikir bulmak. put forward: bir öneriyi ortaya koymak.","m":[["come up with","(fikir) bulmak, üretmek","Researchers *came up with* a new model.","Araştırmacılar, yeni bir model üretti."],["put forward","ileri sürmek, önermek","The party *put forward* a plan to cut taxes.","Parti, vergileri düşürmeye yönelik bir plan ileri sürdü."],["devise","tasarlamak, bulmak","Planners *devised* a scheme to relocate villages.","Planlamacılar, köyleri yeniden yerleştirmeye yönelik bir düzen tasarladı."],["formulate","formüle etmek","The sociologist *formulated* a theory of social capital.","Sosyolog, sosyal sermaye kuramını formüle etti."]]},{"d":"phrasal","p":"v","f":"","n":"break down: müzakerenin veya sistemin çökmesi. disintegrate: parçalara ayrılarak dağılmak.","m":[["break down","çökmek, bozulmak","Negotiations *broke down* after three days.","Müzakereler, üç gün sonra çöktü."],["collapse","çökmek","The regime *collapsed* within weeks.","Rejim, haftalar içinde çöktü."],["fall apart","dağılmak","Coalition governments can *fall apart* quickly.","Koalisyon hükümetleri, hızla dağılabilir."],["disintegrate","parçalanmak","The empire *disintegrated* after the war.","İmparatorluk, savaştan sonra parçalandı."]]},{"d":"phrasal","p":"v","f":"","n":"take over: yönetimi devralmak. take on: bir sorumluluğu üstlenmek.","m":[["take over","devralmak","The military *took over* the government.","Ordu, hükümetin yönetimini devraldı."],["take on","üstlenmek","Women *took on* new roles during the war.","Kadınlar, savaş sırasında yeni roller üstlendi."],["assume","(sorumluluk, yetki) üstlenmek; varsaymak","The prime minister *assumed* responsibility for the failure.","Başbakan, başarısızlığın sorumluluğunu üstlendi."],["seize","ele geçirmek","Rebels *seized* the capital.","İsyancılar, başkenti ele geçirdi."]],"s":false},{"d":"phrasal","p":"v","f":"","n":"look into: resmi olmayan araştırma. investigate: resmi soruşturma.","m":[["look into","araştırmak, incelemek","A committee will *look into* the complaints.","Bir komite, şikâyetleri inceleyecek."],["investigate","soruşturmak, araştırmak","Police *investigated* the cause of the riot.","Polis, ayaklanmanın nedenini soruşturdu."],["probe","derinlemesine araştırmak","Journalists *probed* the minister’s finances.","Gazeteciler, bakanın mali durumunu derinlemesine araştırdı."],["delve into","derinlemesine incelemek","The book *delves into* the roots of nationalism.","Kitap, milliyetçiliğin köklerini derinlemesine inceliyor."]]},{"d":"phrasal","p":"v","f":"","n":"phase out: kademeli olarak sonlandırmak. wind down: faaliyeti yavaş yavaş küçültüp kapatmak.","m":[["phase out","kademeli olarak kaldırmak","The state plans to *phase out* coal subsidies.","Devlet, kömür sübvansiyonlarını kademeli olarak kaldırmayı planlıyor."],["do away with","ortadan kaldırmak","Some argue we should *do away with* standardised tests.","Bazıları, standartlaştırılmış sınavların ortadan kaldırılması gerektiğini savunuyor."],["wind down","(faaliyeti) azaltarak kapatmak","The agency was *wound down* in 2010.","Kurum, 2010’da faaliyetleri azaltılarak kapatıldı."],["scale back","küçültmek, kısmak","Authorities *scaled back* the programme.","Yetkililer, programı küçülttü."]]},{"d":"phrasal","p":"v","f":"","n":"make up/constitute/comprise: bir bütünü oluşturan parçalar. account for: bir oranı oluşturmak.","m":[["make up","oluşturmak","Women *make up* most of the teaching workforce.","Öğretmenlik iş gücünün çoğunluğunu kadınlar oluşturuyor."],["constitute","oluşturmak, teşkil etmek","Such behaviour *constitutes* a criminal offence.","Bu tür davranış, suç teşkil eder."],["comprise","-den oluşmak, kapsamak","The committee *comprises* twelve members.","Komite, on iki üyeden oluşur."],["account for","(oran) oluşturmak; açıklamak","Services *account for* two thirds of output.","Hizmetler sektörü, üretimin üçte ikisini oluşturuyor."]]},{"d":"phrasal","p":"v","f":"","n":"dispose of: işi bitmiş bir şeyden kurtulmak (atık, mülk).","m":[["get rid of","kurtulmak","Communities want to *get rid of* corrupt officials.","Toplumlar, yolsuz görevlilerden kurtulmak istiyor."],["dispose of","elden çıkarmak, bertaraf etmek","Factories must *dispose of* waste safely.","
