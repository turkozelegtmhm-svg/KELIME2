sonra bile enflasyonun neden sürdüğünü uzun zamandır tartışıyor. Bir kurama göre firmalar artan maliyetleri basitçe tüketicilere yansıtır; bir başkası ise hanehalklarının daha yüksek fiyatlar beklediğini ve korktukları artışların ta kendisini tetikleyecek biçimde davrandığını vurgular. Sorun, ücret anlaşmalarının geçmiş fiyat hareketlerine bağlanması durumunda daha da büyür; çünkü işverenler yüksek işgücü maliyetlerini karşılamak için fiyatları yeniden yükseltir. Gelir bu artışlara nadiren ayak uydurabildiği için yük, birikimi az olan savunmasız kesimlerin üzerine en ağır biçimde biner. Bu nedenle politika yapıcılar zor bir tercihle karşı karşıyadır: faiz oranlarındaki keskin bir artış fiyat artışını dizginleyebilir, ancak aynı zamanda resesyonu derinleştirebilir ve işsizliği yükseltebilir.","q":[{"q":"What is the main point of the passage?","o":["Central banks have no real means of influencing price levels.","Rising labour costs are the only genuine cause of inflation.","Inflation can sustain itself through several channels, and fighting it carries a cost.","Wage agreements should never be linked to earlier price movements.","Households with few savings gain the most from higher prices."],"a":2,"e":"Metin, enflasyonun beklentiler ve ücret-fiyat bağlantısı yoluyla kendini beslediğini, faiz artırmanın ise resesyon riski taşıdığını anlatır. Diğer şıklar metinle çelişir ya da metinde yoktur."},{"q":"The word 'compounded' in the passage is closest in meaning to","o":["made worse","settled","hidden","calculated","reversed"],"a":0,"e":"'The problem is compounded when wage agreements are linked...' cümlesinde sorunun daha da kötüleştiği anlatılır; çünkü işverenler fiyatları yeniden yükseltir. 'Made worse' doğrudur."}]},{"id":"the-limits-of-competition","t":"The Limits of Competition","f":"Ekonomi","x":"In theory, {{competition}} drives firms to lower their prices and improve their products. In practice, many markets are dominated by a handful of producers, a structure known as an {{oligopoly}}. Such firms may be tempted to form a {{cartel}}, agreeing to restrict {{output}} so that prices stay artificially high. Even without open collusion, heavy start-up costs and strict licensing rules create a {{barrier}} that discourages newcomers from entering the market. Defenders of large firms {{contend}} that size brings greater {{efficiency}}, a claim that is sometimes correct. Nevertheless, most economists accept that unchecked market power {{undermines|undermine}} consumer welfare, which is why governments adopt {{regulation}} designed to keep markets open.","tr":"Kuramsal olarak rekabet, firmaları fiyatlarını düşürmeye ve ürünlerini geliştirmeye iter. Uygulamada ise birçok pazara bir avuç üretici egemendir; bu yapıya azınlık tekeli (oligopol) denir. Bu tür firmalar, fiyatların yapay biçimde yüksek kalması için üretimi kısmayı kararlaştırarak bir kartel kurmaya yönelebilir. Açık bir danışıklılık olmasa bile yüksek kuruluş maliyetleri ve katı ruhsat kuralları, yeni gelenlerin pazara girmesini caydıran bir engel oluşturur. Büyük firmaları savunanlar, büyüklüğün daha fazla verimlilik getirdiğini ileri sürer; bu iddia bazen doğrudur. Yine de çoğu iktisatçı, denetimsiz piyasa gücünün tüketici refahını zayıflattığını kabul eder; hükümetlerin piyasaları açık tutmayı amaçlayan düzenlemeler benimsemesinin nedeni de budur.","q":[{"q":"What is the main point of the passage?","o":["Large firms are always more efficient than small ones.","Governments should avoid interfering in markets dominated by a few producers.","Cartels are legal in most economies because they raise output.","Concentrated markets can weaken competition and harm consumers, so governments intervene.","Licensing rules are the main reason prices fall in an oligopoly."],"a":3,"e":"Metin, birkaç üreticinin egemen olduğu piyasaların rekabeti ve tüketici refahını zayıflatabildiğini; bu yüzden hükümetlerin piyasaları açık tutan düzenlemeler getirdiğini anlatır (son cümle)."},{"q":"The word 'undermines' in the passage is closest in meaning to","o":["defends","weakens","measures","replaces","announces"],"a":1,"e":"'Unchecked market power undermines consumer welfare' cümlesinde undermine, refahı aşındırmak/zayıflatmak anlamındadır; bu yüzden düzenleme gerekir. 'Weakens' doğru cevaptır."}]},{"id":"borrowing-and-balanced-budgets","t":"Borrowing and Balanced Budgets","f":"Ekonomi","x":"Governments that spend more than they collect run a budget {{deficit}}, which must be financed by borrowing. During a downturn this is often considered sensible, because public spending can {{stimulate}} demand when private firms are {{reluctant}} to invest. Yet persistent borrowing raises interest payments over time and leaves less {{revenue}} for schools and hospitals. Some governments respond with {{austerity}}, cutting expenditure and raising {{taxes|tax}} in order to restore {{fiscal}} balance. Critics {{argue}} that this approach can prolong {{stagnation}}, since lower public spending reduces demand even further. Supporters reply that lenders will punish any government that postpones adjustment. The evidence suggests that the right policy depends heavily on timing and circumstances.","tr":"Topladığından fazla harcayan hükümetler bir bütçe açığı verir ve bu açık borçlanmayla finanse edilmelidir. Ekonomik daralma döneminde bu çoğu zaman makul sayılır; çünkü özel firmalar yatırım yapmaya isteksiz olduğunda kamu harcamaları talebi canlandırabilir. Ne var ki sürekli borçlanma zamanla faiz ödemelerini artırır ve okullara ile hastanelere ayrılacak geliri azaltır. Bazı hükümetler kemer sıkma politikasıyla karşılık verir: harcamaları keser, vergileri artırır ve böylece mali dengeyi yeniden sağlamaya çalışır. Eleştirmenler bu yaklaşımın durgunluğu uzatabileceğini savunur; çünkü azalan kamu harcaması talebi daha da düşürür. Destekçileri ise uyum sağlamayı erteleyen her hükümetin borç verenlerce cezalandırılacağını söyler. Kanıtlar, doğru politikanın büyük ölçüde zamanlamaya ve koşullara bağlı olduğunu göstermektedir.","q":[{"q":"It can be inferred from the passage that the author believes","o":["a government should avoid running a deficit under all circumstances","austerity is always the most responsible policy for governments","public spending has no effect on private investment decisions","lenders are rarely concerned about government borrowing","the appropriate fiscal policy depends on timing and circumstances"],"a":4,"e":"Son cümle, doğru politikanın zamanlamaya ve koşullara büyük ölçüde bağlı olduğunu söyler; yazar bu konuda mutlak bir kural savunmaz. Diğer şıklar bu görüşle uyuşmaz."},{"q":"The phrase 'this approach' in the passage refers to","o":["borrowing money to finance a budget deficit","stimulating demand through public spending","cutting expenditure and raising taxes","postponing fiscal adjustment","increasing payments on public debt"],"a":2,"e":"'Some governments respond with austerity, cutting expenditure and raising taxes... Critics argue that this approach...' ifadesinde 'this approach', kemer sıkma politikasını (harcama kesme ve vergi artırma) gösterir."}]},{"id":"innocent-until-proven-guilty","t":"Innocent Until Proven Guilty","f":"Hukuk","x":"A cornerstone of criminal procedure is the {{presumption}} of innocence: a {{defendant}} is treated as innocent until the state has established guilt. This places the burden of {{proof}} on the prosecution, which must present {{evidence}} strong enough to leave no reasonable doubt. A court may hear the {{testimony}} of a single {{witness}}, yet it will treat such an account cautiously unless other material {{corroborates|corroborate}} it. When serious doubts remain, judges are obliged to {{acquit}}, because it is considered worse to {{convict}} an innocent person than to release a guilty one. Critics sometimes complain that this standard lets wrongdoers escape, but its defenders regard that risk as the necessary price of protecting individual liberty.","tr":"Ceza muhakemesinin temel taşlarından biri masumiyet karinesidir: sanık, devlet suçluluğunu ortaya koyana kadar masum kabul edilir. Bu durum ispat yükünü, makul şüpheye yer bırakmayacak güçte delil sunması gereken iddia makamına yükler. Mahkeme tek bir tanığın ifadesini dinleyebilir; ancak başka materyaller bu ifadeyi doğrulamadıkça bu anlatıma temkinli yaklaşır. Ciddi şüpheler sürdüğünde hâkimler beraat kararı vermekle yükümlüdür; çünkü masum bir kişiyi mahkûm etmek, suçlu birini serbest bırakmaktan daha kötü sayılır. Eleştirenler bazen bu ölçütün suçluların kurtulmasına yol açtığından yakınır; ancak savunucular bu riski bireysel özgürlüğü korumanın gerekli bedeli olarak görür.","q":[{"q":"What is the main point of the passage?","o":["Courts should prefer the account of a single witness over other types of material.","The law protects the accused by requiring the state to prove guilt beyond reasonable doubt.","Most criminal trials end in acquittal because evidence is rarely strong enough.","The prosecution and the defence share equally the duty of proving guilt.","Wrongdoers escape punishment because courts are too cautious about convictions."],"a":1,"e":"Metin masumiyet karinesini ve ispat yükünün iddia makamında olduğunu, şüphe kaldığında beraatin esas olduğunu anlatır. Diğer şıklar metinde desteklenmez ya da metne ters düşer."},{"q":"The word 'corroborates' in the passage is closest in meaning to","o":["challenges","records","summarises","confirms","replaces"],"a":3,"e":"'Unless other material corroborates it' ifadesi, tek tanığın anlatımının başka materyalle doğrulanması anlamına gelir. 'Confirms' en yakın anlamdır."}]},{"id":"when-contracts-are-broken","t":"When Contracts Are Broken","f":"Hukuk","x":"When one party fails to meet an {{obligation}} under a contract, the other may allege a {{breach}} and seek a remedy. Courts do not, however, automatically impose {{liability}} on the defaulting party. They first ask whether the failure was caused by circumstances beyond its control, and whether the injured party took reasonable steps to {{limit}} its losses. The aim of contract law is generally to {{restore}} the {{plaintiff}} to the position it would have enjoyed had the promise been kept, not to {{penalise}} the other side. For that reason, many businesses prefer a negotiated {{settlement}}, which is quicker and cheaper than a {{lawsuit}} and allows a commercial relationship to survive.","tr":"Taraflardan biri bir sözleşme kapsamındaki yükümlülüğünü yerine getiremediğinde, diğer taraf bir ihlal iddiasında bulunabilir ve çözüm yolu arayabilir. Ancak mahkemeler temerrüde düşen tarafa otomatik olarak sorumluluk yüklemez. Önce, başarısızlığın tarafın denetimi dışındaki koşullardan kaynaklanıp kaynaklanmadığını ve zarar gören tarafın kayıplarını sınırlamak için makul adımlar atıp atmadığını sorgularlar. Sözleşme hukukunun amacı genellikle, davacıyı söz tutulmuş olsaydı sahip olacağı konuma geri getirmektir; karşı tarafı cezalandırmak değil. Bu nedenle birçok işletme, ticari ilişkinin sürmesine olanak tanıyan, dava açmaktan daha hızlı ve ucuz olan müzakereyle varılmış bir uzlaşmayı tercih eder.","q":[{"q":"What is the main point of the passage?","o":["Contract remedies mainly aim to repair the injured party's position rather than to punish the defaulting party.","A party that breaks a contract is automatically required to pay for every loss.","Courts encourage lawsuits because they are quicker than negotiation.","Contract law is intended chiefly to discourage businesses from making promises.","Injured parties are not expected to take any steps to reduce their losses."],"a":0,"e":"Metin, mahkemelerin sorumluluğu otomatik yüklemediğini ve sözleşme hukukunun amacının davacıyı söz tutulmuş olsaydı bulunacağı konuma getirmek, cezalandırmak olmadığını belirtir."},{"q":"The word 'restore' in the passage is closest in meaning to","o":["protect","reward","examine","forgive","return"],"a":4,"e":"'Restore the plaintiff to the position it would have enjoyed' ifadesinde restore, davacıyı olması gereken konuma geri getirmek demektir; 'return' en yakın anlamdır."}]},{"id":"following-precedent","t":"Following Precedent","f":"Hukuk","x":"Common-law systems rely heavily on {{precedent}}, meaning that judges are expected to follow the {{rulings|ruling}} of earlier courts in comparable cases. This practice promotes {{consistent}} treatment, because citizens can predict how a court will read a {{statute}} before a dispute arises. It also restrains {{arbitrary}} decisions that would reflect a judge's personal views. Yet precedent can become {{rigid}}, binding courts to rules that no longer suit social conditions. For this reason, a higher court hearing an {{appeal}} may decline to {{uphold}} a doctrine it considers {{outdated}}, provided it explains its reasoning openly. In this way the law remains stable without becoming frozen.","tr":"Ortak hukuk (common law) sistemleri büyük ölçüde emsal kararlara dayanır; yani hâkimlerin benzer davalarda önceki mahkemelerin kararlarını izlemesi beklenir. Bu uygulama, vatandaşların bir uyuşmazlık doğmadan önce mahkemenin bir kanunu nasıl yorumlayacağını öngörebilmesini sağladığı için tutarlı bir muameleyi destekler. Aynı zamanda hâkimin kişisel görüşlerini yansıtacak keyfî kararları da sınırlar. Ne var ki emsal katılaşabilir ve mahkemeleri artık toplumsal koşullara uymayan kurallara bağlayabilir. Bu nedenle, temyiz başvurusunu gören üst bir mahkeme, gerekçesini açıkça açıklaması koşuluyla, modası geçmiş saydığı bir öğretiyi onamayı reddedebilir. Böylece hukuk, donup kalmadan istikrarlı kalır.","q":[{"q":"What is the main point of the passage?","o":["Judges in common-law systems may ignore earlier rulings whenever they wish.","Following precedent makes it harder for citizens to predict court decisions.","Statutes are read more reliably in civil-law systems than in common-law systems.","Higher courts are never permitted to reconsider doctrines set by earlier courts.","Precedent gives the law predictability, yet higher courts can still adjust it when it becomes outdated."],"a":4,"e":"Metin emsalin öngörülebilirlik sağladığını, ancak katılaşırsa üst mahkemelerin gerekçelerini açıklayarak eski bir öğretiyi onamayabileceğini söyler; böylece hukuk hem istikrarlı hem esnek kalır."},{"q":"The word 'arbitrary' in the passage is closest in meaning to","o":["based on a careful comparison with earlier cases","based on personal choice rather than rules","supported by the views of the public","limited to purely technical matters","approved in advance by a higher court"],"a":1,"e":"Cümle, arbitrary kararları 'hâkimin kişisel görüşlerini yansıtan' kararlar olarak tanımlar; yani kurala değil kişisel tercihe dayanan, keyfî kararlardır."}]},{"id":"why-citizens-do-not-vote","t":"Why Citizens Do Not Vote","f":"Siyaset bilimi","x":"Low {{turnout}} concerns democratic theorists because an {{electorate}} that stays at home may no longer reflect the wider population. Some scholars attribute abstention to {{apathetic}} attitudes, yet many non-voters are in fact well informed; they simply doubt that casting a {{ballot}} will change anything. Others point to practical {{impediments|impediment}}, such as inconvenient polling hours or complicated registration rules. A few countries make voting {{compulsory}} and {{punish}} those who stay away, which raises participation sharply. Opponents {{maintain}} that forced participation cheapens the act, since citizens who are made to vote may choose carelessly.","tr":"Düşük katılım, demokrasi kuramcılarını ilgilendirir; çünkü evde kalan bir seçmen kitlesi artık geniş toplumu yansıtmayabilir. Bazı araştırmacılar sandığa gitmemeyi ilgisiz tutumlara bağlar; oysa oy kullanmayanların çoğu aslında iyi bilgilidir ve yalnızca oy pusulası atmanın hiçbir şeyi değiştireceğinden şüphe eder. Diğerleri ise elverişsiz oy verme saatleri ya da karmaşık kayıt kuralları gibi pratik engellere dikkat çeker. Birkaç ülke oy kullanmayı zorunlu kılar ve uzak duranları cezalandırır; bu da katılımı keskin biçimde artırır. Karşı çıkanlar, zorla katılımın bu eylemi değersizleştirdiğini, çünkü oy vermeye mecbur bırakılan vatandaşların özensiz tercih yapabileceğini ısrarla savunur.","q":[{"q":"What is the main point of the passage?","o":["Compulsory voting has been abandoned in most countries that once adopted it.","Most non-voters are poorly informed and uninterested in politics.","People abstain for varied reasons, and compulsory voting as a remedy is itself disputed.","Complicated registration rules are the sole cause of low turnout.","A representative electorate is of little concern to democratic theorists."],"a":2,"e":"Metin, çekimserliğin birden çok nedenini (ilgisizlik, şüphe, pratik engeller) sıralar ve çözüm olarak sunulan zorunlu oyun da tartışmalı olduğunu belirtir. Diğer şıklar metne aykırıdır."},{"q":"The word 'maintain' in the passage is closest in meaning to","o":["insist","preserve","repair","doubt","admit"],"a":0,"e":"'Opponents maintain that forced participation cheapens the act' cümlesinde maintain, 'ısrarla savunmak' anlamındadır; 'insist' doğrudur. 'Preserve' kelimenin burada kullanılmayan başka bir anlamıdır."}]},{"id":"governing-together","t":"Governing Together","f":"Siyaset bilimi","x":"Under proportional electoral systems, a single party often fails to win an outright majority, so several parties must form a {{coalition}} in order to govern. Supporters value this arrangement because partners have to build {{consensus}} before they act, which produces policies that reflect a wider range of public opinion. Differences of {{ideology}} can, however, make such agreements {{short-lived}}, and a quarrel over the budget may bring the {{cabinet}} down within months. Critics add that voters find it hard to assign {{accountability}} when power is divided, since each partner can blame the others for failures. Defenders reply that shared government {{fosters|foster}} moderation and slows hasty {{legislation}}, which they regard as a price worth paying.","tr":"Orantılı seçim sistemlerinde tek bir parti çoğu zaman açık bir çoğunluğu elde edemez; bu yüzden birkaç parti yönetmek için bir koalisyon kurmak zorundadır. Destekçiler bu düzenlemeyi değerli bulur; çünkü ortaklar harekete geçmeden önce uzlaşı oluşturmak zorundadır ve bu, kamuoyunun daha geniş bir yelpazesini yansıtan politikalar doğurur. Ancak ideoloji farkları bu tür anlaşmaları kısa ömürlü kılabilir; bütçe üzerindeki bir tartışma kabineyi aylar içinde düşürebilir. Eleştirmenler ayrıca iktidar bölüşüldüğünde seçmenlerin hesap verebilirliği kime yükleyeceğini bulmakta zorlandığını, çünkü her ortağın başarısızlıklar için diğerlerini suçlayabileceğini ekler. Savunucular ise paylaşılan hükümetin ılımlılığı teşvik ettiğini ve aceleci yasa yapımını yavaşlattığını, bunu da değecek bir bedel saydıklarını söyler.","q":[{"q":"What is the main point of the passage?","o":["Coalition governments are more stable than single-party governments.","Proportional systems prevent parties from agreeing on any policy.","Voters generally prefer governments run by a single party.","Coalition government encourages broad agreement but can be unstable and blur responsibility.","Budgets are the only issue on which coalition partners disagree."],"a":3,"e":"Metin, koalisyonların geniş uzlaşıyı teşvik ettiğini, ancak kısa ömürlü olabildiğini ve sorumluluğu bulanıklaştırdığını anlatır. Diğer şıklar metne aykırı ya da metinde desteksizdir."},{"q":"The word 'fosters' in the passage is closest in meaning to","o":["opposes","conceals","encourages","postpones","measures"],"a":2,"e":"'Shared government fosters moderation' cümlesi, savunucuların paylaşılan yönetimin ılımlılığı desteklediğini söylediğini anlatır. 'Encourages' en yakın anlamdır."}]},{"id":"why-people-obey","t":"Why People Obey","f":"Siyaset bilimi","x":"Political scientists distinguish between power and {{authority}}. A ruler may win obedience through fear, but obedience of this kind is rarely stable. A {{regime}} is regarded as {{legitimate}} when most citizens accept its right to rule, whether because it follows agreed procedures, delivers security, or reflects long-standing {{tradition}}. When that acceptance {{erodes|erode}}, even a powerful government may face {{unrest}}, and a minor incident can set off a wider {{uprising}}. Regimes that rely chiefly on force must spend ever more resources to {{sustain}} control, which makes them {{susceptible}} to sudden collapse. By contrast, rulers who are widely accepted can govern at lower cost.","tr":"Siyaset bilimciler güç ile otorite arasında ayrım yapar. Bir yönetici korku yoluyla itaat sağlayabilir, ancak bu tür bir itaat nadiren istikrarlıdır. Bir rejim, vatandaşların çoğu onun yönetme hakkını kabul ettiğinde meşru sayılır; bu kabul, rejimin üzerinde anlaşılmış usulleri izlemesinden, güvenlik sağlamasından ya da köklü bir geleneği yansıtmasından kaynaklanabilir. Bu kabul aşındığında güçlü bir hükümet bile huzursuzlukla karşılaşabilir ve küçük bir olay daha geniş bir ayaklanmayı başlatabilir. Esas olarak zora dayanan rejimler, denetimi sürdürmek için giderek daha fazla kaynak harcamak zorundadır; bu da onları ani bir çöküşe açık hâle getirir. Buna karşılık, geniş kesimlerce kabul gören yöneticiler daha düşük maliyetle yönetebilir.","q":[{"q":"The passage suggests that a regime relying mainly on force","o":["is likely to be accepted by most citizens as legitimate","must spend growing resources and remains exposed to sudden collapse","can govern at lower cost than a widely accepted ruler","no longer needs to follow agreed procedures","is protected from unrest by its own strength"],"a":1,"e":"Metin, zora dayanan rejimlerin denetimi sürdürmek için giderek daha fazla kaynak harcadığını ve ani çöküşe açık olduğunu söyler; diğer şıklar bu çıkarımla çelişir."},{"q":"The word 'erodes' in the passage is closest in meaning to","o":["spreads widely","becomes more formal","is openly announced","is carefully measured","gradually weakens"],"a":4,"e":"'When that acceptance erodes, even a powerful government may face unrest' cümlesinde kabulün zamanla zayıfladığı anlatılır; erode aşınmak demektir. 'Gradually weakens' doğrudur."}]},{"id":"do-sanctions-work","t":"Do Sanctions Work?","f":"Uluslararası ilişkiler","x":"Governments increasingly turn to {{sanctions|sanction}} when they wish to pressure another state without using force. A trade {{embargo}} or a financial freeze is meant to impose enough {{hardship}} that the target changes its behaviour. Yet the record is mixed. Targeted states often find alternative trading partners, and the burden may fall less on the leadership than on ordinary citizens, who suffer {{shortages|shortage}} while officials remain protected. Sanctions can even {{strengthen}} a government by allowing it to blame foreign enemies for domestic problems. Analysts therefore {{stress}} that sanctions work best when they are {{backed|back}} by a wide group of states and accompanied by clear conditions for their removal.","tr":"Hükümetler, başka bir devlete güç kullanmadan baskı yapmak istediklerinde giderek daha sık yaptırımlara başvuruyor. Bir ticaret ambargosu ya da bir mali dondurma, hedefin davranışını değiştirmesine yetecek kadar sıkıntı yaratmayı amaçlar. Ancak sicil karışıktır. Hedef devletler çoğu zaman alternatif ticaret ortakları bulur; yük de yöneticilerden çok, yetkililer korunurken kıtlık çeken sıradan vatandaşların üzerine binebilir. Yaptırımlar, bir hükümete iç sorunlar için yabancı düşmanları suçlama imkânı vererek onu güçlendirebilir bile. Bu nedenle analistler, yaptırımların ancak geniş bir devlet grubunca desteklendiğinde ve kaldırılmaları için net koşullarla birlikte yürütüldüğünde en iyi sonucu verdiğini vurgular.","q":[{"q":"What is the main point of the passage?","o":["Sanctions are an uncertain tool that can harm ordinary people and even help the target government.","Sanctions reliably force the target government to change its behaviour.","Military force is a more effective instrument of pressure than sanctions.","Ordinary citizens are usually protected from the effects of sanctions.","Trade embargoes are more effective than financial freezes."],"a":0,"e":"Metin yaptırımların sonucunun karışık olduğunu, sıradan insanlara zarar verebildiğini ve hedef hükümeti güçlendirebildiğini; ancak geniş destekle daha iyi işlediğini anlatır."},{"q":"The word 'stress' in the passage is closest in meaning to","o":["deny","worry about","regret","emphasise","overlook"],"a":3,"e":"'Analysts therefore stress that sanctions work best when...' cümlesinde stress, 'üzerinde durmak, vurgulamak' anlamındadır; 'emphasise' doğrudur."}]},{"id":"the-security-dilemma","t":"The Security Dilemma","f":"Uluslararası ilişkiler","x":"States form an {{alliance}} chiefly to discourage attack, yet the same arrangement may alarm neighbours that never intended any harm. When one state increases its military strength, others may read the move as a threat and respond in kind. This spiral, commonly called the security dilemma, can {{escalate}} even though no party wants war. {{Deterrence|deterrence}} works only if threats are believed, but visible preparations can also deepen {{animosity}} between neighbours. Careful {{diplomacy}} is therefore needed to {{dispel}} mistaken fears. Regular {{dialogue}} between military leaders, open communication channels and transparent talks on weapons limits all help to {{mitigate}} the misunderstandings that make cooperation so difficult.","tr":"Devletler esas olarak saldırıyı caydırmak için bir ittifak kurar; ancak aynı düzenleme, hiçbir zaman zarar vermeyi amaçlamamış komşuları ürkütebilir. Bir devlet askerî gücünü artırdığında diğerleri bu hamleyi bir tehdit olarak okuyabilir ve aynı şekilde karşılık verebilir. Genellikle güvenlik ikilemi olarak adlandırılan bu sarmal, hiçbir taraf savaş istemese bile tırmanabilir. Caydırıcılık ancak tehditlere inanılırsa işler; ama gözle görülür hazırlıklar komşular arasındaki düşmanlığı da derinleştirebilir. Bu nedenle yanlış korkuları gidermek için özenli bir diplomasi gerekir. Askerî liderler arasındaki düzenli diyalog, açık iletişim kanalları ve silah sınırlarına ilişkin şeffaf görüşmeler, iş birliğini bu kadar zorlaştıran yanlış anlamaları hafifletmeye yardımcı olur.","q":[{"q":"What is the main point of the passage?","o":["Alliances are the most reliable way to guarantee lasting peace.","Military build-ups always succeed in deterring potential aggressors.","Neighbouring states rarely react to changes in each other's military strength.","Communication between military leaders tends to increase mistrust.","Efforts by states to improve their security can create fear in others, so diplomacy is needed to reduce misunderstanding."],"a":4,"e":"Metin, bir devletin güvenliğini artırma çabasının diğerlerinde korku yaratıp tırmanışa yol açabildiğini, bu yüzden yanlış anlamaları gidermek için diplomasi gerektiğini anlatır."},{"q":"The phrase 'respond in kind' in the passage means","o":["respond with generosity","react with comparable measures","remain completely silent","ask allies for assistance","request immediate negotiations"],"a":1,"e":"Bir devlet gücünü artırınca diğerleri bunu tehdit sayıp 'respond in kind' yapar; yani benzer askerî önlemlerle karşılık verir. Sarmalın nedeni budur."}]},{"id":"sharing-sovereignty","t":"Sharing Sovereignty","f":"Uluslararası ilişkiler","x":"Joining an international organisation usually requires a state to accept limits on its freedom of action. Some leaders see this as an {{erosion}} of {{sovereignty}}, arguing that decisions should be made only by elected national bodies. Others {{assert}} that sovereignty is better understood as a capacity than as a possession: by joining a common framework, a state gains the ability to {{address}} problems such as {{pandemics|pandemic}} and financial crises, which no single government can {{handle}} alone. The difficulty is that organisations can seldom force members to {{comply}} with their decisions; they rely on reputation, peer pressure and the prospect of future cooperation. Where members value {{integration}} highly, such pressure works well. Where they do not, an {{accord}} may remain largely symbolic.","tr":"Uluslararası bir örgüte katılmak genellikle bir devletin hareket özgürlüğüne sınırlar kabul etmesini gerektirir. Bazı liderler bunu egemenliğin aşınması olarak görür ve kararların yalnızca seçilmiş ulusal organlarca alınması gerektiğini savunur. Diğerleri ise egemenliğin bir mülkiyet olmaktan çok bir kapasite olarak anlaşılması gerektiğini ileri sürer: ortak bir çerçeveye katılarak bir devlet, hiçbir tek hükümetin tek başına başa çıkamayacağı salgınlar ve mali krizler gibi sorunları ele alma yeteneği kazanır. Güçlük şudur ki örgütler üyeleri kararlarına uymaya nadiren zorlayabilir; itibara, akran baskısına ve gelecekteki iş birliği beklentisine dayanırlar. Üyelerin bütünleşmeye büyük değer verdiği yerlerde bu baskı iyi işler. Vermediği yerlerde ise bir anlaşma büyük ölçüde sembolik kalabilir.","q":[{"q":"What is the main point of the passage?","o":["International organisations can compel members to obey their decisions through legal penalties.","Joining international bodies involves a trade-off with sovereignty, and their influence depends on members' willingness to comply.","Sovereignty is a possession that every state should defend against all outside influence.","Pandemics and financial crises can be handled by any single government acting alone.","Peer pressure is useless because states never value cooperation."],"a":1,"e":"Metin, örgüt üyeliğinin egemenlikle bir takas içerdiğini ve örgütlerin etkisinin üyelerin uyma isteğine bağlı olduğunu anlatır. Diğer şıklar metne ters düşer."},{"q":"The word 'comply' in the passage is closest in meaning to","o":["disagree","negotiate","obey","withdraw","announce"],"a":2,"e":"'Force members to comply with their decisions' ifadesinde comply, örgüt kararlarına uymak/itaat etmek demektir; 'obey' en yakın anlamdır."}]},{"id":"why-empires-fragmented","t":"Why Empires Fragmented","f":"Tarih","x":"The decline of large empires is often presented as a sudden event, but most modern accounts {{point out}} that it was a gradual process. Long before a rival power {{seized|seize}} a capital, administrative structures had begun to {{break down}}. Heavy taxation {{hampered|hamper}} agricultural production, and distant provinces, {{owing to}} poor communication, increasingly ignored central decrees. Although the ruling dynasty tried to {{carry on}} as before, its authority was {{eroded|erode}} by regional elites who preferred to {{rely on}} their own armies. In the end, conquest merely {{precipitated|precipitate}} a collapse that internal weakness had already made inevitable. {{Thus|thus}}, the fall of an empire is better understood as the result of accumulated strain than of a single defeat.","tr":"Büyük imparatorlukların gerilemesi çoğu zaman ani bir olay olarak sunulur, ancak çağdaş anlatımların çoğu bunun aşamalı bir süreç olduğuna dikkat çeker. Rakip bir güç başkenti ele geçirmeden çok önce, idari yapılar çökmeye başlamıştı. Ağır vergilendirme tarımsal üretimi köstekledi; uzak eyaletler ise zayıf iletişim yüzünden merkezî fermanları giderek daha az dikkate aldı. Hüküm süren hanedan eskisi gibi sürdürmeye çalışsa da, otoritesi kendi ordularına güvenmeyi tercih eden bölgesel seçkinler tarafından aşındırıldı. Sonunda fetih, iç zayıflığın zaten kaçınılmaz kıldığı bir çöküşü yalnızca tetikledi. Dolayısıyla bir imparatorluğun yıkılışı, tek bir yenilgiden çok birikmiş gerilimin sonucu olarak anlaşılmalıdır.","q":[{"q":"What is the main point of the passage?","o":["Empires fell mainly because rival powers were militarily stronger.","The collapse of an empire usually reflects long-term internal weakening more than one decisive blow.","Heavy taxation was the only reason distant provinces rebelled.","Regional elites deliberately planned the destruction of the dynasty.","Historians disagree about whether empires ever really declined."],"a":1,"e":"Metin, çöküşün ani olmadığını; idari çözülme, vergi yükü ve bölgesel seçkinlerin güç kaybettirmesiyle birikmiş iç zayıflığın sonucu olduğunu vurgular ('Thus ...' cümlesi)."},{"q":"The word 'precipitated' in the passage is closest in meaning to","o":["triggered","postponed","prevented","predicted","reversed"],"a":0,"e":"'Precipitate' kötü bir gelişmeyi aniden tetiklemek demektir. Metinde fetih, iç zayıflığın zaten kaçınılmaz kıldığı çöküşü tetiklemiştir; en yakın anlam 'triggered'."}]},{"id":"the-shift-to-settled-life","t":"The Shift to Settled Life","f":"Tarih","x":"For most of human history, communities were {{nomadic}}, moving with the seasons in search of food. The gradual adoption of farming {{brought about|bring about}} a profound change, since fields could not be abandoned at will. {{Whereas|whereas}} mobile groups had little to store, {{sedentary}} villages produced a {{surplus}} that could be kept, traded, and eventually controlled. This accumulation {{gave rise to|give rise to}} new forms of {{hierarchy}}, because those who managed the stores gained power over others. Some scholars {{contend}} that settled life was therefore a mixed blessing: it supported larger populations, {{yet}} it also exposed people to disease and inequality. The transition {{hinged on|hinge on}} local conditions rather than on any universal pattern.","tr":"İnsanlık tarihinin büyük bölümünde topluluklar göçebeydi ve yiyecek arayışıyla mevsimlere göre yer değiştirirdi. Tarımın giderek benimsenmesi köklü bir değişim meydana getirdi, çünkü tarlalar canı istendiğinde terk edilemezdi. Hareketli grupların depolayacak pek bir şeyi yokken, yerleşik köyler saklanabilen, takas edilebilen ve zamanla denetim altına alınabilen bir fazla ürettiler. Bu birikim yeni hiyerarşi biçimlerini doğurdu, çünkü depoları yönetenler başkaları üzerinde güç kazandı. Bazı bilim insanları, yerleşik hayatın bu nedenle karışık bir nimet olduğunu savunur: daha büyük nüfusları destekledi, ancak insanları hastalığa ve eşitsizliğe de maruz bıraktı. Bu geçiş, evrensel bir örüntüye değil, yerel koşullara bağlıydı.","q":[{"q":"According to the passage, why did the surplus produced by settled villages lead to hierarchy?","o":["Nomadic groups demanded that villagers share their food.","Farmers were unable to store anything for later use.","Larger populations automatically chose a single ruler.","People who controlled the stored goods gained power over others.","Disease spread more quickly among those with little food."],"a":3,"e":"Metinde 'those who managed the stores gained power over others' denir: biriken fazlayı yönetenler güç kazandığı için yeni hiyerarşiler doğmuştur."},{"q":"The phrase 'hinged on' in the passage is closest in meaning to","o":["ended before","was prevented by","depended on","was opposed to","took place without"],"a":2,"e":"'Hinge on' belirleyici biçimde bağlı olmak demektir. Geçişin evrensel bir örüntüye değil yerel koşullara bağlı olduğu söylenir; en yakın anlam 'depended on'."}]},{"id":"reading-archives-critically","t":"Reading Archives Critically","f":"Tarih","x":"Written records seem to offer historians a direct window onto the past, but they must be read with caution. Official documents were usually produced by a literate minority, so they tend to present events from the viewpoint of those in power. A careful researcher therefore has to {{take into account}} who wrote a source and why. {{In contrast|contrast}}, the experiences of ordinary people are easily {{overlooked|overlook}}, since their {{testimony}} was rarely recorded. To {{corroborate}} a claim, historians compare several accounts, {{regardless of}} how authoritative any single one appears. Even a {{biased}} document can be valuable {{provided that}} its distortions are {{looked into|look into}} rather than simply dismissed.","tr":"Yazılı kayıtlar tarihçilere geçmişe doğrudan açılan bir pencere sunuyor gibi görünür, ancak bunlar dikkatle okunmalıdır. Resmî belgeler genellikle okuryazar bir azınlık tarafından üretilmiştir; bu yüzden olayları iktidardakilerin bakış açısından sunma eğilimindedirler. Bu nedenle dikkatli bir araştırmacı, bir kaynağı kimin ve neden yazdığını hesaba katmak zorundadır. Buna karşılık sıradan insanların deneyimleri kolayca gözden kaçar, çünkü onların tanıklığı nadiren kayda geçirilmiştir. Bir iddiayı başka kanıtlarla desteklemek için tarihçiler, tek bir kaynak ne kadar yetkili görünürse görünsün, birkaç anlatımı karşılaştırır. Yanlı bir belge bile, çarpıtmaları sırf bir kenara atılmak yerine incelenirse değerli olabilir.","q":[{"q":"What is the main idea of the passage?","o":["Historians should assess written sources critically because such sources reflect the position of their authors.","Ordinary people left far more records than officials did.","Biased documents have no value and should be discarded.","Written records are always more reliable than oral accounts.","Historians should depend on a single authoritative source."],"a":0,"e":"Metin, resmî belgelerin güç sahiplerinin bakışını yansıttığını; bu yüzden kaynakların yazarı, amacı ve diğer anlatımlarla karşılaştırılarak eleştirel okunması gerektiğini anlatır."},{"q":"The word 'corroborate' in the passage is closest in meaning to","o":["contradict","summarise","replace","imitate","confirm"],"a":4,"e":"'Corroborate' bir iddiayı başka kanıtlarla desteklemek/doğrulamak demektir. Metinde tarihçiler iddiayı sağlamlaştırmak için birkaç anlatımı karşılaştırır; en yakın anlam 'confirm'."}]},{"id":"cities-under-pressure","t":"Cities Under Pressure","f":"Coğrafya","x":"In many parts of the world, cities are expanding faster than their authorities can plan for. {{Migration|migration}} from the countryside is largely {{rooted in|be rooted in}} the search for work, {{even though}} newcomers often arrive where housing is {{scarce}} and public services are inadequate. Informal neighbourhoods therefore spread across the urban edge, frequently without clean water or reliable transport. Planners who study these neighbourhoods carefully can {{mitigate}} some of these problems, {{as long as}} funding is secured. Otherwise, pressure on infrastructure will {{escalate}}, and municipalities will {{end up}} permanently {{dealing with|deal with}} emergencies instead of shaping growth.","tr":"Dünyanın birçok yerinde şehirler, yetkililerin planlayabileceğinden daha hızlı büyüyor. Kırsal kesimden şehre göç büyük ölçüde iş arayışına dayanır; yeni gelenler çoğu zaman konutun kıt, kamu hizmetlerinin yetersiz olduğu yerlere varsa da. Bu nedenle kayıt dışı mahalleler kentin kenarlarına yayılır ve çoğu kez temiz sudan ya da güvenilir ulaşımdan yoksundur. Bu mahalleleri dikkatle inceleyen planlamacılar, kaynak sağlandığı sürece bu sorunların bir kısmını hafifletebilir. Aksi halde altyapı üzerindeki baskı tırmanacak ve belediyeler, büyümeyi şekillendirmek yerine sürekli olarak acil durumlarla uğraşmak zorunda kalacaktır.","q":[{"q":"Which of the following best summarises the passage?","o":["Rural areas are growing faster than cities because of better public services.","Informal neighbourhoods should be removed before planners study them.","Rapid urban growth driven by migration strains services, though careful planning with adequate funding can ease the problems.","Migrants usually find that housing in cities is plentiful and cheap.","Municipalities have already solved the shortage of water and transport."],"a":2,"e":"Metin, göçle hızlanan kentleşmenin konut ve hizmetleri zorladığını, yeterli kaynakla yapılan dikkatli planlamanın sorunları hafifletebileceğini anlatır."},{"q":"The word 'mitigate' in the passage is closest in meaning to","o":["completely eliminate","reduce the seriousness of","accurately predict","deliberately ignore","publicly announce"],"a":1,"e":"'Mitigate' zararı ya da etkiyi hafifletmek demektir. Metinde planlamacılar sorunların yalnızca 'bir kısmını' hafifletebilir; tamamen ortadan kaldırmak söz konusu değildir."}]},{"id":"drylands-under-strain","t":"Drylands Under Strain","f":"Coğrafya","x":"Arid and semi-arid regions are among the most {{vulnerable}} environments on Earth. Their soils are thin, rainfall is irregular, and vegetation, once removed, recovers slowly. Land degradation in these areas often {{results from|result from}} intensive grazing combined with repeated cultivation, which {{depletes|deplete}} the nutrients that plants need. Climate variability {{contributes to|contribute to}} the problem, but human choices remain decisive. Some communities have {{set up}} shared grazing rules {{in order to}} let pasture recover, and others have {{given up|give up}} crops that demand heavy irrigation. {{Nonetheless|nonetheless}}, such efforts achieve little unless they become {{widespread}}, because a single overgrazed valley can undo the gains of its neighbours.","tr":"Kurak ve yarı kurak bölgeler, yeryüzündeki en savunmasız ortamlar arasındadır. Toprakları ince, yağışları düzensizdir ve bitki örtüsü bir kez yok edilince yavaş toparlanır. Bu alanlardaki arazi bozulması çoğu zaman yoğun otlatmanın tekrarlanan tarımla birleşmesinden kaynaklanır; bu da bitkilerin ihtiyaç duyduğu besinleri tüketir. İklim değişkenliği soruna katkıda bulunur, ancak insan tercihleri belirleyici olmaya devam eder. Bazı topluluklar meraların toparlanmasına izin vermek için ortak otlatma kuralları koymuş, bazıları ise yoğun sulama gerektiren ürünlerden vazgeçmiştir. Yine de bu çabalar yaygınlaşmadıkça pek bir sonuç vermez, çünkü aşırı otlatılmış tek bir vadi komşularının kazanımlarını boşa çıkarabilir.","q":[{"q":"What does the passage suggest about protecting dry regions?","o":["Climate variability alone is responsible for land degradation.","Irrigation-based farming is the only sustainable form of agriculture.","Local residents should be removed from vulnerable valleys.","Pasture recovers quickly once vegetation has been cleared.","Local conservation measures are effective only when many communities adopt them."],"a":4,"e":"Metin 'such efforts achieve little unless they become widespread' der: tek tek toplulukların önlemleri, yaygınlaşmadıkça sonuç vermez."},{"q":"The phrase 'given up' in the passage is closest in meaning to","o":["tested","subsidised","expanded","abandoned","exported"],"a":3,"e":"'Give up' vazgeçmek demektir. Bazı topluluklar yoğun sulama gerektiren ürünlerden vazgeçmiştir; en yakın anlam 'abandoned'."}]},{"id":"maps-are-never-neutral","t":"Maps Are Never Neutral","f":"Coğrafya","x":"A map may look like an objective picture of the world, but every map is the product of choices. Cartographers must decide what to {{emphasise}} and what to leave out, and these decisions can {{conceal}} as much as they reveal. A map that ranks countries {{in terms of}} territory, for instance, encourages readers to {{perceive}} large states as more important, {{while}} a map scaled by population would suggest a very different picture. Choices of colour and boundary can also {{reinforce}} existing assumptions about who controls a region. {{Hence|hence}}, readers who treat maps as neutral risk mistaking a particular viewpoint for plain fact. Learning to {{bear in mind}} that every map is selective is the first step toward reading it well.","tr":"Bir harita dünyanın nesnel bir resmi gibi görünebilir, ancak her harita bir dizi tercihin ürünüdür. Haritacılar neyi vurgulayacaklarına ve neyi dışarıda bırakacaklarına karar vermek zorundadır; bu kararlar ortaya koydukları kadar şeyi gizleyebilir de. Örneğin ülkeleri yüzölçümü açısından sıralayan bir harita, okurları büyük devletleri daha önemli algılamaya iter; nüfusa göre ölçeklenmiş bir harita ise çok farklı bir tablo sunardı. Renk ve sınır tercihleri de bir bölgeyi kimin kontrol ettiğine dair mevcut varsayımları pekiştirebilir. Bu yüzden haritaları tarafsız sayan okurlar, belirli bir bakış açısını yalın gerçekle karıştırma riskiyle karşı karşıyadır. Her haritanın seçici olduğunu aklında tutmayı öğrenmek, onu iyi okumanın ilk adımıdır.","q":[{"q":"What is the main idea of the passage?","o":["Maps based on population are always more accurate than maps based on territory.","Maps are selective and can shape how readers see the world, so they should be read critically.","Cartographers deliberately deceive readers in order to protect political interests.","Colour and symbols are the only features that influence how readers understand a map.","A truly objective map becomes possible once enough detail is included."],"a":1,"e":"Metin, her haritanın seçimlerle oluştuğunu, bunun okurun algısını etkilediğini ve bu yüzden haritaların eleştirel okunması gerektiğini vurgular."},{"q":"The phrase 'in terms of' in the passage is closest in meaning to","o":["on the basis of","in spite of","instead of","as well as","apart from"],"a":0,"e":"'Ranks countries in terms of territory' ülkelerin yüzölçümü temelinde sıralanması demektir; 'in terms of' burada 'on the basis of' ile eş anlamlıdır."}]},{"id":"how-news-gets-framed","t":"How News Gets Framed","f":"İletişim","x":"{{Although|although}} audiences often assume that journalists simply report facts, every news story involves selection. Editors decide which events deserve space, which details to {{highlight}}, and which voices to include. This process, known as framing, can {{prompt}} readers to interpret identical events in quite different ways. A strike may be presented as a {{legitimate}} protest or as a threat to public order, {{depending on|depend on}} the vocabulary chosen. Such framing is not always adopted {{deliberately}}; tight deadlines and professional habits also narrow the range of perspectives. {{Nevertheless|nevertheless}}, readers are not helpless: by comparing several outlets, they can {{gauge}} how strongly a story has been shaped.","tr":"Okur ve izleyiciler çoğu zaman gazetecilerin yalnızca olguları aktardığını varsaysa da, her haber bir seçim içerir. Editörler hangi olayların yer hak ettiğine, hangi ayrıntıların öne çıkarılacağına ve hangi seslere yer verileceğine karar verir. Çerçeveleme olarak bilinen bu süreç, okurları aynı olayları oldukça farklı biçimlerde yorumlamaya sevk edebilir. Bir grev, seçilen sözcüklere bağlı olarak meşru bir protesto ya da kamu düzenine yönelik bir tehdit olarak sunulabilir. Böyle bir çerçeveleme her zaman kasıtlı olarak benimsenmez; sıkı teslim süreleri ve mesleki alışkanlıklar da bakış açılarının yelpazesini daraltır. Yine de okurlar çaresiz değildir: birkaç yayın organını karşılaştırarak bir haberin ne kadar şekillendirildiğini tahmin edebilirler.","q":[{"q":"What is the main point of the passage?","o":["Journalists usually invent facts to attract larger audiences.","Readers can never judge whether a news story is accurate.","Tight deadlines are the only cause of biased reporting.","The way a news story is selected and presented influences how audiences interpret events.","Strikes are reported more often than any other kind of event."],"a":3,"e":"Metin, haberlerde seçim ve çerçevelemenin okurun olayları yorumlama biçimini etkilediğini, okurun ise birkaç kaynağı karşılaştırarak bunu değerlendirebileceğini anlatır."},{"q":"The word 'legitimate' in the passage is closest in meaning to","o":["violent","temporary","secret","unplanned","justified"],"a":4,"e":"'Legitimate' meşru, haklı demektir. Grev, 'haklı/meşru bir protesto' ya da kamu düzenine tehdit olarak sunulabilir; en yakın anlam 'justified'."}]},{"id":"personalised-feeds-narrower-views","t":"Personalised Feeds, Narrower Views","f":"İletişim","x":"Digital platforms have made information more {{abundant}} than ever, but they have not necessarily made audiences better informed. Recommendation systems learn from past behaviour and {{subsequently}} offer more of the same, so users are mostly shown content that matches their existing beliefs. Over time, this pattern can {{foster}} so-called echo chambers, in which opposing views are rarely encountered. People who are {{prone}} to seek confirmation of their opinions become still more open to misleading claims that flatter those opinions. {{Consequently|consequently}}, public debate may grow more polarised, {{notwithstanding}} the vast range of sources available. {{Rather than|rather than}} blaming technology alone, however, researchers {{draw attention to}} the role of user habits.","tr":"Dijital platformlar bilgiyi her zamankinden daha bol hale getirdi, ancak izleyicileri mutlaka daha iyi bilgilendirmedi. Öneri sistemleri geçmiş davranıştan öğrenir ve ardından aynısından daha fazlasını sunar; böylece kullanıcılara çoğunlukla mevcut inançlarına uyan içerikler gösterilir. Zamanla bu örüntü, karşıt görüşlerle nadiren karşılaşılan, yankı odası denen yapıları besleyebilir. Görüşlerini doğrulatmaya yatkın kişiler, bu görüşleri pohpohlayan yanıltıcı iddialara karşı daha da açık hale gelir. Sonuç olarak, mevcut kaynakların çok geniş yelpazesine rağmen kamusal tartışma daha kutuplaşmış hale gelebilir. Ancak araştırmacılar yalnızca teknolojiyi suçlamak yerine kullanıcı alışkanlıklarının rolüne dikkat çeker.","q":[{"q":"According to the passage, why might users rarely meet opposing views?","o":["Recommendation systems mostly show content that resembles what users already believe.","Opposing views are not available on digital platforms.","Users deliberately delete the accounts of people who disagree with them.","Researchers prevent such content from being published.","Echo chambers are created by journalists, not by platforms."],"a":0,"e":"Metin, öneri sistemlerinin geçmiş davranışa bakarak mevcut inançlara uyan içeriği öne çıkardığını ve bunun yankı odalarını beslediğini söyler."},{"q":"The word 'notwithstanding' in the passage is closest in meaning to","o":["because of","in addition to","despite","thanks to","instead of"],"a":2,"e":"'Notwithstanding' -e rağmen demektir. Çok sayıda kaynak bulunmasına rağmen tartışma kutuplaşabilir; en yakın anlam 'despite'."}]},{"id":"meaning-beyond-words","t":"Meaning Beyond Words","f":"İletişim","x":"When people speak, the meaning of an {{utterance}} rarely lies in its words alone. Tone of voice, facial expression, and the shared history of the speakers {{account for}} much of what a listener actually understands. A remark such as 'That was an interesting talk' can be sincere praise or polite criticism, because the sentence is {{ambiguous}} until its context is known. {{Furthermore|furthermore}}, speakers from different cultural backgrounds follow different {{conventions|convention}} about how directly a message should be stated, so a request that seems perfectly clear to one person may sound rude or {{vague}} to another. {{As well as|as well as}} choosing words carefully, effective communicators {{take into consideration}} the setting and the listener's expectations.","tr":"İnsanlar konuşurken bir sözün anlamı nadiren yalnızca sözcüklerinde yatar. Ses tonu, yüz ifadesi ve konuşanların ortak geçmişi, dinleyicinin gerçekte anladığının büyük bölümünü oluşturur. 'Bu ilginç bir konuşmaydı' gibi bir söz, bağlamı bilinene kadar belirsiz olduğundan içten bir övgü de olabilir, kibar bir eleştiri de. Dahası, farklı kültürel geçmişlerden gelen konuşanlar bir iletinin ne kadar doğrudan ifade edilmesi gerektiği konusunda farklı gelenekleri izler; bu yüzden bir kişiye gayet açık görünen bir istek, bir başkasına kaba ya da muğlak gelebilir. Etkili iletişimciler sözcükleri dikkatle seçmenin yanı sıra ortamı ve dinleyicinin beklentilerini de göz önünde bulundurur.","q":[{"q":"What is the passage mainly about?","o":["Why polite criticism is more effective than direct criticism.","How facial expressions differ among cultures.","The fact that meaning in communication depends on context as well as on words.","The importance of building a large vocabulary.","Why listeners rarely understand what speakers say."],"a":2,"e":"Metin, bir iletinin anlamının yalnızca sözcüklere değil; ses tonu, ortak geçmiş, bağlam ve kültürel geleneklere de bağlı olduğunu anlatır."},{"q":"Why does the author mention the remark 'That was an interesting talk'?","o":["To show that listeners usually prefer polite criticism to praise.","To illustrate that the same words can carry different meanings depending on context.","To prove that speakers from different cultures use identical expressions.","To demonstrate that tone of voice is irrelevant to meaning.","To criticise speakers who give uninteresting talks."],"a":1,"e":"Örnek cümle, 'ambiguous until its context is known' ifadesiyle birlikte kullanılır: aynı söz bağlama göre içten övgü ya da kibar eleştiri olabilir."}]},{"id":"the-problem-of-certainty","t":"The Problem of Certainty","f":"Felsefe","x":"Philosophers have long asked whether any belief can be known with complete certainty. Sceptics {{maintain}} that even our most familiar convictions rest on {{assumptions|assumption}} that have never been properly tested, since the senses occasionally mislead us. Their critics respond that a doubt with no reason behind it is {{arbitrary}} and therefore carries little weight. The sceptical challenge, {{albeit}} unsettling, has {{proved|prove}} productive. It has forced thinkers to {{formulate}} clearer standards for justification and to {{probe}} the foundations of what they claim to know. {{Accordingly|accordingly}}, modern theories of knowledge usually aim not at absolute certainty but at beliefs that are {{coherent}}, well supported, and open to correction.","tr":"Filozoflar uzun zamandır herhangi bir inancın tam bir kesinlikle bilinip bilinemeyeceğini sormuştur. Şüpheciler, duyular zaman zaman bizi yanılttığı için, en tanıdık kanaatlerimizin bile hiç gereğince sınanmamış varsayımlara dayandığını savunur. Eleştirmenleri ise arkasında hiçbir gerekçe bulunmayan bir şüphenin keyfî olduğunu ve bu yüzden pek ağırlık taşımadığını söyler. Şüpheci meydan okuma, her ne kadar rahatsız edici olsa da, verimli olduğunu kanıtlamıştır. Düşünürleri gerekçelendirme için daha net ölçütler formüle etmeye ve bildiklerini iddia ettikleri şeylerin temellerini derinlemesine araştırmaya zorlamıştır. Buna uygun olarak, modern bilgi kuramları genellikle mutlak kesinliği değil, tutarlı, iyi desteklenmiş ve düzeltmeye açık inançları hedefler.","q":[{"q":"Which of the following best expresses the main idea of the passage?","o":["Scepticism has been completely refuted by modern philosophers.","The senses never mislead us, so certainty is easily attained.","Critics of scepticism believe that doubt should be applied to everything.","Knowledge is impossible, so philosophers should stop studying it.","Although sceptical doubt is unsettling, it has pushed philosophers to refine their standards of justification."],"a":4,"e":"Metin, şüpheci meydan okumanın rahatsız edici olsa da verimli olduğunu; filozofları daha net ölçütler geliştirmeye ve temelleri incelemeye ittiğini vurgular."},{"q":"The word 'albeit' in the passage is closest in meaning to","o":["although","because","unless","therefore","whenever"],"a":0,"e":"'Albeit' her ne kadar ... ise de demektir. 'The sceptical challenge, albeit unsettling' = rahatsız edici olsa da; en yakın anlam 'although'."}]},{"id":"morality-across-cultures","t":"Morality Across Cultures","f":"Felsefe","x":"Anthropologists have shown that moral {{norms|norm}} {{vary}} considerably between societies: a practice that is accepted in one place may be condemned in another. Some philosophers conclude from this diversity that no moral judgment can be objectively true. Others {{reject}} the inference, {{arguing|argue}} that disagreement does not prove the absence of a correct answer. {{On the other hand|on the other hand}}, those who {{uphold}} universal principles must show how such principles can be known {{in spite of}} the real diversity of customs. The debate is {{ultimately}} about whether cultural variety is a fact to be explained or a reason to abandon moral judgment altogether.","tr":"Antropologlar, ahlaki normların toplumlar arasında hatırı sayılır ölçüde değiştiğini göstermiştir: bir yerde kabul edilen bir uygulama başka bir yerde kınanabilir. Bazı filozoflar bu çeşitlilikten, hiçbir ahlaki yargının nesnel olarak doğru olamayacağı sonucunu çıkarır. Diğerleri ise anlaşmazlığın doğru bir cevabın yokluğunu kanıtlamadığını savunarak bu çıkarımı reddeder. Öte yandan evrensel ilkeleri savunanlar, bu ilkelerin gerçek gelenek çeşitliliğine rağmen nasıl bilinebileceğini göstermek zorundadır. Tartışma nihayetinde, kültürel çeşitliliğin açıklanması gereken bir olgu mu yoksa ahlaki yargıdan büsbütün vazgeçmek için bir gerekçe mi olduğuyla ilgilidir.","q":[{"q":"What is the main idea of the passage?","o":["Anthropologists have proved that universal moral principles exist.","Differences in moral norms across societies raise a debate over whether objective moral standards exist.","Societies that disagree about morality should avoid contact with one another.","Moral judgments should be based only on the customs of one's own society.","Philosophers have abandoned the study of morality altogether."],"a":1,"e":"Metin, toplumlar arası ahlaki norm farklılıklarının nesnel ahlaki ölçütlerin var olup olmadığı tartışmasını doğurduğunu ve her iki tarafın da yanıtlaması gereken sorular bulunduğunu anlatır."},{"q":"The word 'uphold' in the passage is closest in meaning to","o":["overthrow","ignore","postpone","defend","discover"],"a":3,"e":"'Uphold' bir ilkeyi korumak/savunmak demektir. Evrensel ilkeleri 'uphold' edenler, bu ilkelerin nasıl bilinebileceğini göstermek zorundadır; en yakın anlam 'defend'."}]},{"id":"free-will-and-responsibility","t":"Free Will and Responsibility","f":"Felsefe","x":"The doctrine of determinism holds that every event, including every human decision, follows necessarily from earlier causes. If this is true, people could never have acted otherwise, and the idea of moral {{responsibility}} seems to {{fall apart}}. Compatibilists {{assert}} that freedom does not require escaping causation; it requires only that an action {{springs from|spring from}} the agent's own reasoning rather than from outside pressure. Their opponents {{dismiss}} this view as a verbal trick that changes nothing. {{Despite|despite}} such disagreement, both camps accept that societies need some form of {{accountability}} {{so that}} harmful conduct does not go unanswered.","tr":"Determinizm öğretisi, her insan kararı dahil her olayın zorunlu olarak daha önceki nedenlerden kaynaklandığını ileri sürer. Bu doğruysa insanlar asla başka türlü davranamazdı ve ahlaki sorumluluk fikri çökmüş gibi görünür. Uyumcular, özgürlüğün nedensellikten kaçmayı gerektirmediğini, yalnızca bir eylemin dışarıdan gelen baskıdan değil, failin kendi muhakemesinden kaynaklanmasını gerektirdiğini ileri sürer. Karşıtları bu görüşü hiçbir şeyi değiştirmeyen bir söz oyunu diyerek geçersiz sayar. Bu anlaşmazlığa rağmen her iki taraf da, zararlı davranışların cevapsız kalmaması için toplumların bir tür hesap verebilirliğe ihtiyaç duyduğunu kabul eder.","q":[{"q":"What is the main point of the passage?","o":["Determinism has been conclusively proved to be false.","Societies should abandon all forms of punishment.","Determinism challenges the idea of moral responsibility, and philosophers disagree about how to answer that challenge.","Free will exists only in societies without laws.","Compatibilists believe that human actions have no causes."],"a":2,"e":"Metin, determinizmin ahlaki sorumluluğu tehdit ettiğini, uyumcular ile karşıtlarının bu soruna farklı yanıtlar verdiğini ve iki tarafın da hesap verebilirliği gerekli gördüğünü anlatır."},{"q":"Which of the following would a compatibilist, as described in the passage, most likely accept?","o":["Choices that have causes cannot be free in any sense.","Actions that result from outside pressure are the clearest examples of freedom.","Moral responsibility should be abolished because determinism is true.","Accountability is unnecessary in a society of determined beings.","A person may act freely even though the action has prior causes, provided it comes from the person's own reasoning."],"a":4,"e":"Metne göre uyumcular, özgürlüğün nedensellikten kaçmayı değil, eylemin dışarıdan baskıdan değil failin kendi muhakemesinden gelmesini gerektirdiğini savunur."}]}];

/* ---- Dosya indirme: kurulu uygulamada doğrudan, claude.ai sayfasında downloads yeteneğiyle ---- */
async function downloadFile(name, text, mime) {
  if (PWA) {
    var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: mime }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }
  try {
    var d = window.claude && await window.claude.use('downloads');
    if (d) { await d.save({ filename: name, data: text }); return true; }
  } catch (e) { if (e && e.code === 'declined') return true; }
  UI.dl = { name: name, text: text }; render();
  return false;
}

var SWREG = null;

function slotMs(t) { var d = new Date(), p = t.split(':'); d.setHours(+p[0], +p[1], 0, 0); return d.getTime(); }

  var o = { body: body, icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', tag: 'yk-remind', renotify: false, data: { url: './#hatirlat' }, actions: [{ action: 'go', title: 'Başla' }, { action: 'later', title: 'Sonra' }] };
  try {
    if (SWREG && SWREG.showNotification) return SWREG.showNotification(title, o).then(function () { return true; }, function () { return false; });

  } catch (e) { return Promise.resolve(false); }
}
function canNotify() { return PWA && 'Notification' in window && Notification.permission === 'granted'; }
// Uygulama açıkken ya da arka plandayken dilimi kontrol eder; ön plandaysa bildirim göstermez, dilimi görülmüş sayar
function checkRemind() {
  if (!PWA || !ST.rem.on) return;
  var t = now(), latest = 0;
  ST.rem.times.forEach(function (x) { var s = slotMs(x); if (s <= t && s > latest) latest = s; });
  if (!latest || (ST.rem.last || 0) >= latest) return;
  if (document.visibilityState === 'visible' || t - latest > 6 * 3600000) { ST.rem.last = latest; saveLocal(); mirrorRemind(); return; }
  if (!canNotify()) return;
  var ds = dueSummary(), n = ds.due + ds.star;
  ST.rem.last = latest; saveLocal(); mirrorRemind();
  if (n > 0) showNote('Kelime tekrarı zamanı', n + ' kelime seni bekliyor. Hızlı tekrar için dokun.');
}
setInterval(checkRemind, 60000);

function registerPeriodic() {
  if (!SWREG || !SWREG.periodicSync) return;

  navigator.permissions.query({ name: 'periodic-background-sync' }).then(function (p) {
    if (p.state === 'granted') SWREG.periodicSync.register('yk-remind', { minInterval: 3600000 }).catch(function () {});
  }).catch(function () {});
}
async function askPerm() {

  if (Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) {} }
  return Notification.permission;
}
ACT.rem = async function (v, el) {
  if (el.checked) {
    var p = await askPerm();
    if (p !== 'granted') { ST.rem.on = false; UI.msg = p === 'denied' ? 'Bildirim izni kapalı olduğu için hatırlatıcı açılamadı.' : 'Bildirim izni verilmedi.'; render(); return; }

};

  UI.msg = ok ? 'Deneme bildirimi gönderildi. Gelmediyse Android bildirim ayarlarını kontrol et.' : 'Bildirim gösterilemedi. Android ayarlarından bu uygulamanın bildirimlerine izin ver.'; render();

/* Bildirimden gelen yönlendirme: #hatirlat, #anki, #test */
function route(hash) {
  hash = (hash || location.hash || '').replace('#', '');
  if (!hash) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (hash === 'hatirlat') ACT.remind();
  else if (hash === 'anki') startAnki();
  else if (hash === 'test') startTest();
}
window.addEventListener('hashchange', function () { route(); });

  navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'go') route(e.data.hash); });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) { SWREG = reg; registerPeriodic(); mirrorRemind(); }).catch(function () {});
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

  if (!S || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'Escape') { ACT.exit(); return; }
  if (S.pol === 'x') {
    if (S.X.fin || S.X.ask) return;
    var xk = e.key.toLowerCase(), xi = 'abcde'.indexOf(xk);
    if (xk.length === 1 && xi < 0 && xk >= '1' && xk <= '5') xi = +xk - 1;
    if (xk.length === 1 && xi >= 0) ACT.xpick(xi);
    else if (e.key === 'ArrowRight') ACT.xnext();
    else if (e.key === 'ArrowLeft') ACT.xprev();
    return;
  }
  if (S.pol === 'm') {
    if (S.fin) return;
    var q = S.q, after = S.picked !== null;
    if (e.key >= '1' && e.key <= '4' && q.opts && !after) { ACT.pick(+e.key - 1); return; }
    if (e.key === 'b' && q.opts && !after) { ACT.dontknow(); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      if (tag === 'BUTTON') return;
      e.preventDefault();
      if (q.fmt === 'intro') ACT.intro();
      else if (q.fmt === 'flash') { if (!S.shown) ACT.flashshow(); else if (S.picked === null) ACT.rateflash(3); else ACT.next(); }
      else if (after) ACT.next();
    }
    return;
  }
  if (!S.cur) return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (tag === 'BUTTON') return;
    e.preventDefault();
    if (!S.shown) { S.shown = true; render(); } else rate(3);
  } else if (S.shown && e.key >= '1' && e.key <= '4') rate(+e.key);
  else if (e.key === 'z' || e.key === 'Z') undo();
});

render();
initDb();
route();
setTimeout(checkRemind, 2000);

/* ===== p8_extra.js — Yeni oturum türleri: çift testi, paragraf okuma, anımsatıcı notu ===== */
