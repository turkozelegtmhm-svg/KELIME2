Fabrikalar, atıkları güvenli biçimde bertaraf etmelidir."],["discard","atmak, terk etmek","Societies slowly *discard* outdated customs.","Toplumlar, modası geçmiş gelenekleri zamanla terk eder."],["remove","kaldırmak","Laws were passed to *remove* barriers to women’s employment.","Kadınların istihdamının önündeki engelleri kaldırmak için yasalar çıkarıldı."]]},{"d":"phrasal","p":"v","f":"","n":"carry on/go on/keep on: devam etmek. go on to do: sonra başka bir şey yapmaya geçmek.","m":[["carry on","sürdürmek, devam etmek","Families *carry on* traditions across generations.","Aileler, gelenekleri kuşaklar boyunca sürdürür."],["go on","devam etmek; olmak","The war *went on* for years.","Savaş, yıllarca sürdü."],["keep on","sürekli yapmak","Prices *keep on* rising.","Fiyatlar durmaksızın artıyor."],["continue","devam etmek","Inequality *continues* to grow.","Eşitsizlik, büyümeye devam ediyor."]]}];

const PAIRS = [["affect","effect","v","etkilemek","etki, sonuç","affect genelde fiil: etkilemek. effect genelde isim: etki, sonuç. İpucu: 'A'ction = Affect (eylem), 'E'nd result = Effect (sonuç). Not: effect fiil olarak 'meydana getirmek' demektir (effect change).","The new tax will *affect* thousands of small businesses.","Yeni vergi binlerce küçük işletmeyi etkileyecek.","The reform had a lasting *effect* on rural education.","Reformun kırsal eğitim üzerinde kalıcı bir etkisi oldu."],["economic","economical","adj","ekonomik, iktisadi","tutumlu, tasarruflu","economic: ekonomiyle ilgili (economic growth, economic policy). economical: az harcayan, tutumlu, idareli (economical car). Biri konuyu, diğeri tasarrufu anlatır.","Rapid *economic* growth often widens the gap between urban and rural regions.","Hızlı ekonomik büyüme, kentsel ve kırsal bölgeler arasındaki uçurumu çoğu zaman genişletir.","The family led a very *economical* life and saved most of their income.","Aile çok tutumlu bir hayat sürdü ve gelirinin çoğunu biriktirdi."],["historic","historical","adj","tarihi önemi olan","tarihle ilgili","historic: tarihe geçecek kadar önemli (historic victory). historical: geçmişte gerçekten olmuş ya da tarih bilimiyle ilgili (historical records, historical novel). Önem = historic, geçmiş = historical.","The signing of the peace treaty was a *historic* moment for both nations.","Barış anlaşmasının imzalanması her iki ülke için tarihi bir andı.","Researchers examined *historical* records to trace changes in land ownership.","Araştırmacılar, toprak mülkiyetindeki değişimleri izlemek için tarihsel kayıtları inceledi."],["sensitive","sensible","adj","duyarlı, hassas","makul, akılcı","sensitive: duygusal ya da fiziksel olarak kolay etkilenen, duyarlı (sensitive to criticism). sensible: mantıklı, sağduyulu (sensible decision). Tuzak: sensible 'duygusal' değildir, 'akıllıca' demektir.","Teachers should be *sensitive* to the cultural backgrounds of their students.","Öğretmenler, öğrencilerinin kültürel geçmişlerine duyarlı olmalıdır.","It would be *sensible* to wait for more data before changing the policy.","Politikayı değiştirmeden önce daha fazla veri beklemek akıllıca olur."],["continual","continuous","adj","sık sık tekrarlanan","kesintisiz, sürekli","continual: tekrar tekrar olan, arada duraklamalı (continual interruptions). continuous: hiç kesilmeden devam eden (continuous line, continuous flow). Sonu -al: aralıklı; -ous: aralıksız.","Years of *continual* border disputes, with brief periods of calm in between, strained relations between the two states.","Arada kısa sakin dönemler olsa da yıllarca süren tekrarlayan sınır anlaşmazlıkları iki devlet arasındaki ilişkileri gerdi.","Sleep studies require *continuous* monitoring of brain activity, with no breaks at all.","Uyku çalışmaları, hiç ara verilmeden beyin aktivitesinin kesintisiz izlenmesini gerektirir."],["principal","principle","n","asıl, başlıca; müdür","ilke, prensip","principal: sıfat olarak asıl, başlıca (principal reason); isim olarak okul müdürü ya da anapara. principle: yalnızca isim; ilke, kural. İpucu: principle ve rule, ikisi de -le ile biter.","The *principal* reason for the policy's failure was a lack of public support.","Politikanın başarısızlığının asıl nedeni kamu desteğinin eksikliğiydi.","Equal treatment before the law is a basic democratic *principle*.","Yasa önünde eşit muamele, temel bir demokratik ilkedir."],["elicit","illicit","v","ortaya çıkarmak, almak","yasadışı, izinsiz","elicit (fiil): bir cevap, tepki ya da bilgiyi ortaya çıkarmak. illicit (sıfat): yasadışı, izin verilmeyen. illicit içindeki 'licit' yasal demektir; il- olumsuzluk ekidir (illegal gibi).","Open-ended questions are more likely to *elicit* detailed answers from participants.","Açık uçlu sorular, katılımcılardan ayrıntılı yanıtlar almaya daha elverişlidir.","The government launched a campaign against *illicit* trade in endangered animals.","Hükümet, nesli tükenmekte olan hayvanların yasadışı ticaretine karşı bir kampanya başlattı."],["complement","compliment","n","tamamlamak; tamamlayıcı","iltifat; övmek","complement: bir şeyi bütünlemek, tamamlamak (complete ile aynı kök). compliment: övgü, güzel söz. İpucu: compl'e'ment = compl'e'te; compl'i'ment = 'I' like praise.","Vocational training can *complement* academic education by teaching practical skills.","Mesleki eğitim, pratik beceriler öğreterek akademik eğitimi tamamlayabilir.","The teacher took time to *compliment* the students on their thoughtful presentations.","Öğretmen, öğrencileri özenli sunumları nedeniyle takdir etmek için zaman ayırdı."],["adverse","averse","adj","olumsuz, zararlı","karşı, isteksiz","adverse: şeyler için; olumsuz, zarar verici (adverse effects, adverse conditions). averse: kişiler için; bir şeyden hoşlanmayan, kaçınan (averse to risk). adverse şeyin kötülüğü, averse kişinin isteksizliği.","Prolonged unemployment can have *adverse* effects on mental health.","Uzun süreli işsizlik ruh sağlığı üzerinde olumsuz etkiler yaratabilir.","Many investors are *averse* to taking risks during an economic downturn.","Birçok yatırımcı, ekonomik durgunluk döneminde risk almaya isteksizdir."],["imply","infer","v","ima etmek","çıkarım yapmak","imply: konuşan ya da yazan, söylemeden sezdirir (ima eder). infer: dinleyen ya da okuyan, eldeki ipuçlarından sonuç çıkarır. Konuşan imply eder, dinleyen infer eder.","Her silence during the debate may *imply* that she disagrees with the proposal.","Tartışma sırasındaki sessizliği, öneriye katılmadığını ima ediyor olabilir.","From the survey results, we can *infer* that most students prefer online lectures.","Anket sonuçlarından, öğrencilerin çoğunun çevrimiçi dersleri tercih ettiği sonucunu çıkarabiliriz."],["emigrate","immigrate","v","ülkesinden göç etmek","ülkeye göç etmek","emigrate: kendi ülkesinden ayrılıp başka yere gitmek (e- = exit, çıkış). immigrate: başka bir ülkeye yerleşmek için gelmek (i/im- = in, giriş). İsimleri: emigrant ve immigrant.","Political unrest forced many families to *emigrate* and leave their homeland behind.","Siyasi huzursuzluk, birçok ailenin vatanlarını geride bırakıp göç etmesine yol açtı.","Thousands of people *immigrate* into the country each year, hoping to find stable jobs.","Her yıl binlerce insan, istikrarlı bir iş bulma umuduyla ülkeye göç ediyor."],["eminent","imminent","adj","seçkin, saygın","eli kulağında, yakın","eminent: (kişi için) alanında seçkin, saygın (eminent scholar). imminent: (genelde kötü bir olay) hemen olmak üzere (imminent danger, imminent collapse). Kişi = eminent, zaman = imminent.","An *eminent* sociologist delivered the opening lecture at the conference.","Seçkin bir sosyolog, konferansın açılış konuşmasını yaptı.","Analysts warn that a financial collapse is *imminent* unless urgent action is taken.","Analistler, acil önlem alınmazsa bir mali çöküşün eli kulağında olduğu uyarısında bulunuyor."],["precede","proceed","v","önce gelmek","ilerlemek, devam etmek","precede: bir şeyden önce gelmek (pre- = önce). proceed: (to/with ile) ilerlemek, sürdürmek (pro- = ileri). İsimleri: precedence (öncelik), procedure ve process (süreç).","Economic stability must *precede* any attempt at deep structural reform.","Ekonomik istikrar, her türlü köklü yapısal reform girişiminden önce gelmelidir.","After the hearing, the court will *proceed* to examine the remaining evidence.","Duruşmanın ardından mahkeme, kalan delilleri incelemeye geçecek."],["discreet","discrete","adj","ketum, sağduyulu","ayrık, bağımsız","discreet: sır saklayan, dikkatli, ağzı sıkı. discrete: birbirinden ayrı, ayrık (discrete categories, discrete data). discrete'te iki 'e' bir 't' ile ayrılmıştır; discreet'te yan yana durup sır saklar.","The diplomat was *discreet* and never revealed details of the private negotiations.","Diplomat ketum davrandı ve özel müzakerelerin ayrıntılarını asla açıklamadı.","The survey divided the population into three *discrete* groups based on income.","Anket, nüfusu gelire göre birbirinden ayrı üç gruba böldü."],["disinterested","uninterested","adj","tarafsız, çıkarsız","ilgisiz, sıkılmış","disinterested: çıkarı olmadığı için tarafsız (disinterested judge). uninterested: umursamayan, ilgi duymayan. İyi bir hakem disinterested olur; derse ilgisiz öğrenci uninterested olur.","A *disinterested* observer, with no stake in the outcome, can assess the dispute more fairly.","Sonuçta hiçbir çıkarı olmayan tarafsız bir gözlemci, anlaşmazlığı daha adil değerlendirebilir.","Many students seem *uninterested* in politics and rarely follow the news.","Birçok öğrenci siyasete ilgisiz görünüyor ve haberleri nadiren takip ediyor."],["council","counsel","n","konsey, meclis","öğüt; avukat","council: karar veren heyet, meclis (city council, Security Council). counsel: tavsiye, danışmanlık; hukukta avukat (legal counsel); fiil olarak da danışmanlık yapmak. Council = grup, counsel = tavsiye.","The city *council* voted to increase funding for public libraries.","Belediye meclisi, halk kütüphaneleri için ayrılan fonun artırılması yönünde oy kullandı.","The defendant was represented by legal *counsel* throughout the trial.","Sanık, yargılama boyunca avukat tarafından temsil edildi."],["loose","lose","v","gevşek, serbest","kaybetmek","loose [lus]: sıfat; gevşek, sıkı olmayan, serbest. lose [luz]: fiil; kaybetmek. İpucu: lose'da bir 'o' kaybolmuş; kaybetmek (lose) kelimesi bir harf kaybetmiştir.","Strict rules were replaced by a *loose* framework that gave schools more freedom.","Katı kuralların yerini okullara daha fazla özgürlük tanıyan esnek bir çerçeve aldı.","Without reliable data, researchers may *lose* sight of the real causes of poverty.","Güvenilir veri olmadan araştırmacılar yoksulluğun gerçek nedenlerini gözden kaçırabilir."],["alternate","alternative","adj","dönüşümlü, bir atlayarak","seçenek, alternatif","alternate: sırayla, bir atlayarak gelen (alternate days = gün aşırı). alternative: seçilebilecek başka bir yol, seçenek (alternative energy). Alternate sıra düzenidir, alternative tercih imkanıdır.","The committee meets on *alternate* Fridays, that is, every other week.","Komite bir cuma atlayarak, yani iki haftada bir toplanır.","Critics argued that the government had not offered any realistic *alternative* to austerity.","Eleştirmenler, hükümetin kemer sıkma politikasına gerçekçi hiçbir alternatif sunmadığını savundu."],["credible","credulous","adj","inandırıcı, güvenilir","saf, çabuk inanan","credible: inanılmaya değer, güvenilir (credible evidence, credible source). credulous: her şeye kolayca inanan, saf (kişi için). Credible = inanılan şey; credulous = kolay inanan kişi.","Journalists need a *credible* source before they publish a controversial claim.","Gazeteciler tartışmalı bir iddiayı yayımlamadan önce güvenilir bir kaynağa ihtiyaç duyar.","Readers who are *credulous* tend to accept online rumors without checking the facts.","Kolay inanan okurlar, çevrimiçi söylentileri gerçekleri kontrol etmeden kabul etme eğilimindedir."],["industrial","industrious","adj","sanayiyle ilgili","çalışkan, gayretli","industrial: sanayiye ait (industrial zone, industrial production). industrious: çok çalışan, gayretli (kişi için). industry hem 'sanayi' hem 'çalışkanlık' demektir; sıfatları bu iki anlamı ayırır.","Heavy *industrial* production led to rapid urbanization in many countries.","Ağır sanayi üretimi birçok ülkede hızlı kentleşmeye yol açtı.","She was an *industrious* student who spent long hours in the library every day.","O, her gün kütüphanede uzun saatler geçiren çalışkan bir öğrenciydi."],["literal","literary","adj","kelimesi kelimesine","edebi, edebiyatla ilgili","literal: harfi harfine, mecaz olmayan (literal translation, literal meaning). literary: edebiyatla ilgili (literary criticism, literary prize). İpucu: literal = letter (harf), literary = literature.","Readers should not take the metaphor in its *literal* sense, because it is meant figuratively.","Okurlar metaforu gerçek anlamıyla almamalıdır, çünkü mecazi olarak kullanılmıştır.","The novelist won several *literary* prizes for her work on migration and identity.","Romancı, göç ve kimlik üzerine çalışmalarıyla birkaç edebi ödül kazandı."],["respectful","respective","adj","saygılı","kendi, ilgili (ayrı ayrı)","respectful: saygı gösteren (respect + ful). respective: birkaç kişi ya da şeyin her birine ait olan; hep çoğul isimle ve their ile gelir (their respective roles = her birinin kendi rolü).","Students should be *respectful* toward teachers and classmates at all times.","Öğrenciler her zaman öğretmenlerine ve sınıf arkadaşlarına karşı saygılı olmalıdır.","The two leaders returned to their *respective* capitals after the summit.","İki lider, zirvenin ardından kendi başkentlerine döndü."],["human","humane","adj","insani, insana ait","insancıl, merhametli","human: insana ait, insan türüyle ilgili (human rights, human behavior). humane: şefkatli, acı vermeyen (humane treatment). humane sondaki 'e' ile 'merhamet' katar; derecelendirilebilir (more humane).","Researchers study how *human* societies adapted to climate change in the past.","Araştırmacılar insan toplumlarının geçmişte iklim değişikliğine nasıl uyum sağladığını inceliyor.","Reformers called for more *humane* conditions in overcrowded prisons.","Reformcular, aşırı kalabalık hapishanelerde daha insancıl koşullar talep etti."],["access","excess","n","erişim, giriş","fazlalık, aşırılık","access: erişim, ulaşma hakkı (access to education, access to justice). excess: fazlalık, aşırılık (excess supply, in excess of). İpucu: excess = ex- 'dışına taşan' miktar.","Many rural families still lack *access* to clean water and basic health services.","Birçok kırsal aile hâlâ temiz suya ve temel sağlık hizmetlerine erişimden yoksundur.","An *excess* of regulation can discourage small firms from entering the market.","Aşırı düzenleme, küçük firmaları pazara girmekten caydırabilir."],["ensure","assure","v","sağlamak, garanti altına almak","güvence vermek","ensure: bir şeyin gerçekleşmesini garantiye almak (ensure that...). assure: bir kişiyi temin etmek, ona güvence vermek (assure someone that...). Assure + kişi; ensure + durum. insure: sigortalamak.","New regulations aim to *ensure* that all citizens have equal access to justice.","Yeni düzenlemeler, tüm vatandaşların adalete eşit erişimini sağlamayı amaçlıyor.","The minister tried to *assure* voters that the economy would recover soon.","Bakan, seçmenlere ekonominin yakında toparlanacağı konusunda güvence vermeye çalıştı."],["prescribe","proscribe","v","öngörmek, reçete etmek","yasaklamak","prescribe: kural, ceza ya da ilaç belirlemek, öngörmek (pre- = önceden yazmak). proscribe: yasaklamak, yasadışı ilan etmek (pro- ... listeye karşı yazmak). Yazılışları neredeyse aynı, anlamları zıt.","The law will *prescribe* the penalties for each type of offence.","Kanun, her suç türü için uygulanacak cezaları belirleyecek.","The regime moved to *proscribe* all opposition parties and independent newspapers.","Rejim, tüm muhalefet partilerini ve bağımsız gazeteleri yasaklamaya yöneldi."],["persecute","prosecute","v","zulmetmek, baskı yapmak","dava açmak, kovuşturmak","persecute: kişilere inancı ya da kimliği yüzünden eziyet etmek, zulmetmek. prosecute: bir kişiyi suçlu bularak mahkemede yargılatmak. İpucu: PERson'a eziyet; PROsecute = PROcess, yargı süreci.","The regime continued to *persecute* religious minorities through harassment and forced exile.","Rejim, taciz ve zorla sürgün yoluyla dini azınlıklara zulmetmeyi sürdürdü.","The state attorney decided to *prosecute* the company for polluting the river.","Savcı, nehri kirlettiği için şirket hakkında dava açmaya karar verdi."],["judicial","judicious","adj","yargısal, mahkemeyle ilgili","sağgörülü, akıllıca","judicial: yargı sistemi ya da mahkemelerle ilgili (judicial review, judicial independence). judicious: iyi muhakemeli, sağduyulu (judicious use of funds). Her ikisi de judge kökünden gelir.","An independent *judicial* system is essential for protecting citizens' rights.","Bağımsız bir yargı sistemi, vatandaşların haklarının korunması için şarttır.","The committee made *judicious* use of limited funds to expand rural schools.","Komite, kırsal okulları genişletmek için sınırlı fonları akıllıca kullandı."],["allusion","illusion","n","ima, dolaylı gönderme","yanılsama, aldanma","allusion: (kitap, olay vb.ne) dolaylı gönderme, ima; allude to fiilinden gelir. illusion: gerçek olmayan algı, yanılsama. allusion + to; illusion + of/that. Karıştırma: delusion = sanrı.","The speech contained a subtle *allusion* to the country's colonial past.","Konuşma, ülkenin sömürge geçmişine ince bir gönderme içeriyordu.","Many people live under the *illusion* that economic growth benefits everyone equally.","Birçok insan, ekonomik büyümenin herkese eşit yarar sağladığı yanılsaması içinde yaşıyor."],["conscious","conscientious","adj","bilinçli, farkında","vicdanlı, titiz","conscious: bilincinde, farkında olan (conscious of...). conscientious: vicdanlı, işini titizlikle ve dürüstçe yapan (conscientious objector = vicdani retçi). conscience (vicdan) kökünden gelir.","Participants were not *conscious* of being observed during the experiment.","Katılımcılar deney sırasında gözlemlendiklerinin farkında değildi.","A *conscientious* researcher checks every source and reports the limitations of the study honestly.","Vicdanlı ve titiz bir araştırmacı her kaynağı kontrol eder ve çalışmanın sınırlılıklarını dürüstçe bildirir."],["moral","morale","n","ahlaki; ahlak dersi","moral, ruh hali","moral: ahlaki, doğru-yanlışla ilgili (sıfat); isim olarak hikayeden çıkan ders. morale: bir grubun ruh hali, motivasyonu (staff morale). Türkçedeki 'moral' = morale; 'ahlak' = moral.","The novel ends with a *moral* about the dangers of unchecked ambition.","Roman, kontrolsüz hırsın tehlikelerine dair bir ahlak dersiyle sona erer.","Low pay and heavy workloads have damaged teacher *morale* in many schools.","Düşük maaşlar ve ağır iş yükü, birçok okulda öğretmenlerin moralini bozdu."],["flaunt","flout","v","gösteriş yapmak, sergilemek","hiçe saymak, çiğnemek","flaunt: zenginlik, güzellik gibi şeyleri caka satarak sergilemek. flout: kural, yasa ya da geleneği açıkça hiçe saymak. Flout + law/rules; flaunt + wealth/success.","Wealthy elites sometimes *flaunt* their riches in front of ordinary citizens.","Zengin elitler bazen servetlerini sıradan vatandaşların önünde sergiler.","Companies that *flout* environmental regulations may face heavy fines.","Çevre düzenlemelerini hiçe sayan şirketler ağır para cezalarıyla karşılaşabilir."],["statute","statue","n","yasa, kanun","heykel","statute: yasama organının çıkardığı yazılı yasa (statute law). statue: heykel. Üçüncü benzer kelime stature: boy, saygınlık. İpucu: statue = 'u' you, karşında duran figür.","Parliament passed a new *statute* that protects workers from unfair dismissal.","Parlamento, işçileri haksız işten çıkarılmaya karşı koruyan yeni bir yasa kabul etti.","Protesters pulled down the *statue* of the former dictator in the main square.","Protestocular ana meydandaki eski diktatörün heykelini yıktı."],["precedent","precedence","n","emsal, örnek karar","öncelik, üstünlük","precedent: daha önce olmuş, sonrakilere örnek olan karar ya da durum (set a precedent). precedence: öncelik hakkı (take precedence over). Precedent = geçmişteki örnek; precedence = sıralamada öne geçme.","The court's ruling set a *precedent* that later judges were expected to follow.","Mahkemenin kararı, sonraki yargıçların izlemesi beklenen bir emsal oluşturdu.","In emergencies, saving lives takes *precedence* over protecting property.","Acil durumlarda can kurtarmak, mülkü korumaktan önceliklidir."],["ambiguous","ambivalent","adj","belirsiz, çift anlamlı","kararsız, çelişik duygulu","ambiguous: (söz, metin) birden fazla anlama gelebilen, belirsiz. ambivalent: (kişi) aynı konuya karşı hem olumlu hem olumsuz duygular taşıyan. Ambiguous = metin belirsiz; ambivalent = duygu çelişkili.","The wording of the clause is *ambiguous* and can be read in two different ways.","Maddenin ifadesi belirsizdir ve iki farklı şekilde okunabilir.","Many voters remain *ambivalent* about the proposal, feeling both hope and doubt.","Birçok seçmen, hem umut hem şüphe duyarak öneri konusunda kararsız kalıyor."],["perspective","prospective","n","bakış açısı","olası, aday, müstakbel","perspective (isim): bakış açısı, perspektif (from a different perspective). prospective (sıfat): ileride olması beklenen, aday (prospective buyer, prospective students). prospect = beklenti.","Feminist theory offers a new *perspective* on the relationship between work and family.","Feminist kuram, iş ile aile arasındaki ilişkiye yeni bir bakış açısı sunar.","The university sent information packs to all *prospective* students and their parents.","Üniversite, tüm aday öğrencilere ve ailelerine bilgilendirme paketleri gönderdi."],["mitigate","militate","v","hafifletmek, azaltmak","engel olmak, aleyhine işlemek","mitigate: zararı, acıyı ya da riski hafifletmek (mitigate the effects). militate (against): bir şeyin olmasına engel olmak, aleyhte işlemek. 'mitigate against' hatalı kullanımdır; doğrusu 'militate against'.","Governments introduced new programs to *mitigate* the effects of rising unemployment.","Hükümetler, artan işsizliğin etkilerini hafifletmek için yeni programlar başlattı.","Poor housing and low incomes tend to *militate* against children's success at school.","Kötü konut koşulları ve düşük gelir, çocukların okul başarısına engel olma eğilimindedir."],["childish","childlike","adj","çocukça (olumsuz)","çocuksu, masum (olumlu)","childish: yetişkine yakışmayan, olgunlaşmamış, çocukça (eleştiri). childlike: çocuğa özgü masumiyet, merak ya da saflık taşıyan (iltifat). -ish eleştirir, -like över.","His *childish* refusal to compromise stalled the negotiations for weeks.","Uzlaşmayı çocukça reddetmesi müzakereleri haftalarca durdurdu.","The artist's work is admired for its *childlike* wonder and simple honesty.","Sanatçının eseri, çocuksu merakı ve sade dürüstlüğüyle takdir ediliyor."],["effective","efficient","adj","etkili, sonuç veren","verimli, tasarruflu","effective: istenen sonucu veren, etkili (doğru işi yapmak). efficient: zaman, para ve emeği az harcayarak çalışan, verimli (işi israfsız yapmak). Biri sonuca, diğeri kaynak kullanımına bakar.","The new law was *effective* in cutting crime, even though it wasted a great deal of money.","Yeni yasa, çok fazla para israf etmesine rağmen suçu azaltmada etkili oldu.","An *efficient* tax system collects revenue at minimal cost and with little waste.","Verimli bir vergi sistemi, geliri asgari maliyetle ve az israfla toplar."],["incidence","incident","n","görülme sıklığı, oran","olay, vaka","incidence: bir durumun ya da hastalığın bir grupta ne sıklıkta görüldüğü (istatistiki oran). incident: tek bir olay, vaka. Incidence = oran; incident = tek tek olay.","The *incidence* of depression is higher among people who live alone.","Depresyon görülme sıklığı, yalnız yaşayan insanlar arasında daha yüksektir.","Police are investigating a violent *incident* that occurred outside the stadium last night.","Polis, dün gece stadyumun dışında yaşanan şiddet olayını soruşturuyor."],["despite","although","conj","-e rağmen (isim/-ing önünde)","-e rağmen (tam cümle önünde)","Despite + isim/-ing (despite the rain); although + özne + fiil (although it rained). 'Despite of' yanlıştır; despite zaten 'in spite of' demektir. Despite the fact that = although.","*Despite* the heavy rain, the final match continued as planned.","Şiddetli yağmura rağmen final maçı planlandığı gibi devam etti.","*Although* it rained heavily, the final match continued as planned.","Şiddetli yağmur yağmasına rağmen final maçı planlandığı gibi devam etti."],["however","whereas","conj","ancak, bununla birlikte (cümleler arası)","oysa, -ken (cümle içi karşıtlık)","However önceki cümleden sonra yeni bir cümle başlatır ('...sound. However, ...'). Whereas iki karşıt öğeyi aynı cümlede bağlar. Virgülle However ile iki cümleyi birleştirmek (comma splice) hatalıdır.","The proposal seemed economically sound. *However*, several experts questioned its long-term social consequences.","Teklif ekonomik açıdan sağlam görünüyordu. Ancak birçok uzman bunun uzun vadeli toplumsal sonuçlarını sorguladı.","Urban residents tend to favour public transport, *whereas* rural residents depend largely on private cars.","Kent sakinleri toplu taşımayı tercih etme eğilimindeyken kırsal kesimdekiler büyük ölçüde özel araçlara bağımlıdır."],["unless","provided that","conj","-medikçe (olumsuz koşul)","-mek koşuluyla (olumlu koşul)","Unless = if ... not: 'unless it receives' = 'if it does not receive'; yanında ayrıca olumsuz yapı kullanma. Provided that = only if, yani şart koşar ve olumlu anlam taşır.","The reform will fail *unless* it receives broad public support.","Reform, geniş halk desteği almadıkça başarısız olacaktır.","Students may use the archive *provided that* they cite every source properly.","Öğrenciler, her kaynağı doğru biçimde gösterdikleri takdirde arşivi kullanabilir."],["in case","if","conj","-e karşı, olur da diye (önlem)","eğer (koşul)","In case + olası bir durum için ÖNCEDEN alınan önlemdir: take an umbrella in case it rains (şimdiden al). If + koşul gerçekleşirse olacak şeyi anlatır: if it rains (yağarsa).","The committee prepared a second draft *in case* the first one was rejected.","Komite, ilk taslak reddedilir diye ikinci bir taslak hazırladı.","The treaty will be cancelled *if* either party breaks its terms.","Taraflardan biri hükümleri ihlal ederse antlaşma iptal edilecektir."],["as long as","so that","conj","-mek koşuluyla, -diği sürece","-sin diye (amaç)","As long as = koşul (if ... only), 'olduğu sürece'. So that = amaç ('-sin diye'), genelde can/could/will/would ile gelir: so that anyone could examine it.","The policy will remain effective *as long as* the economy keeps growing.","Politika, ekonomi büyümeye devam ettiği sürece etkili kalacaktır.","The government published the data online *so that* anyone could examine it freely.","Hükümet, herkes inceleyebilsin diye verileri çevrimiçi yayımladı."],["since","for","prep","-den beri (başlangıç noktası)","-dir, boyunca (süre)","Since + başlangıç anı (since 1990, since Monday); for + sürenin uzunluğu (for ten years, for a week). İkisi de çoğunlukla present perfect ile kullanılır.","The country has experienced rapid urbanisation *since* the early 1990s.","Ülke 1990'ların başından beri hızlı bir kentleşme yaşıyor.","The country has experienced rapid urbanisation *for* more than three decades.","Ülke otuz yıldan uzun süredir hızlı bir kentleşme yaşıyor."],["besides","except","prep","-in yanı sıra, ayrıca (ekleme)","-in dışında, hariç (çıkarma)","Besides = ek olarak, üstüne (besides this, also gibi). Except = dışta bırakarak, hariç. Ekleme mi çıkarma mı diye sor: 'her gün, pazartesi hariç' = except Monday.","*Besides* economic factors, cultural traditions also shape consumer behaviour in many societies.","Ekonomik etkenlerin yanı sıra kültürel gelenekler de birçok toplumda tüketici davranışını şekillendirir.","The museum is open every day *except* Monday.","Müze pazartesi hariç her gün açıktır."],["hardly","hard","adv","zar zor, neredeyse hiç","çok, sıkı (çalışmak)","Hard = sıfat ve zarf: work hard = çok çalışmak. Hardly = olumsuz anlamlı (neredeyse hiç): hardly ever, can hardly see. 'Hard'ın zarfı 'hardly' değildir; anlamları neredeyse zıttır.","Researchers could *hardly* explain why the results differed so sharply between the two groups.","Araştırmacılar, sonuçların iki grup arasında neden bu kadar keskin biçimde farklılaştığını güçlükle açıklayabildi.","Students who work *hard* during the semester usually perform better in the final examination.","Dönem boyunca çok çalışan öğrenciler genellikle final sınavında daha başarılı olur."],["lately","late","adv","son zamanlarda, geçenlerde","geç (saat/zaman olarak)","Lately = recently, genelde present perfect ile kullanılır. Late = geç (arrive late, late in the day). 'Late'in zarf hali yine late'tir; lately 'geç' anlamına gelmez.","Social media use among teenagers has increased noticeably *lately*.","Gençler arasında sosyal medya kullanımı son zamanlarda belirgin biçimde arttı.","Many participants arrived *late* because the train services were disrupted.","Tren seferleri aksadığı için birçok katılımcı geç geldi."],["scarce","rare","adj","kıt, yetersiz (arz talebi karşılamaz)","nadir, ender (az rastlanır)","Scarce = bir şeyin miktarı ihtiyaca yetmez (scarce resources, water). Rare = az görülür, ender rastlanır (a rare disease). 'It is rare for...' kalıbı vardır, 'scarce for' yoktur.","Food and fuel became *scarce* during the long siege, and prices rose sharply.","Uzun kuşatma sırasında yiyecek ve yakıt kıtlaştı ve fiyatlar keskin biçimde yükseldi.","It is *rare* for a small party to win an outright majority in a general election.","Küçük bir partinin genel seçimde kesin çoğunluğu kazanması nadirdir."],["injure","wound","v","yaralamak (kaza, çarpma)","yaralamak (silah/bıçak; duygusal)","Injure = kaza, düşme, çarpma gibi nedenlerle bedensel zarar vermek. Wound = silah ya da bıçakla yaralamak; mecazen duygulara dokunmak (wound someone's feelings).","Unsafe playground equipment can *injure* children who fall from a height.","Güvensiz oyun alanı ekipmanları, yüksekten düşen çocukları yaralayabilir.","Careless remarks in public can deeply *wound* the feelings of minority groups.","Kamuya açık yerlerdeki özensiz sözler, azınlık gruplarının duygularını derinden yaralayabilir."],["steal","rob","v","çalmak (nesne alır: eşya)","soymak (nesne alır: kişi/yer)","Steal + çalınan şey (steal money, data); rob + soyulan kişi/yer (rob a bank, rob a tourist). 'Rob sb of sth' kalıbı vardır. Hırsız = thief, soyguncu = robber.","Hackers attempted to *steal* personal data from thousands of online accounts.","Bilgisayar korsanları binlerce çevrimiçi hesaptan kişisel verileri çalmaya çalıştı.","Two armed men tried to *rob* the bank shortly before closing time.","İki silahlı kişi kapanış saatinden kısa süre önce bankayı soymaya çalıştı."],["convince","persuade","v","inandırmak (bir şeyin doğruluğuna)","ikna edip yaptırmak (eyleme)","Convince = birinin bir şeyin doğru olduğuna inanmasını sağlar (convince sb that/of). Persuade = birini bir şey yapmaya razı eder (persuade sb to do). Convince + to-inf standart sayılmaz.","Evidence alone is rarely enough to *convince* sceptics that long-held beliefs are mistaken.","Kanıtlar tek başına, şüphecileri uzun süredir benimsenen inançların yanlış olduğuna inandırmaya nadiren yeter.","Activists managed to *persuade* the council to reduce the speed limit near schools.","Aktivistler, belediye meclisini okulların yakınındaki hız sınırını düşürmeye ikna etmeyi başardı."],["remind","remember","v","hatırlatmak (başkasına)","hatırlamak (kendi belleğinde)","Remind sb (of/to/that) = başkasının aklına getirmek; her zaman bir kişi nesnesi ister. Remember = kendi belleğinde canlandırmak veya unutmamak. 'Remind me to call him' ama 'I remember calling him'.","Please *remind* me to submit the final report before the deadline.","Lütfen bana, son tarihten önce nihai raporu teslim etmemi hatırlat.","Few people *remember* the details of the debate that took place decades ago.","Çok az kişi onlarca yıl önce yapılan tartışmanın ayrıntılarını hatırlar."],["damage","harm","n","hasar (nesneye, maddi)","zarar (kişiye, yarar zarar)","Damage = nesneye ve mala verilen somut hasar (damage to bridges). Harm = kişiye, sağlığa, çıkara verilen zarar; kalıplar: do no harm, there is no harm in -ing, mean no harm.","The earthquake caused severe *damage* to bridges and roads throughout the region.","Deprem bölge genelindeki köprü ve yollarda ağır hasara yol açtı.","It does no *harm* to ask participants to explain their answers in more detail.","Katılımcılardan cevaplarını daha ayrıntılı açıklamalarını istemenin zararı olmaz."],["rise","raise","v","yükselmek (nesne almaz)","yükseltmek, artırmak (nesne alır)","Rise (rose, risen) geçişsizdir, kendiliğinden yükselir: prices rise. Raise (raised, raised) geçişlidir, nesne ister: raise prices/funds/awareness. Raise = cause to rise.","Housing prices are expected to *rise* sharply over the next few years.","Konut fiyatlarının önümüzdeki birkaç yıl içinde keskin biçimde yükselmesi bekleniyor.","The central bank decided to *raise* interest rates in order to control inflation.","Merkez bankası enflasyonu kontrol altına almak için faiz oranlarını artırmaya karar verdi."],["lie","lay","v","uzanmak, bulunmak (nesne almaz)","koymak, sermek (nesne alır)","Lie (lay, lain) = yatmak, bulunmak; nesne almaz. Lay (laid, laid) = bir şeyi yatay koymak; nesne ister (lay the foundations, lay the groundwork). Lay aynı zamanda lie'ın geçmiş zamanıdır!","The ruins are believed to *lie* beneath the surface of the modern town.","Kalıntıların modern kasabanın yüzeyinin altında yattığına inanılıyor.","The commission's report aims to *lay* the groundwork for a broader reform of the education system.","Komisyonun raporu, eğitim sisteminde daha kapsamlı bir reformun temelini atmayı amaçlıyor."],["lend","borrow","v","ödünç vermek","ödünç almak","Lend = kendi malını başkasına geçici olarak verir (lend sb sth). Borrow = başkasından geçici olarak alır (borrow sth from sb). Banka kredi verir = lend; sen kredi alırsın = borrow.","Banks are often reluctant to *lend* money to small businesses without sufficient collateral.","Bankalar, yeterli teminat olmadan küçük işletmelere borç vermekte genellikle isteksizdir.","Many students have to *borrow* money from the government to pay their tuition fees.","Birçok öğrenci harçlarını ödemek için devletten borç almak zorunda kalıyor."],["whereas","because","conj","oysa, -ken (karşıtlık)","çünkü (neden)","Whereas iki durumu karşılaştırıp karşıtlık kurar (oysa). Because neden bildirir (çünkü). Cümleyi okurken 'zıtlık mı, sebep mi?' diye sor; ikisi de yan cümle bağlacıdır.","Primary education is compulsory in most countries, *whereas* preschool attendance is usually optional.","Çoğu ülkede ilköğretim zorunludur, oysa okul öncesi eğitime katılım genellikle isteğe bağlıdır.","Many farmers migrated to the cities *because* agricultural incomes had fallen steadily.","Tarımsal gelirler sürekli düştüğü için birçok çiftçi şehirlere göç etti."],["during","while","prep","-de, boyunca (isimle)","-ken (cümleyle)","During + isim/isim öbeği (during the war). While + özne + fiil ya da -ing (while he was studying, while studying). During'den sonra tam cümle gelmez.","Several important reforms were introduced *during* the second half of the nineteenth century.","Birçok önemli reform on dokuzuncu yüzyılın ikinci yarısında getirildi.","Parents often feel anxious *while* their children are taking national examinations.","Ebeveynler, çocukları ulusal sınavlara girerken sıklıkla kaygı duyar."],["among","between","prep","-in arasında (ikiden fazla/grup)","-in arasında (iki, belirli)","Between = iki (ya da tek tek ele alınan belirli) öğe arasında: between the two states. Among = ikiden fazla, belirsiz bir grup içinde: among young people.","Unemployment is especially high *among* young people with no formal qualifications.","İşsizlik, özellikle resmi bir niteliği olmayan gençler arasında yüksektir.","The treaty established a new border *between* the two neighbouring states.","Antlaşma, komşu iki devlet arasında yeni bir sınır belirledi."],["fewer","less","adj","daha az (sayılabilir çoğul)","daha az (sayılamayan)","Fewer + sayılabilir çoğul isim (fewer students, fewer jobs). Less + sayılamayan isim (less water, less access, less money). 'Less students' günlük dilde duyulsa da hatalı sayılır.","*Fewer* students are choosing to study philosophy than a decade ago.","Felsefe okumayı seçen öğrenci sayısı on yıl öncesine göre daha az.","Developing countries often have *less* access to clean energy than industrialised nations.","Gelişmekte olan ülkelerin temiz enerjiye erişimi genellikle sanayileşmiş ülkelere göre daha azdır."],["amount","number","n","miktar (sayılamayan isimle)","sayı (sayılabilir çoğulla)","Number of + sayılabilir çoğul isim (a number of employees). Amount of + sayılamayan isim (an amount of money, water, time). 'The amount of people' hatalıdır.","A large *amount* of public money was spent on the new transport network.","Yeni ulaşım ağına büyük miktarda kamu parası harcandı.","A growing *number* of employees now prefer to work from home.","Giderek artan sayıda çalışan artık evden çalışmayı tercih ediyor."],["sympathy","empathy","n","acıma, başsağlığı, üzülme","empati (kendini yerine koyma)","Sympathy = başkasının acısına dışarıdan üzülmek, taziye. Empathy = kendini karşısındakinin yerine koyup duygusunu paylaşmak ve anlamak; sosyal bilimlerde sık geçen terimdir.","The president offered his *sympathy* to the families of the victims.","Başkan, kurbanların ailelerine başsağlığı diledi.","Cultural anthropologists develop *empathy* by trying to see the world through the eyes of the community they study.","Kültürel antropologlar, araştırdıkları topluluğun gözünden dünyaya bakmaya çalışarak empati geliştirir."],["wage","salary","n","ücret (saatlik/haftalık)","maaş (sabit aylık/yıllık)","Wage = saat, gün veya hafta başına ödenen ücret (hourly wage, minimum wage). Salary = sabit aylık ya da yıllık maaş, genelde beyaz yaka ve yöneticiler için.","Many part-time workers earn an hourly *wage* that barely covers their rent.","Birçok yarı zamanlı çalışan, kirasını zar zor karşılayan saatlik bir ücret kazanır.","Managers usually receive a fixed annual *salary* rather than payment by the hour.","Yöneticiler genellikle saat başına ödeme yerine sabit bir yıllık maaş alır."],["custom","habit","n","gelenek, görenek (toplumsal)","alışkanlık (bireysel)","Custom = bir toplumun ya da grubun sürdürdüğü gelenek. Habit = bireyin tekrarla edindiği alışkanlık (break a habit). Customs (çoğul) ayrıca 'gümrük' demektir.","It is a long-standing *custom* in many villages to share the harvest with neighbours.","Birçok köyde hasadı komşularla paylaşmak köklü bir gelenektir.","Checking one's phone every few minutes is a *habit* that many people find difficult to break.","Telefona birkaç dakikada bir bakmak, birçok insanın bırakmakta zorlandığı bir alışkanlıktır."],["ethical","moral","adj","etik (meslek/kurum ilkeleri)","ahlaki (kişisel vicdan, doğru-yanlış)","Ethical = dışarıdan konan, meslek ya da kurum kurallarıyla ilgili (ethical guidelines, ethical approval). Moral = kişisel vicdan ve doğru-yanlış anlayışı (moral duty, moral support).","The journal rejected the article because it violated basic *ethical* guidelines on research with human subjects.","Dergi, makale insan denekli araştırmalara ilişkin temel etik ilkeleri ihlal ettiği için makaleyi reddetti.","Friends offered her *moral* support throughout the long and exhausting trial.","Arkadaşları, uzun ve yorucu dava süresince ona moral destek verdi."],["alone","lonely","adj","yalnız, tek başına (durum)","yalnızlık hisseden (duygu)","Alone = yanında kimse yok, nesnel durum (live alone). Lonely = yalnızlık hissi, üzüntü (feel lonely). Kalabalıkta lonely olunabilir ama alone olunamaz.","Many elderly people live *alone* but remain socially active through community centres.","Birçok yaşlı tek başına yaşar ancak toplum merkezleri aracılığıyla sosyal açıdan aktif kalır.","Long-term unemployment often leaves people feeling isolated and *lonely*, even when they are surrounded by others.","Uzun süreli işsizlik, insanları çevrelerinde başkaları olsa bile yalıtılmış ve yalnız hissettirir."],["refuse","reject","v","reddetmek (+ to fiil; yapmamak)","reddetmek (+ isim; geri çevirmek)","Refuse + to-inf (refuse to pay) ya da istek/teklif: bir eylemi yapmamaktır. Reject + isim (reject a proposal, a theory, an application): fikir, başvuru, teklifi geri çevirmektir; 'to' almaz.","Some employers *refuse* to recognise trade unions, which weakens workers' bargaining power.","Bazı işverenler sendikaları tanımayı reddeder; bu da işçilerin pazarlık gücünü zayıflatır.","Most economists *reject* the claim that lower taxes always lead to higher growth.","Çoğu iktisatçı, düşük vergilerin her zaman daha yüksek büyümeye yol açtığı iddiasını reddeder."],["prevent","avoid","v","önlemek, engellemek","kaçınmak, uzak durmak","Prevent = bir şeyin olmasını engellemek: prevent sb FROM -ing. Avoid = bir şeyden bilerek kaçınmak: avoid -ing. Avoid 'from' almaz; prevent'in ardından doğrudan -ing gelmez.","Early intervention programmes can *prevent* many children from dropping out of school.","Erken müdahale programları, birçok çocuğun okulu bırakmasını önleyebilir.","Politicians often *avoid* discussing sensitive issues during election campaigns.","Siyasetçiler seçim kampanyaları sırasında hassas konuları tartışmaktan sıklıkla kaçınır."],["cause","reason","n","neden (sonucu doğuran etken)","gerekçe, açıklama","Cause = olayı doğuran etken: the cause of X. Reason = bir davranış ya da sonuç için verilen gerekçe: the reason for X, the reason why. 'Reason of' hatalıdır.","Poverty is widely regarded as a major *cause* of political instability in fragile states.","Yoksulluk, kırılgan devletlerde siyasi istikrarsızlığın başlıca nedeni olarak yaygın biçimde görülür.","The study offers a plausible *reason* why some societies adapt to change faster than others.","Çalışma, bazı toplumların değişime diğerlerinden neden daha hızlı uyum sağladığına dair makul bir açıklama sunuyor."],["like","as","prep","-e benzer, gibi (benzerlik)","sıfatıyla, olarak (rol)","Like + isim = benzerlik (looks like, sounds like). As + isim = görev/sıfat bildirir (work as a teacher, as a result). 'As' ayrıca as if/as though kalıbında benzetme yapar.","At first glance, the proposal looks *like* a simple solution, but it creates new problems.","İlk bakışta öneri basit bir çözüme benziyor, ancak yeni sorunlar yaratıyor.","Many migrants worked *as* cleaners and drivers before they found better jobs.","Birçok göçmen, daha iyi işler bulmadan önce temizlikçi ve şoför olarak çalıştı."],["still","yet","adv","hâlâ (süren durum)","henüz (olumsuz/soruda)","Still = hâlâ, durum sürüyor (olumlu cümlede ya da olumsuzdan önce: still hasn't). Yet = henüz, olumsuz ve soru cümlelerinde, genelde sonda: not yet, Has he arrived yet?","Decades after the reform, many rural schools are *still* without reliable electricity.","Reformdan onlarca yıl sonra bile birçok kırsal okul hâlâ güvenilir elektrikten yoksundur.","The committee has not *yet* published its findings on the matter.","Komite konuyla ilgili bulgularını henüz yayımlamadı."],["doubt","suspect","v","kuşku duymak, pek sanmamak","şüphelenmek, sanmak","Doubt that = bir şeyin doğru olduğundan kuşku duymak ('olmaz sanırım'). Suspect that = bir şeyin doğru ya da kötü olduğunu sanmak, içine doğmak. 'I doubt it will' ile 'I suspect it will' zıt anlamlıdır.","Few economists *doubt* that automation will transform the labour market.","Çok az iktisatçı, otomasyonun işgücü piyasasını dönüştüreceğinden kuşku duyar.","Officials *suspect* that the missing funds were transferred abroad illegally.","Yetkililer, kayıp fonların yasa dışı yollarla yurt dışına aktarıldığından şüpheleniyor."],["famous","notorious","adj","ünlü (olumlu/nötr)","kötü şöhretli (olumsuz)","Famous = iyi ya da nötr anlamda ünlü (famous for its libraries). Notorious = kötü nedenle ünlü, kötü şöhretli (notorious for corruption). 'Notorious' her zaman olumsuz çağrışım taşır.","The city is *famous* for its ancient libraries and the scholars who once worked there.","Şehir, antik kütüphaneleri ve bir zamanlar orada çalışan bilginlerle ünlüdür.","The region became *notorious* for corruption and organised crime during the 1990s.","Bölge, 1990'lar boyunca yolsuzluk ve organize suçla kötü bir üne kavuştu."],["nation","state","n","ulus (ortak kimlik)","devlet (siyasi-hukuki yapı)","Nation = ortak dil, tarih ve kültürle bağlı insan topluluğu (ulus). State = sınırları, hükümeti ve kurumları olan siyasi-hukuki yapı (devlet). Nation-state ikisinin örtüştüğü yapıdır.","A shared language, history and culture bind the people of a *nation* together even without a common government.","Ortak bir dil, tarih ve kültür, ortak bir hükümet olmasa bile bir ulusun insanlarını birbirine bağlar.","The *state* holds a legitimate monopoly on the use of force within its territory.","Devlet, kendi sınırları içinde güç kullanımı üzerinde meşru bir tekele sahiptir."],["until","by","prep","-e kadar (süre devam eder)","en geç ... e kadar (son tarih)","Until = o ana kadar sürekli devam eden durum (stay until Friday). By = en geç o zamana kadar, son tarih (submit by Friday). Süreklilik varsa until, teslim/bitiş tarihi varsa by.","The library remains closed *until* the end of the month for renovation.","Kütüphane, yenileme çalışmaları nedeniyle ay sonuna kadar kapalı kalacak.","All applications must be submitted *by* Friday at noon.","Tüm başvurular en geç cuma günü öğlene kadar yapılmalıdır."],["actually","currently","adv","aslında, gerçekte","şu anda, halihazırda","Actually = aslında, gerçekte (şu an anlamı yoktur; Türkçe 'aktüel' yanıltır). Currently = şu anda, bu sıralar. Aynı sahte dost tuzağı: eventually = sonunda, olası değil.","Contrary to what critics claim, the policy has *actually* reduced inequality.","Eleştirmenlerin iddia ettiğinin aksine, politika eşitsizliği gerçekte azaltmıştır.","The new curriculum is *currently* being drafted and will be introduced in schools next year.","Yeni müfredat şu anda hazırlanıyor ve gelecek yıl okullarda uygulamaya konulacak."],["participate","attend","v","katılmak (+ in; aktif rol)","katılmak, bulunmak (edatsız)","Participate + in = bir etkinliğe aktif olarak katılmak (participate in a study). Attend + doğrudan nesne = toplantı, ders, konferansa gitmek, hazır bulunmak. Attend to ise 'ilgilenmek' demektir.","Citizens are more likely to *participate* in local politics when they trust public institutions.","Vatandaşlar, kamu kurumlarına güvendiklerinde yerel siyasete katılma olasılıkları daha yüksektir.","Several hundred delegates will *attend* the international conference in Geneva next month.","Birkaç yüz delege önümüzdeki ay Cenevre'deki uluslararası konferansa katılacak."]];
const READS = [{"id":"the-limits-of-social-norms","t":"The Limits of Social Norms","f":"Sosyoloji","x":"Social norms are {{pervasive}}: they {{constrain}} everyday behaviour so quietly that people rarely notice them until someone breaks one. Most individuals {{conform}} not because a law requires it but because the disapproval of neighbours and colleagues is costly. Yet sociologists {{contend}} that norms are far less {{rigid}} than they appear. Expectations {{vary}} between groups, and members often interpret them in ways that suit their own interests. A rule that once seemed {{obligatory}} may in time become {{obsolete}}, and people simply {{disregard}} it without any formal ban. This flexibility suggests that norms are not fixed instructions but negotiated understandings, constantly {{renewed|renew}} through social interaction.","tr":"Toplumsal normlar her yere nüfuz eder: gündelik davranışı o kadar sessizce kısıtlarlar ki insanlar, biri bir normu çiğneyene kadar onları nadiren fark eder. Bireylerin çoğu uyum sağlar; bunun nedeni bir yasanın bunu gerektirmesi değil, komşuların ve iş arkadaşlarının onaylamamasının bedelinin yüksek olmasıdır. Yine de sosyologlar normların göründüklerinden çok daha az katı olduğunu savunur. Beklentiler gruplar arasında değişir ve üyeler onları çoğu zaman kendi çıkarlarına uyacak biçimde yorumlar. Bir zamanlar zorunlu görünen bir kural zamanla miadını doldurabilir ve insanlar resmî bir yasak olmadan onu görmezden gelir. Bu esneklik, normların sabit talimatlar değil, toplumsal etkileşim yoluyla sürekli yenilenen, müzakere edilmiş ortak anlayışlar olduğunu düşündürür.","q":[{"q":"What is the main point of the passage?","o":["Social norms are rigid rules that are enforced mainly through formal laws and official penalties.","Although norms strongly guide behaviour, they are flexible, negotiated understandings rather than fixed rules.","Groups that share a society always interpret the same norms in exactly the same way.","Norms that have become obsolete should be formally banned so that people are not confused.","People conform to norms mainly because they are afraid of being punished by the courts."],"a":1,"e":"Metin, normların davranışı sessizce sınırladığını ama göründüklerinden daha az katı, değişken ve müzakere edilen anlayışlar olduğunu vurgular (son cümle). Diğer şıklar metinle çelişir."},{"q":"The word 'obsolete' in the passage is closest in meaning to","o":["controversial","compulsory","unpredictable","outdated","enduring"],"a":3,"e":"'Obsolete' miadını doldurmuş, kullanım dışı kalmış demektir; 'outdated' ile eş anlamlıdır. Cümlede kural zamanla bırakılır ve resmî yasak olmadan görmezden gelinir."}]},{"id":"cities-and-the-fate-of-community","t":"Cities and the Fate of Community","f":"Sosyoloji","x":"Rapid {{urbanisation}} is often blamed for the decline of close community life. Critics {{maintain}} that anonymity in large cities {{erodes|erode}} trust, leaving residents {{indifferent}} to the problems of their neighbours. However, researchers have found that such accounts are {{superficial}}. When migrants arrive in unfamiliar districts, they frequently {{cultivate}} new networks based on shared workplaces, religious groups or hobbies. These networks {{sustain}} a form of {{solidarity}} that differs from village life but is no less real. The evidence {{suggests|suggest}} that cities do not destroy social bonds but {{distribute}} them across a wider range of relationships, which people must actively keep alive.","tr":"Hızlı kentleşme, yakın topluluk yaşamının gerilemesinin sorumlusu olarak sıkça gösterilir. Eleştirmenler, büyük şehirlerdeki anonimliğin güveni aşındırdığını ve sakinleri komşularının sorunlarına karşı ilgisiz bıraktığını savunur. Ne var ki araştırmacılar bu tür anlatımların yüzeysel olduğunu saptamıştır. Göçmenler tanımadıkları semtlere geldiklerinde sıklıkla ortak iş yerlerine, dinî gruplara ya da hobilere dayanan yeni ağlar geliştirir. Bu ağlar, köy hayatından farklı ama ondan daha az gerçek olmayan bir dayanışma biçimini ayakta tutar. Kanıtlar, şehirlerin toplumsal bağları yok etmediğini; bunları daha geniş bir ilişkiler yelpazesine dağıttığını ve insanların bu bağları etkin biçimde canlı tutması gerektiğini düşündürmektedir.","q":[{"q":"Which of the following best summarises the passage?","o":["Large cities inevitably destroy the close social bonds that existed in villages.","Migrants who move to unfamiliar districts usually prefer to live without close relationships.","Urban life changes the form of social bonds rather than doing away with them altogether.","Village communities always provide a stronger sense of solidarity than urban networks can.","Critics have proved that anonymity makes city residents indifferent to their neighbours."],"a":2,"e":"Yazar, şehirlerin bağları yok etmediğini, yalnızca daha geniş bir ilişkiler yelpazesine dağıttığını söyler (son cümle). Dayanışma köy hayatından farklıdır ama 'no less real' ile daha az gerçek değildir."},{"q":"The word 'erodes' in the passage is closest in meaning to","o":["gradually weakens","accurately measures","openly challenges","rapidly replaces","carefully protects"],"a":0,"e":"'Erode' zamanla aşındırmak, zayıflatmak demektir. Eleştirmenlere göre anonimlik güveni yavaş yavaş zayıflatır."}]},{"id":"how-advantage-passes-between-generations","t":"How Advantage Passes Between Generations","f":"Sosyoloji","x":"Research on {{stratification}} shows that social position is rarely decided by talent alone. Children from {{affluent}} families usually {{retain}} their parents' advantages, not through a single decision but through a chain of small benefits: better schools, wider contacts and greater confidence {{reinforce}} one another. Young people from poorer homes face a {{formidable}} set of obstacles that {{hamper}} their progress even when they perform well. Some analysts {{argue}} that expanding access to education would {{reduce}} the gap. Others reply that schooling alone is {{insufficient}}, because advantages accumulate long before a child ever enters a classroom.","tr":"Tabakalaşma üzerine araştırmalar, toplumsal konumun nadiren yalnızca yetenekle belirlendiğini gösterir. Varlıklı ailelerin çocukları, ebeveynlerinin avantajlarını çoğunlukla tek bir karar sayesinde değil, bir dizi küçük kazanç zinciri sayesinde korur: daha iyi okullar, daha geniş bağlantılar ve daha yüksek özgüven birbirini pekiştirir. Yoksul ailelerden gelen gençler ise iyi performans gösterseler bile ilerlemelerini köstekleyen göz korkutucu bir engeller dizisiyle karşılaşır. Bazı analistler eğitime erişimin genişletilmesinin bu farkı azaltacağını savunur. Diğerleri ise okullaşmanın tek başına yetersiz olduğunu, çünkü avantajların bir çocuk sınıfa adım atmadan çok önce birikmeye başladığını söyler.","q":[{"q":"What is the main idea of the passage?","o":["Talent is the single most important factor in deciding a person's social position.","Children from poor families usually perform badly at school because they lack natural ability.","Expanding access to education has already removed the gap between rich and poor children.","Wealthy parents deliberately prevent other children from attending the best schools.","Social advantage is handed on through accumulated small benefits, so schooling by itself may not close the gap."],"a":4,"e":"Metin, avantajların küçük kazançlar zinciriyle aktarıldığını ve eğitimin tek başına yetersiz olabileceğini belirtir (son cümle). Diğer şıklar metinle çelişir veya metinde yoktur."},{"q":"Which of the following can replace 'hamper' in the passage without changing the meaning?","o":["assist","hinder","reflect","predict","reward"],"a":1,"e":"'Hamper' engellemek, köstek olmak demektir; 'hinder' aynı anlamdadır. Cümlede engeller, iyi performansa rağmen ilerlemeyi güçleştirir."}]},{"id":"memory-as-reconstruction","t":"Memory as Reconstruction","f":"Psikoloji","x":"Many people assume that memory works like a camera, storing events exactly as they happened. Experimental work {{reveals|reveal}} a different picture. Each time a memory is recalled, it is partly rebuilt from fragments, and the rebuilding is {{susceptible}} to suggestion, mood and later experience. A witness may therefore feel {{convinced|convince}} that an event unfolded in a certain way while the details are far from {{accurate}}. This does not mean that memory is {{arbitrary}}; most recollections {{preserve}} the general outline of what occurred. Psychologists {{emphasise}}, however, that confidence is a poor guide to correctness, so even a {{credible}} witness may be mistaken.","tr":"Pek çok kişi belleğin bir kamera gibi çalıştığını, olayları tam olarak yaşandıkları biçimde depoladığını varsayar. Deneysel çalışmalar ise farklı bir tablo ortaya koyar. Bir anı her hatırlandığında kısmen parçalardan yeniden inşa edilir ve bu yeniden inşa; telkine, ruh haline ve sonraki deneyimlere açıktır. Bu nedenle bir tanık, ayrıntılar doğru olmaktan uzakken bile bir olayın belli bir biçimde geliştiğine ikna olmuş hissedebilir. Bu, belleğin rastgele işlediği anlamına gelmez; anıların çoğu yaşananların genel çerçevesini korur. Yine de psikologlar, özgüvenin doğruluk için zayıf bir ölçüt olduğunu vurgular; bu yüzden güvenilir bir tanık bile yanılabilir.","q":[{"q":"What is the main point of the passage?","o":["Memories are partly rebuilt each time they are recalled, so confidence does not guarantee accuracy.","Human memory records events as faithfully as a camera does, but people interpret them differently.","Witnesses who feel sure about their memories are almost always correct about the details.","Memory is so unreliable that most recollections have no connection with real events.","Mood and suggestion affect memory only when a witness is deliberately dishonest."],"a":0,"e":"Ana fikir: anılar her hatırlamada yeniden kurulur, bu yüzden özgüven doğruluğu garanti etmez. 3. şık 'most recollections preserve the general outline' ifadesiyle çelişir."},{"q":"The word 'arbitrary' in the passage is closest in meaning to","o":["reliable","emotional","random","detailed","recent"],"a":2,"e":"'Arbitrary' keyfî, rastgele demektir. Metin, anıların çoğu genel çerçeveyi koruduğu için belleğin rastgele işlemediğini söyler."}]},{"id":"why-avoidance-feeds-anxiety","t":"Why Avoidance Feeds Anxiety","f":"Psikoloji","x":"People who suffer from {{anxiety}} often try to avoid whatever frightens them. In the short term, avoidance {{relieves|relieve}} their discomfort, which explains why it is so tempting. In the long term, however, it tends to {{exacerbate}} the problem. Because the person never {{confronts|confront}} the feared situation, there is no opportunity to discover that the danger was smaller than imagined, so the situation continues to seem {{daunting}}. Therapists therefore {{urge}} patients to approach difficult situations {{gradually}}, beginning with minor ones and moving upwards in small steps. This approach does not {{eliminate}} discomfort at once, but it {{enables|enable}} patients to replace {{vague}} fear with direct experience.","tr":"Kaygı yaşayan insanlar çoğu zaman kendilerini korkutan her şeyden kaçınmaya çalışır. Kısa vadede kaçınma, rahatsızlıklarını giderir; bu da onun neden bu kadar cazip olduğunu açıklar. Ancak uzun vadede sorunu ağırlaştırma eğilimindedir. Kişi korkulan durumla hiç yüzleşmediği için tehlikenin sanıldığından küçük olduğunu keşfetme fırsatı bulamaz ve o durum yıldırıcı görünmeye devam eder. Bu yüzden terapistler hastaları zor durumlara, küçük olanlardan başlayıp yavaş adımlarla ilerleyerek, giderek yaklaşmaya teşvik eder. Bu yaklaşım rahatsızlığı bir anda ortadan kaldırmaz; ancak hastaların belirsiz korkunun yerine doğrudan deneyimi koymasını mümkün kılar.","q":[{"q":"What does the passage mainly explain?","o":["Anxiety disappears completely once a person learns to avoid every frightening situation.","Avoiding feared situations is the most effective long-term treatment for anxiety.","Therapists believe that patients should face their greatest fear immediately and without preparation.","Avoidance brings short-term comfort but keeps the fear alive, which is why gradual exposure is preferred.","Most fears are justified because the dangers involved are usually greater than people imagine."],"a":3,"e":"Metin, kaçınmanın kısa vadede rahatlattığını ama uzun vadede sorunu ağırlaştırdığını, bu yüzden kademeli yaklaşımın önerildiğini anlatır."},{"q":"Which of the following would a therapist described in the passage most likely recommend to a person who is afraid of public speaking?","o":["Avoiding every situation in which speaking is expected","Speaking briefly to a few familiar people and slowly widening the audience","Giving a long speech to a large audience at once","Waiting until the fear has completely disappeared before trying","Ignoring the fear and hoping that other people will not notice it"],"a":1,"e":"Terapistler hastaları küçük adımlarla, kademeli biçimde zor durumlara yaklaştırır; 2. şık bu ilkeyi yansıtır. Diğerleri kaçınmayı ya da ani yüzleşmeyi önerir."}]},{"id":"when-rewards-backfire","t":"When Rewards Backfire","f":"Psikoloji","x":"Common sense holds that rewards {{motivate}} people to work harder. Psychologists have found that the relationship is more {{ambiguous}}. People who perform a task for its own sake are driven by {{intrinsic}} motivation, and in such cases an offer of payment can {{undermine}} their enthusiasm. An activity that once seemed enjoyable begins to feel like a duty, and interest {{diminishes|diminish}} once the {{incentive}} is removed. Some scholars {{assert}} that this effect appears mainly when rewards are used to control behaviour. When a reward instead provides useful feedback about competence, it may {{enhance}} rather than weaken interest. The lesson is that the manner in which an offer is structured matters as much as its size.","tr":"Sağduyu, ödüllerin insanları daha çok çalışmaya motive ettiğini söyler. Psikologlar ise ilişkinin bundan daha belirsiz olduğunu saptamıştır. Bir işi yalnızca kendi iyiliği için yapan insanları içsel motivasyon yönlendirir ve böyle durumlarda para teklif edilmesi onların hevesini baltalayabilir. Bir zamanlar keyifli görünen etkinlik bir göreve dönüşmeye başlar ve teşvik ortadan kalkınca ilgi azalır. Bazı bilim insanları bu etkinin esas olarak ödüllerin davranışı denetlemek için kullanıldığı durumlarda ortaya çıktığını ileri sürer. Bir ödül bunun yerine yetkinlik hakkında yararlı geri bildirim sağladığında ilgiyi zayıflatmak yerine artırabilir. Çıkarılacak ders şudur: bir teklifin nasıl kurgulandığı, büyüklüğü kadar önemlidir.","q":[{"q":"What is the main idea of the passage?","o":["Payment always increases the interest that people feel in the tasks they perform.","The effect of a reward depends on the kind of motivation involved and on how the reward is used.","People who enjoy a task should never be given feedback about their performance.","Large rewards are more harmful than small rewards in every kind of situation.","Psychologists have shown that common sense about rewards is entirely correct."],"a":1,"e":"Metin, ödülün etkisinin içsel motivasyona ve ödülün nasıl kullanıldığına bağlı olduğunu anlatır; son cümle teklifin yapısının büyüklüğü kadar önemli olduğunu söyler."},{"q":"The word 'ambiguous' in the passage is closest in meaning to","o":["predictable","harmful","temporary","recent","unclear"],"a":4,"e":"'Ambiguous' belirsiz demektir. Psikologlara göre ödül ile çaba arasındaki ilişki sağduyunun varsaydığından daha az net, daha belirsizdir."}]},{"id":"feedback-that-helps-learners","t":"Feedback That Helps Learners","f":"Eğitim","x":"Teachers spend a large share of their working hours marking assignments, yet the value of this effort depends on what the comments actually say. A {{cursory}} remark such as 'good work' tells pupils little about how to {{improve}}. By contrast, {{constructive}} feedback {{clarifies|clarify}} which parts of an answer were sound and which were weak, and it points to a specific next step. Studies of classroom practice {{indicate}} that learners {{grasp}} difficult ideas more quickly when they receive such guidance soon after finishing a task. Feedback that arrives weeks later is {{considerably}} less useful, since the pupil has already moved on. Schools that wish to {{foster}} independent learning should therefore treat the quality and timing of comments as {{crucial}}.","tr":"Öğretmenler çalışma saatlerinin büyük bir bölümünü ödev notlandırmaya harcar; ancak bu çabanın değeri, yorumların gerçekte ne söylediğine bağlıdır. 'Güzel çalışma' gibi üstünkörü bir not, öğrencilere nasıl gelişebilecekleri konusunda pek bir şey söylemez. Buna karşılık yapıcı geri bildirim, bir cevabın hangi bölümlerinin sağlam, hangilerinin zayıf olduğunu açıklığa kavuşturur ve belirli bir sonraki adımı gösterir. Sınıf uygulamaları üzerine yapılan çalışmalar, öğrencilerin zor fikirleri, bir görevi bitirdikten kısa süre sonra böyle bir rehberlik aldıklarında daha hızlı kavradığını gösterir. Haftalar sonra gelen geri bildirim, öğrenci çoktan başka konuya geçtiği için hatırı sayılır ölçüde daha az yararlıdır. Bu nedenle bağımsız öğrenmeyi geliştirmek isteyen okullar, yorumların kalitesini ve zamanlamasını belirleyici saymalıdır.","q":[{"q":"What is the main point of the passage?","o":["Teachers would improve their teaching if they spent fewer hours marking assignments.","Praise motivates pupils more effectively than detailed and critical comments do.","Feedback improves learning most when it is specific and given soon after the task.","Independent learning is possible only when teachers avoid writing any comments.","Pupils usually ignore the comments that their teachers write on assignments."],"a":2,"e":"Metin, ayrıntılı ve zamanında verilen geri bildirimin öğrenmeyi en çok geliştirdiğini vurgular; gecikmiş veya yüzeysel geri bildirim daha az yararlıdır."},{"q":"The word 'cursory' in the passage is closest in meaning to","o":["harsh and unfair","detailed and carefully written","frequent and repetitive","brief and lacking detail","private and confidential"],"a":3,"e":"'Cursory' üstünkörü, şöyle bir demektir. 'Good work' gibi kısa bir not nasıl gelişileceği hakkında ayrıntı vermez; karşıtı ayrıntılı 'constructive' geri bildirimdir."}]},{"id":"compulsory-schooling-is-not-enough","t":"Compulsory Schooling Is Not Enough","f":"Eğitim","x":"Most countries have made schooling {{compulsory}} up to a certain age, assuming that a legal requirement will keep children in classrooms. In practice, however, {{enrolment}} figures tell only part of the story. Many registered pupils stay away for weeks, and some leave for good. Families facing hardship may be {{reluctant}} to send older children to school when those children could add to the household income. In such cases a law cannot {{secure}} attendance on its own. Programmes that give small cash payments to poor households have {{demonstrated|demonstrate}} that modest support can {{lessen}} the pressure to withdraw a child. Such measures {{address}} the underlying cause instead of simply {{penalising|penalise}} parents.","tr":"Çoğu ülke, yasal bir zorunluluğun çocukları sınıflarda tutacağını varsayarak okullaşmayı belli bir yaşa kadar zorunlu kılmıştır. Ancak uygulamada kayıt rakamları hikâyenin yalnızca bir kısmını anlatır. Kayıtlı öğrencilerin çoğu haftalarca okula gitmez, bazıları da kalıcı olarak ayrılır. Zor durumdaki aileler, daha büyük çocuklar hane gelirine katkıda bulunabilecekken onları okula göndermekte isteksiz olabilir. Böyle durumlarda bir yasa, devamı tek başına güvence altına alamaz. Yoksul hanelere küçük nakit ödemeler yapan programlar, mütevazı bir desteğin bir çocuğu okuldan almaya yönelik baskıyı hafifletebileceğini göstermiştir. Bu tür önlemler, ebeveynleri basitçe cezalandırmak yerine sorunun altında yatan nedeni ele alır.","q":[{"q":"What is the main idea of the passage?","o":["Compulsory schooling laws have successfully ended school dropout in most countries.","Parents who keep their children at home should be punished more severely than they are now.","Older children gain more from working for the household than from attending school.","Enrolment figures are the most reliable measure of how well an education system works.","Laws requiring attendance are not enough unless the economic pressures on poor families are also addressed."],"a":4,"e":"Metin, yasal zorunluluğun tek başına devamı sağlayamadığını ve nakit desteğin sorunun kaynağına yöneldiğini anlatır. Diğer şıklar metinle uyuşmaz."},{"q":"The word 'reluctant' in the passage is closest in meaning to","o":["eager","unable","unwilling","required","careless"],"a":2,"e":"'Reluctant' isteksiz demektir; 'unwilling' ile eş anlamlıdır. Cümlede aileler, çocukları gelir getirebilecekken onları okula göndermeye gönülsüzdür."}]},{"id":"teaching-students-to-question","t":"Teaching Students to Question","f":"Eğitim","x":"Educators frequently {{claim}} that schools should teach critical thinking, yet the phrase is rarely defined in {{precise}} terms. At its core, the skill involves the ability to {{evaluate}} evidence, {{challenge}} assumptions and notice weaknesses in an argument. Such abilities cannot be {{acquired|acquire}} simply by memorising facts. They {{require}} repeated practice with open questions, ideally in classrooms where mistakes are treated as part of learning. This approach is {{demanding}}, because teachers must give up the comfortable role of sole authority and {{encourage}} pupils to question what they are told. The effort is worthwhile, however: students who practise testing statements are better prepared to {{handle}} the {{copious}} and often unreliable information they meet outside school.","tr":"Eğitimciler okulların eleştirel düşünmeyi öğretmesi gerektiğini sık sık iddia eder, ancak bu ifade nadiren kesin terimlerle tanımlanır. Özünde bu beceri; kanıtları değerlendirme, varsayımlara itiraz etme ve bir argümandaki zayıflıkları fark etme yeteneğini kapsar. Bu tür yetenekler yalnızca bilgileri ezberleyerek edinilemez. Hataların öğrenmenin bir parçası sayıldığı sınıflarda, açık uçlu sorularla tekrarlı bir uygulama gerektirirler. Bu yaklaşım zorludur, çünkü öğretmenler tek otorite olmanın rahat rolünden vazgeçmeli ve öğrencileri kendilerine söylenenleri sorgulamaya teşvik etmelidir. Yine de çaba değerlidir: ifadeleri sınamayı alıştırma haline getiren öğrenciler, okul dışında karşılaştıkları bol ve çoğu zaman güvenilmez bilgiyi yönetmeye daha hazırdır.","q":[{"q":"What is the main point of the passage?","o":["Critical thinking has to be developed through practice with open questions, which also changes the teacher's role.","Memorising facts is the best foundation on which critical thinking can later be built.","Teachers should avoid correcting students' mistakes if they want pupils to feel confident.","Critical thinking can be taught only to students who already distrust the information they receive.","Schools have already defined critical thinking in precise terms that educators generally accept."],"a":0,"e":"Metin, eleştirel düşünmenin ezberle değil açık uçlu sorularla tekrarlı uygulamayla kazanıldığını ve öğretmenin otorite rolünden vazgeçmesi gerektiğini söyler."},{"q":"The word 'copious' in the passage is closest in meaning to","o":["valuable","plentiful","outdated","technical","limited"],"a":1,"e":"'Copious' bol, çok miktarda demektir; 'plentiful' ile eş anlamlıdır. Öğrenciler okul dışında çok fazla ve çoğu zaman güvenilmez bilgiyle karşılaşır."}]},{"id":"the-hidden-debt-of-gift-giving","t":"The Hidden Debt of Gift Giving","f":"Antropoloji","x":"Anthropologists have long observed that gifts are rarely free, despite their {{apparent}} generosity. In many communities, a present creates an expectation that the receiver will respond in kind at some later time. The return is not {{mandatory}} in any legal sense, yet failing to make one can {{provoke}} resentment and damage a reputation. To {{rebuff}} a gift is therefore to {{reject}} the relationship it proposes. Exchange of this kind {{nurtures|nurture}} ties between households over many years, since each gift leaves a small debt that is never fully cleared. Seen in this light, the unpaid debt is not a flaw but an {{inherent}} feature of the exchange, the very thing that keeps a {{lasting}} relationship alive.","tr":"Antropologlar, hediyelerin görünürdeki cömertliğine rağmen nadiren karşılıksız olduğunu uzun zamandır gözlemlemektedir. Pek çok toplulukta bir hediye, alıcının daha sonraki bir zamanda karşılık vereceği beklentisini doğurur. Karşılık vermek yasal anlamda zorunlu değildir; ancak vermemek kızgınlığa yol açabilir ve itibara zarar verebilir. Bu nedenle bir hediyeyi geri çevirmek, onun önerdiği ilişkiyi reddetmek demektir. Bu tür değiş tokuş, haneler arasındaki bağları uzun yıllar boyunca besler; çünkü her hediye, hiçbir zaman tam olarak kapanmayan küçük bir borç bırakır. Bu açıdan bakıldığında ödenmemiş borç bir kusur değil, değiş tokuşun doğasında var olan bir özelliktir; kalıcı bir ilişkiyi canlı tutan şeyin ta kendisidir.","q":[{"q":"What is the main point of the passage?","o":["Gift giving is a legal duty that is enforced by the courts in many societies.","People give gifts mainly in order to display their wealth to their neighbours.","Gifts that are returned immediately are valued more highly than those returned later.","Gifts create unwritten obligations that help to keep social relationships going.","Anthropologists disagree about whether gift exchange has any social function at all."],"a":3,"e":"Metin, hediyenin yasayla değil beklentiyle doğan yazısız yükümlülükler yarattığını ve bu borcun ilişkiyi canlı tuttuğunu söyler."},{"q":"The author mentions a debt that is 'never fully cleared' in order to suggest that","o":["unfinished obligations help to keep a relationship active","most people eventually forget the gifts they have received","gift exchange often ends in open conflict between families","the value of a gift should always be repaid exactly","gifts are less important than formal agreements between households"],"a":0,"e":"Yazar, kapanmayan borcun bir kusur değil, ilişkiyi canlı tutan unsur olduğunu belirtir (son cümle). Diğer şıklar bu yoruma aykırıdır."}]},{"id":"mobility-as-a-herding-strategy","t":"Mobility as a Herding Strategy","f":"Antropoloji","x":"Outsiders have often {{portrayed|portray}} {{nomadic}} herders as people who wander in a {{haphazard}} fashion, driven by habit rather than reason. Careful fieldwork tells a different story. Because rainfall and pasture {{fluctuate}} from year to year, herders in dry regions depend on {{scarce}} and unpredictable resources. They {{deliberately}} move animals between areas at chosen times, which spreads the risk of a poor season. A {{sedentary}} community tied to a single patch of land would be far more {{vulnerable}} to drought. Mobility, in other words, is not a sign of disorder but a sophisticated form of {{adaptation}} that {{safeguards|safeguard}} livelihoods in harsh environments.","tr":"Dışarıdan bakanlar göçebe çobanları çoğu zaman, mantıktan çok alışkanlıkla hareket eden, gelişigüzel dolaşan insanlar olarak betimlemiştir. Dikkatli saha çalışmaları ise farklı bir hikâye anlatır. Yağış ve otlak yıldan yıla dalgalandığı için kurak bölgelerdeki çobanlar kıt ve öngörülemeyen kaynaklara bağımlıdır. Hayvanlarını bilinçli olarak belirli zamanlarda bölgeler arasında taşırlar; bu da kötü bir mevsimin riskini yayar. Tek bir toprak parçasına bağlı yerleşik bir topluluk kuraklığa karşı çok daha savunmasız olurdu. Başka bir deyişle hareketlilik bir düzensizlik işareti değil, zorlu ortamlarda geçim kaynaklarını güvence altına alan gelişmiş bir uyum biçimidir.","q":[{"q":"What is the main idea of the passage?","o":["Nomadic herders move without any plan because good pasture is always abundant.","Settled communities cope with drought more successfully than mobile herders do.","The movement of nomadic herders is a calculated response to unpredictable conditions.","Outsiders have studied nomadic herders more carefully than they have studied settled farmers.","Herders move from place to place mainly because they are bound by habit and tradition."],"a":2,"e":"Metin, göçebe hareketliliğin plansız dolaşma değil, belirsiz çevre koşullarına karşı hesaplı bir uyum stratejisi olduğunu savunur."},{"q":"The word 'haphazard' in the passage is closest in meaning to","o":["peaceful","cautious","traditional","rapid","unplanned"],"a":4,"e":"'Haphazard' plansız, gelişigüzel demektir. Dışarıdan bakanlar çobanların mantıkla değil alışkanlıkla, rastgele dolaştığını sanır; metin bunu çürütür."}]},{"id":"what-rituals-actually-do","t":"What Rituals Actually Do","f":"Antropoloji","x":"Rituals are {{ubiquitous}} in human societies, from small family ceremonies to large public festivals. Outside observers often {{dismiss}} them as empty tradition, but anthropologists {{stress}} that they perform real social work. A ceremony that marks the passage from childhood to adulthood, for example, publicly announces a new status and makes it {{legitimate}} in the eyes of others. Participants {{perceive}} the change as genuine because the whole community has witnessed it. Rituals also {{uphold}} shared values by linking the present generation to its {{ancestors|ancestor}}, and they offer an {{enduring}} sense of belonging even when ordinary life is changing quickly.","tr":"Ritüeller, küçük aile törenlerinden büyük kamusal şenliklere kadar insan toplumlarında her yerde bulunur. Dışarıdan gözlemciler onları çoğu zaman boş bir gelenek diye geçersiz sayar; oysa antropologlar bunların gerçek bir toplumsal iş gördüğünün altını çizer. Örneğin çocukluktan yetişkinliğe geçişi işaretleyen bir tören, yeni bir statüyü herkese açıkça ilan eder ve onu başkalarının gözünde meşru kılar. Katılımcılar, bütün topluluk buna tanık olduğu için değişimi gerçek olarak algılar. Ritüeller ayrıca bugünkü kuşağı atalarına bağlayarak ortak değerleri korur ve gündelik yaşam hızla değişirken bile kalıcı bir aidiyet duygusu sunar.","q":[{"q":"What is the main point of the passage?","o":["Rituals are empty traditions that are gradually losing their importance in modern life.","Rituals serve real social purposes, such as confirming new statuses and sustaining shared values.","Rituals are performed mainly to honour ancestors rather than to guide the living.","Only large public festivals have any lasting effect on the life of a community.","Anthropologists agree with outside observers that rituals have little practical value."],"a":1,"e":"Metin, ritüellerin yeni statüyü onaylama ve ortak değerleri koruma gibi gerçek toplumsal işlevleri olduğunu savunur."},{"q":"The word 'dismiss' in the passage is closest in meaning to","o":["explain in detail","take part in","defend openly","treat as unimportant","record carefully"],"a":3,"e":"'Dismiss' önemsiz ya da geçersiz saymak demektir. Gözlemciler ritüelleri boş gelenek olarak görür; antropologlar ise 'but' ile bunun tersini vurgular."}]},{"id":"when-prices-outrun-wages","t":"When Prices Outrun Wages","f":"Ekonomi","x":"Economists have long debated why {{inflation}} persists even after central banks tighten policy. One {{theory}} holds that firms simply pass rising costs on to consumers, while another stresses that households expect higher prices and behave in ways that {{trigger}} the very increases they fear. The problem is {{compounded|compound}} when {{wage}} agreements are linked to past price movements, since employers then raise prices again to cover their higher labour costs. Because {{income}} rarely keeps pace with such increases, the burden falls most heavily on {{vulnerable}} groups with few savings. Policymakers therefore face a hard choice: a sharp rise in interest rates may {{curb}} price growth, but it can also deepen a {{recession}} and push unemployment higher.","tr":"İktisatçılar, merkez bankaları politikayı sıkılaştırdıktan
